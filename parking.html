<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>🚗 세이린 가게 주차 캘린더</title>
<link rel="icon" href="favicon.svg?v=1">
<style>
  :root{
    --pink:#e88295; --pink-deep:#be465e; --pink-light:#fff4f6; --pink-line:#f2d9df;
    --text:#26232a; --muted:#6f6a78; --dim:#9a95a2;
    --bg:#fbf8f9; --card:#ffffff; --line:#f0e6ea;
    --shadow:0 4px 16px rgba(190,70,94,.07);
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    font-size:14px; line-height:1.45;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer;}
  input{font-family:inherit; font-size:15px;}

  /* 상단 */
  .top{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px 12px calc(16px + env(safe-area-inset-left));
    background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top h1{margin:0; font-size:16px; font-weight:800; letter-spacing:-.02em;}
  .top h1 .emoji{font-size:16px;}
  .me{
    display:flex; align-items:center; gap:5px; flex:0 0 auto;
    max-width:132px; padding:7px 11px; border-radius:999px;
    background:var(--pink-light); border:1px solid var(--pink-line);
    font-size:12px; font-weight:700; color:var(--pink-deep);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  main{
    max-width:560px; margin:0 auto; padding:14px 12px 40px;
    display:flex; flex-direction:column; gap:12px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px;
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .card-head h2{margin:0; font-size:13px; font-weight:800; color:var(--text);}
  .card-head h2 span{font-weight:700; color:var(--dim); font-size:11px; margin-left:4px;}
  .add-person{
    padding:6px 11px; border-radius:999px; font-size:12px; font-weight:700;
    color:var(--pink-deep); background:var(--pink-light); border:1px solid var(--pink-line);
  }
  .add-person[disabled]{color:var(--dim); background:#f7f5f6; border-color:#eee9ec;}

  /* 사람 칩 */
  .chips{display:flex; flex-wrap:wrap; gap:7px; min-height:34px; align-items:center;}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 11px 7px 9px; border-radius:999px;
    background:#fff; border:1px solid var(--line);
    font-size:13px; font-weight:700; max-width:100%;
  }
  .chip .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .chip .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;}
  .chip .cnt{font-size:11px; font-weight:700; color:var(--dim);}
  .chips .empty{font-size:12px; color:var(--dim);}

  /* 달력 */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cal-head .nav{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:700; color:var(--pink-deep); background:var(--pink-light);
  }
  .cal-title{display:flex; align-items:center; gap:8px;}
  .cal-title b{font-size:15px; font-weight:800; letter-spacing:-.02em;}
  .today-btn{
    padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700;
    color:var(--muted); border:1px solid var(--line); background:#fff;
  }
  .dow{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px;}
  .dow span{text-align:center; font-size:11px; font-weight:700; color:var(--dim); padding:4px 0;}
  .dow span:first-child{color:#d2697b;}
  .dow span:last-child{color:#5b8fc7;}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cell{
    position:relative; display:flex; flex-direction:column; align-items:center;
    min-height:56px; padding:4px 2px 3px; border-radius:10px;
    background:#fff; border:1px solid transparent; text-align:center;
    overflow:hidden;
  }
  .cell:active{background:var(--pink-light);}
  .cell .num{font-size:12px; font-weight:700; color:var(--text); line-height:1.2; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
  .cell.sun .num{color:#d2697b;}
  .cell.sat .num{color:#5b8fc7;}
  .cell.out .num{color:#c9c4ce;}
  .cell.today{background:var(--pink-light); border-color:var(--pink-line);}
  .cell.today .num{background:var(--pink); color:#fff;}
  .cell.sel{border-color:var(--pink); box-shadow:inset 0 0 0 1px var(--pink);}
  .badges{display:flex; flex-direction:column; gap:2px; width:100%; align-items:center; margin-top:1px;}
  .badges i{
    display:block; max-width:100%; padding:1px 3px; border-radius:4px;
    font-size:8.5px; font-style:normal; font-weight:800; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .badges .more{font-size:8.5px; font-weight:800; color:var(--dim);}

  /* 월 요약 */
  .summary{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;
    padding-top:10px; border-top:1px dashed var(--line);
  }
  .summary .s-item{
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 9px; border-radius:999px; background:#fdfbfc; border:1px solid var(--line);
    font-size:11.5px; font-weight:700; color:var(--muted);
  }
  .summary .s-item b{color:var(--text); font-size:11.5px;}
  .summary .s-item i{width:7px; height:7px; border-radius:50%; display:block;}
  .summary .s-none{font-size:11.5px; color:var(--dim);}

  /* 로그 */
  .log{padding:0; overflow:hidden;}
  .log-toggle{
    width:100%; display:flex; align-items:center; gap:7px;
    padding:14px; font-size:13px; font-weight:800; text-align:left;
  }
  .log-toggle .cnt{font-size:11px; font-weight:700; color:var(--dim);}
  .log-toggle .arrow{margin-left:auto; color:var(--dim); font-size:12px; transition:transform .18s;}
  .log.open .log-toggle .arrow{transform:rotate(180deg);}
  .log-list{max-height:320px; overflow-y:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--line);}
  .log-item{display:flex; gap:8px; padding:9px 14px; border-bottom:1px solid #faf6f8; font-size:12px;}
  .log-item:last-child{border-bottom:0;}
  .log-item .at{color:var(--dim); font-weight:700; flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .log-item .body{flex:1 1 auto; min-width:0;}
  .log-item .who{font-weight:800; color:var(--pink-deep);}
  .log-item .act{font-weight:800;}
  .log-item .det{color:var(--muted); margin-left:2px;}
  .log-empty{padding:16px 14px; font-size:12px; color:var(--dim); text-align:center;}

  /* 시트(바텀시트) */
  .sheet-wrap{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center;}
  .sheet-wrap[hidden]{display:none;}
  .sheet-backdrop{position:absolute; inset:0; background:rgba(38,35,42,.34);}
  .sheet{
    position:relative; width:100%; max-width:560px;
    background:#fff; border-radius:20px 20px 0 0;
    padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.12);
    animation:up .2s ease-out;
  }
  @keyframes up{from{transform:translateY(14px); opacity:.6} to{transform:none; opacity:1}}
  .grip{width:36px; height:4px; border-radius:2px; background:#ece6e9; margin:2px auto 10px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .sheet-head b{font-size:15px; font-weight:800;}
  .sheet-head .x{width:30px; height:30px; border-radius:50%; background:#f7f3f5; color:var(--muted); font-size:14px;}

  /* 날짜 시트 토글 행 */
  .toggle-list{display:flex; flex-direction:column; gap:7px;}
  .t-row{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:#fff;
    text-align:left;
  }
  .t-row .dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto;}
  .t-row .nm{font-size:14px; font-weight:800; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .t-row .car{font-size:11px; color:var(--dim); font-weight:600; flex:0 0 auto;}
  .t-row .mark{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    border:1.5px solid #e7e1e5; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:900; color:transparent;
  }
  .t-row.on{border-color:var(--pink); background:var(--pink-light);}
  .t-row.on .mark{background:var(--pink); border-color:var(--pink); color:#fff;}
  .sheet-note{margin:12px 0 0; font-size:11.5px; color:var(--dim); text-align:center;}
  .sheet-empty{padding:18px 6px; text-align:center; font-size:12.5px; color:var(--muted);}

  /* 인원 편집 */
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:11.5px; font-weight:800; color:var(--muted); margin-bottom:5px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line);
    background:#fdfbfc; outline:none;
  }
  .field input:focus{border-color:var(--pink); background:#fff;}
  .swatches{display:flex; gap:9px; flex-wrap:wrap;}
  .sw{width:30px; height:30px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .sw.on{box-shadow:0 0 0 2px var(--pink-deep);}
  .sheet-actions{display:flex; gap:8px; margin-top:14px;}
  .btn{flex:1 1 auto; padding:12px; border-radius:12px; font-size:14px; font-weight:800; text-align:center;}
  .btn.primary{background:var(--pink); color:#fff;}
  .btn.ghost{background:#f8f4f6; color:var(--muted); flex:0 0 96px;}
  .btn.danger{background:#fdf1f3; color:#c24a60; flex:0 0 96px;}

  /* 토스트 */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,12px);
    background:rgba(38,35,42,.92); color:#fff; font-size:12.5px; font-weight:700;
    padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:90; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .foot{text-align:center; font-size:11px; color:var(--dim); padding:2px 0 8px;}
  .foot a{color:var(--dim); text-decoration:none;}

  @media (min-width:640px){
    main{max-width:620px; padding-top:20px;}
    body{font-size:14.5px;}
    .cell{min-height:68px;}
    .badges i{font-size:9.5px;}
    .sheet-wrap{align-items:center;}
    .sheet{border-radius:18px; max-width:440px; padding-bottom:16px;}
    .grip{display:none;}
  }
</style>
</head>
<body>

<header class="top">
  <h1><span class="emoji">🚗</span> 세이린 가게 주차 캘린더</h1>
  <button class="me" id="meBtn" type="button">👤 <span id="meName">내 이름</span></button>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <h2>사람 <span id="peopleCount">0 / 6</span></h2>
      <button class="add-person" id="addPersonBtn" type="button">＋ 추가</button>
    </div>
    <div class="chips" id="peopleChips"></div>
  </section>

  <section class="card">
    <div class="cal-head">
      <button class="nav" id="prevBtn" type="button" aria-label="이전 달">‹</button>
      <div class="cal-title">
        <b id="ymLabel">-</b>
        <button class="today-btn" id="todayBtn" type="button">오늘</button>
      </div>
      <button class="nav" id="nextBtn" type="button" aria-label="다음 달">›</button>
    </div>
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="calGrid"></div>
    <div class="summary" id="monthSummary"></div>
  </section>

  <section class="card log" id="logCard">
    <button class="log-toggle" id="logToggle" type="button">
      📝 등록 로그 <span class="cnt" id="logCount"></span>
      <span class="arrow">▾</span>
    </button>
    <div class="log-list" id="logList" hidden></div>
  </section>

  <div class="foot"><a href="index.html">← 세이린 아카데미</a></div>
</main>

<!-- 날짜 상세 -->
<div class="sheet-wrap" id="dateSheet" hidden>
  <div class="sheet-backdrop" data-close="dateSheet"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <b id="dateTitle">-</b>
      <button class="x" type="button" data-close="dateSheet">✕</button>
    </div>
    <div class="toggle-list" id="dateList"></div>
    <p class="sheet-note" id="dateNote"></p>
  </div>
</div>

<!-- 인원 편집 -->
<div class="sheet-wrap" id="personSheet" hidden>
  <div class="sheet-backdrop" data-close="personSheet"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <b id="personTitle">사람 추가</b>
      <button class="x" type="button" data-close="personSheet">✕</button>
    </div>
    <div class="field">
      <label for="pName">이름</label>
      <input id="pName" type="text" maxlength="12" placeholder="예: 도현" autocomplete="off">
    </div>
    <div class="field">
      <label>색상</label>
      <div class="swatches" id="pColors"></div>
    </div>
    <div class="field">
      <label for="pCar">차량번호 (선택)</label>
      <input id="pCar" type="text" maxlength="20" placeholder="예: 12가 3456" autocomplete="off">
    </div>
    <div class="field">
      <label for="pNote">메모 (선택)</label>
      <input id="pNote" type="text" maxlength="40" placeholder="예: 오전만" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <button class="btn danger" id="personDelete" type="button" hidden>삭제</button>
      <button class="btn primary" id="personSave" type="button">저장</button>
    </div>
  </div>
</div>

<!-- 내 이름 -->
<div class="sheet-wrap" id="nameSheet" hidden>
  <div class="sheet-backdrop" data-close="nameSheet"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <b>내 이름</b>
      <button class="x" type="button" data-close="nameSheet">✕</button>
    </div>
    <div class="field">
      <label for="nameInput">등록 로그에 이 이름이 남습니다</label>
      <input id="nameInput" type="text" maxlength="12" placeholder="예: 도현" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <button class="btn primary" id="nameSave" type="button">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var EXEC = 'https://script.google.com/macros/s/AKfycbxLu7nD0RH1FkCKdmgQkP7AybLKit34KN9ISnuW_pHwYrLW7EaqsWddNWBSGWfJ0S-V5A/exec';
  var MAX = 6;
  var COLORS = ['#e88295','#ef9c5a','#6bbf8a','#5b9bd5','#9a7ad5','#8b95a3'];
  var DOW = ['일','월','화','수','목','금','토'];

  var state = { members: [], entries: [], logs: [] };
  var loaded = false;
  var view = todayMonth();        // {y, m}  m: 0-11
  var selDate = '';
  var me = '';
  var editingId = '';
  var pickingColor = COLORS[0];
  var pending = null;             // 이름 입력 후 실행할 동작
  var chain = Promise.resolve();  // 요청 순서 보장

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function ymd(y, m, d){ return y + '-' + pad(m + 1) + '-' + pad(d); }
  function todayStr(){ var t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }
  function todayMonth(){ var t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; }
  function hexA(hex, a){
    var h = String(hex || '').replace('#','');
    if (h.length !== 6) { h = 'e88295'; }
    var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function openSheet(id){ $(id).hidden = false; }
  function closeSheet(id){ $(id).hidden = true; }

  /* ---------- 저장/불러오기 ---------- */
  function api(params){
    var q = [];
    for (var k in params) {
      if (params[k] === undefined || params[k] === null || params[k] === '') { continue; }
      q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
    var url = EXEC + '?' + q.join('&') + '&_=' + Date.now();
    return fetch(url, { cache: 'no-store', redirect: 'follow' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) { throw new Error((d && d.error) || 'fail'); }
        return d;
      });
  }

  function load(){
    return api({ mode: 'parking_get' }).then(function(d){
      applyState(d);
      loaded = true;
      render();
    }).catch(function(){
      if (!loaded) {
        $('calGrid').innerHTML = '<div style="grid-column:1/-1;padding:26px 0;text-align:center;font-size:12.5px;color:#9a95a2;">연결이 잠시 안 됩니다. 아래로 새로고침하거나 잠시 뒤 다시 열어 주세요.</div>';
      }
    });
  }

  function applyState(d){
    state.members = d.members || [];
    state.entries = d.entries || [];
    state.logs = d.logs || [];
  }

  function run(params, mutate, revert){
    if (mutate) { mutate(); render(); }
    chain = chain.then(function(){ return api(params); }).then(function(d){
      applyState(d);
      render();
    }).catch(function(){
      if (revert) { revert(); }
      render();
      toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    });
  }

  /* ---------- 이름 ---------- */
  function nameReady(cb){
    if (me) { cb(); return; }
    pending = cb;
    $('nameInput').value = '';
    openSheet('nameSheet');
    setTimeout(function(){ try { $('nameInput').focus(); } catch(e){} }, 120);
  }

  function saveName(){
    var v = ($('nameInput').value || '').trim().slice(0, 12);
    if (!v) { toast('이름을 입력해 주세요.'); return; }
    me = v;
    try { localStorage.setItem('pk_me', me); } catch(e){}
    $('meName').textContent = me;
    closeSheet('nameSheet');
    var cb = pending; pending = null;
    if (cb) { cb(); }
  }

  /* ---------- 렌더 ---------- */
  function render(){
    renderPeople();
    renderCal();
    renderSummary();
    renderLog();
    $('meName').textContent = me || '내 이름';
  }

  function memberById(id){
    for (var i = 0; i < state.members.length; i++) { if (state.members[i].id === id) { return state.members[i]; } }
    return null;
  }

  function countInMonth(mid, y, m){
    var pre = y + '-' + pad(m + 1) + '-';
    var n = 0;
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      if (e.m === mid && e.d.indexOf(pre) === 0) { n++; }
    }
    return n;
  }

  function renderPeople(){
    var box = $('peopleChips');
    var html = '';
    if (!state.members.length) {
      html = '<span class="empty">아직 없습니다. 오른쪽 ＋ 추가로 이름을 넣어 주세요.</span>';
    } else {
      for (var i = 0; i < state.members.length; i++) {
        var m = state.members[i];
        var c = countInMonth(m.id, view.y, view.m);
        html += '<button class="chip" type="button" data-pid="' + m.id + '">'
              + '<span class="dot" style="background:' + m.color + '"></span>'
              + '<span class="nm">' + esc(m.name) + '</span>'
              + '<span class="cnt">' + c + '</span>'
              + '</button>';
      }
    }
    box.innerHTML = html;
    $('peopleCount').textContent = state.members.length + ' / ' + MAX;
    var addBtn = $('addPersonBtn');
    addBtn.disabled = state.members.length >= MAX;
    addBtn.textContent = state.members.length >= MAX ? '최대 6명' : '＋ 추가';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function renderCal(){
    var y = view.y, m = view.m;
    $('ymLabel').textContent = y + '년 ' + (m + 1) + '월';
    var first = new Date(y, m, 1);
    var start = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var prevDays = new Date(y, m, 0).getDate();

    var byDate = {};
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      (byDate[e.d] = byDate[e.d] || []).push(e);
    }

    var today = todayStr();
    var cells = 0;
    var html = '';
    // 앞 달
    for (var p = start - 1; p >= 0; p--) {
      var pd = prevDays - p;
      html += cellHtml(ymd(m === 0 ? y - 1 : y, m === 0 ? 11 : m - 1, pd), pd, 'out', false, null);
      cells++;
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var date = ymd(y, m, d);
      var wd = (start + d - 1) % 7;
      var cls = wd === 0 ? 'sun' : (wd === 6 ? 'sat' : '');
      html += cellHtml(date, d, cls, date === today, byDate[date]);
      cells++;
    }
    var rest = (7 - (cells % 7)) % 7;
    for (var q = 1; q <= rest; q++) {
      html += cellHtml(ymd(m === 11 ? y + 1 : y, m === 11 ? 0 : m + 1, q), q, 'out', false, null);
    }
    $('calGrid').innerHTML = html;
  }

  function cellHtml(date, num, cls, isToday, list){
    var c = 'cell ' + (cls || '') + (isToday ? ' today' : '') + (date === selDate ? ' sel' : '');
    var badges = '';
    if (list && list.length) {
      var shown = list.slice(0, 2);
      for (var i = 0; i < shown.length; i++) {
        var e = shown[i];
        var mem = memberById(e.m);
        var color = (mem && mem.color) || e.color || '#e88295';
        var nm = (mem && mem.name) || e.name || '';
        badges += '<i style="background:' + hexA(color, .14) + ';color:' + color + '">' + esc(nm.slice(0, 2)) + '</i>';
      }
      if (list.length > 2) { badges += '<span class="more">+' + (list.length - 2) + '</span>'; }
    }
    return '<button class="' + c + '" type="button" data-date="' + date + '">'
         + '<span class="num">' + num + '</span>'
         + '<span class="badges">' + badges + '</span>'
         + '</button>';
  }

  function renderSummary(){
    var box = $('monthSummary');
    if (!state.members.length) { box.innerHTML = '<span class="s-none">이번 달 주차 요약은 사람을 추가하면 보입니다.</span>'; return; }
    var html = '<span class="s-none" style="align-self:center;">이번 달</span>';
    for (var i = 0; i < state.members.length; i++) {
      var m = state.members[i];
      html += '<span class="s-item"><i style="background:' + m.color + '"></i>' + esc(m.name) + ' <b>' + countInMonth(m.id, view.y, view.m) + '</b>회</span>';
    }
    box.innerHTML = html;
  }

  function renderLog(){
    var list = state.logs.slice().reverse().slice(0, 50);
    $('logCount').textContent = state.logs.length ? '(' + state.logs.length + ')' : '';
    if (!list.length) {
      $('logList').innerHTML = '<div class="log-empty">아직 기록이 없습니다.</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var l = list[i];
      var at = String(l.at || '');
      var when = at.length >= 16 ? at.slice(5, 10).replace('-', '/') + ' ' + at.slice(11, 16) : at;
      html += '<div class="log-item"><span class="at">' + esc(when) + '</span>'
            + '<span class="body"><span class="who">' + esc(l.by || '') + '</span> '
            + '<span class="act">' + esc(l.action || '') + '</span>'
            + (l.detail ? ' <span class="det">' + esc(l.detail) + '</span>' : '')
            + '</span></div>';
    }
    $('logList').innerHTML = html;
  }

  /* ---------- 날짜 시트 ---------- */
  function openDate(date){
    selDate = date;
    var parts = date.split('-');
    var dt = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    $('dateTitle').textContent = (+parts[1]) + '월 ' + (+parts[2]) + '일 (' + DOW[dt.getDay()] + ')';
    renderDateList();
    renderCal();
    openSheet('dateSheet');
  }

  function entriesOf(date){
    return state.entries.filter(function(e){ return e.d === date; });
  }

  function renderDateList(){
    var box = $('dateList');
    if (!state.members.length) {
      box.innerHTML = '<div class="sheet-empty">먼저 사람을 추가해 주세요.</div>';
      $('dateNote').textContent = '';
      return;
    }
    var list = entriesOf(selDate);
    var html = '';
    for (var i = 0; i < state.members.length; i++) {
      var m = state.members[i];
      var on = list.some(function(e){ return e.m === m.id; });
      html += '<button class="t-row' + (on ? ' on' : '') + '" type="button" data-mid="' + m.id + '">'
            + '<span class="dot" style="background:' + m.color + '"></span>'
            + '<span class="nm">' + esc(m.name) + '</span>'
            + (m.car ? '<span class="car">' + esc(m.car) + '</span>' : '')
            + '<span class="mark">✓</span>'
            + '</button>';
    }
    box.innerHTML = html;
    var n = list.length;
    $('dateNote').textContent = n ? (n + '명 주차 · 다시 누르면 해제됩니다') : '이름을 누르면 그날 주차로 등록됩니다';
  }

  function toggleMember(mid){
    var date = selDate;
    var was = entriesOf(date).some(function(e){ return e.m === mid; });
    var snapshot = state.entries.slice();
    var logsSnap = state.logs.slice();
    var mem = memberById(mid);
    run({ mode: 'parking_set', date: date, member: mid, on: was ? '0' : '1', by: me }, function(){
      if (was) {
        state.entries = state.entries.filter(function(e){ return !(e.m === mid && e.d === date); });
      } else {
        state.entries = state.entries.concat([{ m: mid, name: mem ? mem.name : '', color: mem ? mem.color : '', d: date, t: '', note: '' }]);
      }
      renderDateList();
      renderLog();
    }, function(){
      state.entries = snapshot;
      state.logs = logsSnap;
      if (!$('dateSheet').hidden) { renderDateList(); }
    });
  }

  /* ---------- 인원 시트 ---------- */
  function openPerson(id){
    editingId = id || '';
    var m = id ? memberById(id) : null;
    $('personTitle').textContent = m ? '사람 수정' : '사람 추가';
    $('pName').value = m ? m.name : '';
    $('pCar').value = m ? (m.car || '') : '';
    $('pNote').value = m ? (m.note || '') : '';
    pickingColor = m ? (m.color || COLORS[0]) : COLORS[state.members.length % COLORS.length];
    renderColors();
    $('personDelete').hidden = !m;
    openSheet('personSheet');
    setTimeout(function(){ try { $('pName').focus(); } catch(e){} }, 120);
  }

  function renderColors(){
    var html = '';
    for (var i = 0; i < COLORS.length; i++) {
      var c = COLORS[i];
      html += '<button class="sw' + (c === pickingColor ? ' on' : '') + '" type="button" data-c="' + c + '" style="background:' + c + '" aria-label="색상 ' + (i + 1) + '"></button>';
    }
    $('pColors').innerHTML = html;
  }

  function savePerson(){
    var name = ($('pName').value || '').trim().slice(0, 12);
    if (!name) { toast('이름을 입력해 주세요.'); return; }
    var car = ($('pCar').value || '').trim().slice(0, 20);
    var note = ($('pNote').value || '').trim().slice(0, 40);
    if (!editingId && state.members.length >= MAX) { toast('최대 6명까지 등록할 수 있어요.'); return; }
    var id = editingId;
    var color = pickingColor;
    var snapshot = state.members.slice();
    closeSheet('personSheet');
    run({ mode: 'parking_member', id: id, name: name, color: color, car: car, note: note, by: me }, function(){
      if (id) {
        state.members = state.members.map(function(x){
          return x.id === id ? { id: id, name: name, color: color, car: car, note: note } : x;
        });
      } else {
        state.members = state.members.concat([{ id: 'tmp' + Date.now(), name: name, color: color, car: car, note: note }]);
      }
      render();
    }, function(){
      state.members = snapshot;
    });
  }

  function deletePerson(){
    var id = editingId;
    if (!id) { return; }
    var m = memberById(id);
    if (!m) { return; }
    var n = state.entries.filter(function(e){ return e.m === id; }).length;
    var msg = '“' + m.name + '” 님을 목록에서 뺄까요?' + (n ? '\n주차 기록 ' + n + '건도 함께 지워집니다.' : '');
    if (!window.confirm(msg)) { return; }
    var snapM = state.members.slice();
    var snapE = state.entries.slice();
    closeSheet('personSheet');
    run({ mode: 'parking_member_del', id: id, by: me }, function(){
      state.members = state.members.filter(function(x){ return x.id !== id; });
      state.entries = state.entries.filter(function(e){ return e.m !== id; });
      render();
    }, function(){
      state.members = snapM;
      state.entries = snapE;
    });
  }

  /* ---------- 이벤트 ---------- */
  $('meBtn').addEventListener('click', function(){
    $('nameInput').value = me || '';
    openSheet('nameSheet');
    setTimeout(function(){ try { $('nameInput').focus(); } catch(e){} }, 120);
  });
  $('nameSave').addEventListener('click', saveName);
  $('nameInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') { saveName(); } });

  $('addPersonBtn').addEventListener('click', function(){
    if (state.members.length >= MAX) { toast('최대 6명까지 등록할 수 있어요.'); return; }
    openPerson('');
  });

  $('peopleChips').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.chip') : null;
    if (!b) { return; }
    openPerson(b.getAttribute('data-pid'));
  });

  $('calGrid').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.cell') : null;
    if (!b) { return; }
    var date = b.getAttribute('data-date');
    if (!date) { return; }
    openDate(date);
  });

  $('prevBtn').addEventListener('click', function(){
    view.m--; if (view.m < 0) { view.m = 11; view.y--; }
    render();
  });
  $('nextBtn').addEventListener('click', function(){
    view.m++; if (view.m > 11) { view.m = 0; view.y++; }
    render();
  });
  $('todayBtn').addEventListener('click', function(){
    view = todayMonth();
    render();
  });

  $('dateList').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.t-row') : null;
    if (!b) { return; }
    var mid = b.getAttribute('data-mid');
    nameReady(function(){ toggleMember(mid); });
  });

  $('pColors').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.sw') : null;
    if (!b) { return; }
    pickingColor = b.getAttribute('data-c');
    renderColors();
  });

  $('personSave').addEventListener('click', function(){
    nameReady(savePerson);
  });
  $('personDelete').addEventListener('click', deletePerson);

  $('logToggle').addEventListener('click', function(){
    var card = $('logCard');
    var list = $('logList');
    var open = card.classList.toggle('open');
    list.hidden = !open;
  });

  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-close]') : null;
    if (!el) { return; }
    closeSheet(el.getAttribute('data-close'));
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') { return; }
    closeSheet('dateSheet'); closeSheet('personSheet'); closeSheet('nameSheet');
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && loaded) { load(); }
  });

  /* 시작 */
  try { me = localStorage.getItem('pk_me') || ''; } catch(e){ me = ''; }
  renderColors();
  render();
  load();
})();
</script>

  <script>
  (function(){
    try{
      if(!window.fetch) return;
      // 작업·내부 브라우저 제외: ?notrack=1 / dia_no_track=1 / 자동화 브라우저면 집계·하트비트를 보내지 않는다
      var off = false;

        if(/[?&]notrack=1/.test(location.search)){ try{ localStorage.setItem('dia_no_track', '1'); }catch(e0){} off = true; }
        if(localStorage.getItem('dia_no_track') === '1'){ off = true; }
      }catch(e1){}
      if(navigator.webdriver === true){ off = true; }
      if(off) return;
      var EXEC = 'https://script.google.com/macros/s/AKfycbxLu7nD0RH1FkCKdmgQkP7AybLKit34KN9ISnuW_pHwYrLW7EaqsWddNWBSGWfJ0S-V5A/exec';
      var SITE = 'parking';
      function get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
      function set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
      function 기기(){
        var v = get('dia_vid');
        if(!v){
          v = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
          set('dia_vid', v);
        }
        return v;
      }
      function 보내기(){
        var url = EXEC + '?mode=visit&site=' + SITE + '&u=' + encodeURIComponent(기기()) + '&_=' + Date.now();
        fetch(url, {cache: 'no-store'}).then(function(r){ return r.json(); }).catch(function(){});
      }
      function 살아있음(){
        if(document.visibilityState && document.visibilityState !== 'visible') return;
        fetch(EXEC + '?mode=hb&site=' + SITE + '&u=' + encodeURIComponent(기기()) + '&_=' + Date.now(), {cache: 'no-store'}).catch(function(){});
      }
      보내기();
      살아있음();
      setInterval(살아있음, 50000);
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible') 살아있음();
      });
    }catch(e){}
  })();
  </script>
