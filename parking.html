<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>🚗 주차 캘린더</title>
<link rel="icon" type="image/svg+xml" href="favicon-parking.svg?v=2">
<link rel="icon" type="image/png" sizes="180x180" href="parking-apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" href="parking-apple-touch-icon.png?v=2">
<style>
  :root{
    --pink:#e88295; --pink-deep:#be465e; --pink-light:#fff4f6; --pink-line:#f2d9df;
    --text:#26232a; --muted:#6f6a78; --dim:#9a95a2;
    --bg:#fbf8f9; --card:#ffffff; --line:#f0e6ea;
    --shadow:0 4px 16px rgba(190,70,94,.07);
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    font-size:14px; line-height:1.45;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:15px;}

  /* 상단 */
  .top{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px 12px calc(16px + env(safe-area-inset-left));
    background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top h1{margin:0; font-size:16px; font-weight:800; letter-spacing:-.02em;}
  .top h1 .emoji{font-size:16px;}
  .me{
    display:flex; align-items:center; gap:6px; flex:0 0 auto;
    max-width:150px; padding:7px 11px; border-radius:999px;
    background:var(--pink-light); border:1px solid var(--pink-line);
    font-size:12px; font-weight:700; color:var(--pink-deep);
    white-space:nowrap; overflow:hidden;
  }
  .me .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:var(--pink);}
  .me .nm{overflow:hidden; text-overflow:ellipsis;}
  main{
    max-width:560px; margin:0 auto; padding:14px 12px 40px;
    display:flex; flex-direction:column; gap:12px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px;
  }
  /* 공지·메모 */
  .notice{margin:0;}
  .notice-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .notice-head b{font-size:11.5px; font-weight:800; color:var(--muted);}
  .notice-edit{
    padding:5px 10px; border-radius:999px; font-size:11px; font-weight:800;
    color:var(--pink-deep); background:var(--pink-light); border:1px solid var(--pink-line);
  }
  .notice-view{
    font-size:12.5px; color:var(--text); white-space:pre-wrap; word-break:break-word;
    line-height:1.5; cursor:pointer; border-radius:8px;
  }
  .notice-view.none{color:var(--dim);}
  .notice-meta{margin-top:5px; font-size:10.5px; color:var(--dim); font-weight:700;}
  .notice-form{margin-top:8px;}
  .notice-form textarea{
    display:block; width:100%; padding:10px 11px; border-radius:11px; border:1px solid var(--line);
    background:#fdfbfc; color:var(--text); outline:none; resize:vertical; min-height:76px;
    font-family:inherit; font-size:13px; line-height:1.5;
  }
  .notice-form textarea:focus{border-color:var(--pink); background:#fff;}
  .notice-form .sheet-actions{margin-top:8px;}
  .notice-form .btn{padding:10px; font-size:13px;}
  .notice.editing .notice-view,
  .notice.editing .notice-meta,
  .notice.editing .notice-edit{display:none;}

  /* 달력 */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cal-head .nav{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:700; color:var(--pink-deep); background:var(--pink-light);
  }
  .cal-title{display:flex; align-items:center; gap:8px;}
  .cal-title b{font-size:15px; font-weight:800; letter-spacing:-.02em;}
  .today-btn{
    padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700;
    color:var(--muted); border:1px solid var(--line); background:#fff;
  }
  .dow{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px;}
  .dow span{text-align:center; font-size:11px; font-weight:700; color:var(--dim); padding:4px 0;}
  .dow span:first-child{color:#d2697b;}
  .dow span:last-child{color:#5b8fc7;}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cell{
    position:relative; display:flex; flex-direction:column; align-items:center;
    min-height:64px; padding:4px 1px 3px; border-radius:10px;
    background:#fff; border:1px solid transparent; text-align:center;
    overflow:hidden;
  }
  .cell:active{background:var(--pink-light);}
  .cell .num{font-size:12px; font-weight:700; color:var(--text); line-height:1.2; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
  .cell.sun .num{color:#d2697b;}
  .cell.sat .num{color:#5b8fc7;}
  .cell.out .num{color:#c9c4ce;}
  .cell.today{background:var(--pink-light); border-color:var(--pink-line);}
  .cell.today .num{background:var(--pink); color:#fff;}
  .cell.sel{border-color:var(--pink); box-shadow:inset 0 0 0 1px var(--pink);}
  .badges{display:flex; flex-direction:column; gap:2px; width:100%; align-items:center; margin-top:1px;}
  .badges i{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    max-width:100%; padding:1px 1px; border-radius:4px;
    font-style:normal; font-weight:800; line-height:1.15; overflow:hidden;
  }
  .badges i b{font-size:8px; font-weight:800; letter-spacing:-.3px; white-space:nowrap;}
  .badges i em{font-size:7px; font-style:normal; font-weight:700; letter-spacing:-.3px; opacity:.9; white-space:nowrap;}
  .badges .more{font-size:8px; font-weight:800; color:var(--dim);}

  /* 로그 */
  .log{padding:0; overflow:hidden;}
  .log-toggle{
    width:100%; display:flex; align-items:center; gap:7px;
    padding:14px; font-size:13px; font-weight:800; text-align:left;
  }
  .log-toggle .cnt{font-size:11px; font-weight:700; color:var(--dim);}
  .log-toggle .arrow{margin-left:auto; color:var(--dim); font-size:12px; transition:transform .18s;}
  .log.open .log-toggle .arrow{transform:rotate(180deg);}
  .log-list{max-height:320px; overflow-y:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--line);}
  .log-item{display:flex; gap:8px; padding:9px 14px; border-bottom:1px solid #faf6f8; font-size:12px;}
  .log-item:last-child{border-bottom:0;}
  .log-item .at{color:var(--dim); font-weight:700; flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .log-item .body{flex:1 1 auto; min-width:0;}
  .log-item .who{font-weight:800; color:var(--pink-deep);}
  .log-item .act{font-weight:800;}
  .log-item .det{color:var(--muted); margin-left:2px;}
  .log-empty{padding:16px 14px; font-size:12px; color:var(--dim); text-align:center;}

  /* 시트(바텀시트) */
  .sheet-wrap{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center;}
  .sheet-wrap[hidden]{display:none;}
  .sheet-backdrop{position:absolute; inset:0; background:rgba(38,35,42,.34);}
  .sheet{
    position:relative; width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#fff; border-radius:20px 20px 0 0;
    padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.12);
    animation:up .2s ease-out;
  }
  @keyframes up{from{transform:translateY(14px); opacity:.6} to{transform:none; opacity:1}}
  .grip{width:36px; height:4px; border-radius:2px; background:#ece6e9; margin:2px auto 10px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .sheet-head b{font-size:15px; font-weight:800;}
  .sheet-head .x{width:30px; height:30px; border-radius:50%; background:#f7f3f5; color:var(--muted); font-size:14px;}

  /* 날짜 시트 */
  .list-head{display:flex; align-items:center; justify-content:space-between; margin:2px 0 7px;}
  .list-head b{font-size:11.5px; font-weight:800; color:var(--muted);}
  .list-head span{font-size:11px; font-weight:700; color:var(--dim);}
  .toggle-list{display:flex; flex-direction:column; gap:7px;}
  .slot{
    display:flex; align-items:center; gap:9px; width:100%;
    padding:10px 11px; border-radius:12px; border:1px solid var(--line); background:#fff;
  }
  .slot .dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto;}
  .slot .nm{font-size:13.5px; font-weight:800; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .slot .tm{font-size:12px; font-weight:800; color:var(--pink-deep); flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .slot .memo{font-size:11px; color:var(--dim); font-weight:600; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;}
  .slot .del{
    flex:0 0 26px; width:26px; height:26px; border-radius:50%;
    background:#f7f3f5; color:var(--dim); font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .slot .del:active{background:#fdf1f3; color:#c24a60;}
  .slot .del-none{flex:0 0 26px; width:26px;}
  .empty{padding:14px 4px 4px; font-size:12.5px; color:var(--dim); text-align:center;}

  .range-head{display:flex; align-items:center; justify-content:space-between; margin:16px 0 7px;}
  .range-head b{font-size:11.5px; font-weight:800; color:var(--muted);}
  .range-head > span{font-size:11px; font-weight:700; color:var(--dim);}

  /* 24시간 시계 (보기 전용 표시) — 진짜 아날로그 시계판 */
  .tt{position:relative; margin:4px 0 6px; padding-left:46px; touch-action:none; -webkit-user-select:none; user-select:none; cursor:ns-resize;}
  .tt-h{position:absolute; left:0; right:0; height:0; border-top:1px solid #f1eaee;}
  .tt-h span{
    position:absolute; left:0; width:40px; text-align:right; top:-7px;
    font-size:10.5px; font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:-.2px;
  }
  .tt-blocks{position:absolute; left:46px; right:0; top:0; bottom:0;}
  .tt-b{
    position:absolute; left:0; right:2px; border-radius:9px; border-left:4px solid var(--pink);
    padding:0 7px; display:flex; align-items:center; gap:5px; overflow:hidden;
    box-sizing:border-box;
  }
  .tt-b b{
    font-size:11px; font-weight:800; color:#3a3237; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0;
  }
  .tt-b span{
    font-size:10px; font-weight:700; color:#6b6270; white-space:nowrap;
    font-variant-numeric:tabular-nums; flex:0 0 auto;
  }
  .tt-b.me b{color:#2f2933;}
  /* 내 블록 위·아래 조절 핸들(═) */
  .tt-b.me .hd{position:absolute; left:0; right:0; height:15px; display:flex; align-items:center; justify-content:center; pointer-events:none;}
  .tt-b.me .hd.t{top:0;}
  .tt-b.me .hd.b{bottom:0;}
  .tt-b.me .hd i{display:block; width:26px; height:4px; border-radius:2px; background:#fff; box-shadow:0 0 0 1px rgba(38,35,42,.16), 0 1px 2px rgba(38,35,42,.10);}
  .pick-line{display:flex; align-items:baseline; justify-content:center; gap:7px; margin:5px 0 7px; flex-wrap:wrap;}
  .pick-line b{font-size:15px; font-weight:800; color:var(--pink-deep); letter-spacing:-.2px; font-variant-numeric:tabular-nums;}
  .pick-line span{font-size:10.5px; font-weight:700; color:var(--dim);}
  .pick-line.bad b{color:#c24a60;}
  /* 휠 피커 (갤럭시 시계 알람 스타일 드럼롤) */
  .wp-row{display:flex; align-items:center; justify-content:center; gap:6px; margin:9px 0 3px;}
  .wp{flex:1 1 0; min-width:0;}
  .wp-lab{font-size:10.5px; font-weight:800; color:var(--dim); text-align:center; margin-bottom:3px;}
  .wp-body{
    position:relative; display:flex; align-items:stretch; justify-content:center;
    height:132px; padding:0 4px; border-radius:14px;
    background:#fdfbfc; box-shadow:inset 0 0 0 1px var(--line); overflow:hidden;
  }
  .wp-band{
    position:absolute; left:5px; right:5px; top:44px; height:44px; border-radius:10px;
    background:var(--pink-light); box-shadow:inset 0 0 0 1px var(--pink-line); pointer-events:none;
  }
  .wp-sep{
    display:flex; align-items:center; justify-content:center; flex:0 0 8px;
    font-size:13px; font-weight:800; color:var(--dim); z-index:1; pointer-events:none;
  }
  .wp-col{
    position:relative; z-index:1; flex:0 0 44px; height:100%;
    overflow-y:auto; overflow-x:hidden;
    scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; -ms-overflow-style:none;
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 26%,#000 74%,rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 26%,#000 74%,rgba(0,0,0,0) 100%);
  }
  .wp-col::-webkit-scrollbar{display:none; width:0; height:0;}
  .wp-col .wp-pad{height:44px;}
  .wp-col .it{
    height:44px; display:flex; align-items:center; justify-content:center;
    scroll-snap-align:center;
    font-size:17px; font-weight:800; color:var(--muted);
    font-variant-numeric:tabular-nums; letter-spacing:-.4px;
    transition:transform .13s ease, opacity .13s ease;
  }
  .wp-col .it.on{color:var(--pink-deep);}
  .wp-col.lock{opacity:.35; pointer-events:none;}
  .wp-tilde{flex:0 0 auto; color:var(--dim); font-weight:800; font-size:13px; align-self:center; margin-top:18px;}
  .warn{
    margin:9px 0 0; padding:8px 10px; border-radius:10px;
    background:#fdf1f3; color:#c24a60; font-size:11.5px; font-weight:700; line-height:1.4;
  }
  .warn[hidden]{display:none;}
  .sheet-actions{display:flex; gap:8px; margin-top:10px;}
  .btn{flex:1 1 auto; padding:12px; border-radius:12px; font-size:14px; font-weight:800; text-align:center;}
  .btn.primary{background:var(--pink); color:#fff;}
  .btn.primary[disabled]{background:#f0dfe4; color:#b08e97;}
  .btn.ghost{background:#f8f4f6; color:var(--muted); flex:0 0 96px;}
  .sheet-note{margin:10px 0 0; font-size:11px; color:var(--dim); text-align:center;}

  /* 내 정보 */
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:11.5px; font-weight:800; color:var(--muted); margin-bottom:5px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line);
    background:#fdfbfc; outline:none;
  }
  .field input:focus{border-color:var(--pink); background:#fff;}
  .swatches{display:flex; gap:9px; flex-wrap:wrap;}
  .sw{width:30px; height:30px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .sw.on{box-shadow:0 0 0 2px var(--pink-deep);}

  /* 토스트 */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,12px);
    background:rgba(38,35,42,.92); color:#fff; font-size:12.5px; font-weight:700;
    padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:90; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  @media (min-width:640px){
    main{max-width:620px; padding-top:20px;}
    body{font-size:14.5px;}
    .cell{min-height:78px;}
    .badges i b{font-size:9px;}
    .badges i em{font-size:8px;}
    .sheet-wrap{align-items:center;}
    .sheet{border-radius:18px; max-width:440px; padding-bottom:16px;}
    .grip{display:none;}
  }
</style>
</head>
<body>

<header class="top">
  <h1><span class="emoji">🚗</span> 주차 캘린더</h1>
  <button class="me" id="meBtn" type="button">
    <span class="dot" id="meDot"></span><span class="nm" id="meName">내 이름</span>
  </button>
</header>

<main>
  <section class="card">
    <div class="notice" id="noticeBox">
      <div class="notice-head">
        <b>📌 공지·메모</b>
        <button class="notice-edit" id="noticeEditBtn" type="button">수정</button>
      </div>
      <div class="notice-view none" id="noticeView">공지나 메모를 남겨 보세요</div>
      <div class="notice-meta" id="noticeMeta"></div>
      <div class="notice-form" id="noticeForm" hidden>
        <textarea id="noticeText" rows="3" maxlength="500" placeholder="예: 이번 주는 3번 자리 비워 주세요"></textarea>
        <div class="sheet-actions">
          <button class="btn ghost" id="noticeCancel" type="button">취소</button>
          <button class="btn primary" id="noticeSave" type="button">저장</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="cal-head">
      <button class="nav" id="prevBtn" type="button" aria-label="이전 달">‹</button>
      <div class="cal-title">
        <b id="ymLabel">-</b>
        <button class="today-btn" id="todayBtn" type="button">오늘</button>
      </div>
      <button class="nav" id="nextBtn" type="button" aria-label="다음 달">›</button>
    </div>
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="calGrid"></div>
  </section>

  <section class="card log" id="logCard">
    <button class="log-toggle" id="logToggle" type="button">
      📝 등록 로그 <span class="cnt" id="logCount"></span>
      <span class="arrow">▾</span>
    </button>
    <div class="log-list" id="logList" hidden></div>
  </section>
</main>

<!-- 날짜 상세 -->
<div class="sheet-wrap" id="dateSheet" hidden>
  <div class="sheet-backdrop" data-close="dateSheet"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <b id="dateTitle">-</b>
      <button class="x" type="button" data-close="dateSheet">✕</button>
    </div>
    <div class="list-head"><b>등록 현황</b><span id="listCount"></span></div>
    <div class="toggle-list" id="dateList"></div>
    <div class="range-head"><b>시간대 등록</b><span>주차 1대</span></div>
    <div class="tt" id="timetable"></div>
    <div class="pick-line" id="pickLine">
      <b id="pickSum">-</b>
    </div>
    <div class="wp-row">
      <div class="wp">
        <div class="wp-lab">시작</div>
        <div class="wp-body">
          <div class="wp-band"></div>
          <div class="wp-col" id="colSH"></div>
          <div class="wp-sep">:</div>
          <div class="wp-col" id="colSM"></div>
        </div>
      </div>
      <span class="wp-tilde">~</span>
      <div class="wp">
        <div class="wp-lab">종료</div>
        <div class="wp-body">
          <div class="wp-band"></div>
          <div class="wp-col" id="colEH"></div>
          <div class="wp-sep">:</div>
          <div class="wp-col" id="colEM"></div>
        </div>
      </div>
    </div>
    <select id="startSel" hidden aria-label="시작 시간"></select>
    <select id="endSel" hidden aria-label="종료 시간"></select>
    <p class="warn" id="rangeWarn" hidden></p>
    <div class="sheet-actions">
      <button class="btn primary" id="regBtn" type="button">내 이름으로 등록</button>
    </div>
    <p class="sheet-note">겹치는 시간대는 등록할 수 없습니다</p>
  </div>
</div>

<!-- 내 정보 -->
<div class="sheet-wrap" id="meSheet" hidden>
  <div class="sheet-backdrop" data-close="meSheet"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <b>내 정보</b>
      <button class="x" type="button" data-close="meSheet">✕</button>
    </div>
    <div class="field">
      <label for="mName">이름</label>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var EXEC = 'https://script.google.com/macros/s/AKfycbxLu7nD0RH1FkCKdmgQkP7AybLKit34KN9ISnuW_pHwYrLW7EaqsWddNWBSGWfJ0S-V5A/exec';
  var COLORS = ['#e88295','#ef9c5a','#6bbf8a','#5b9bd5','#9a7ad5','#8b95a3'];
  var DOW = ['일','월','화','수','목','금','토'];
  var STORE = 'pk_me_v2';
  var PK_CACHE = 'pk_cache_v1';        /* 달력 즉시 표시용 로컬 캐시 */
  var READ_TIMEOUT = 5000;             /* 읽기 요청 1회 타임아웃 5초 */
  var RETRY_DELAYS = [800, 1500, 1500]; /* 실패 시 자동 재시도 간격(최대 3회) */

  var state = { entries: [], logs: [], notice: { text: '', by: '', at: '' } };
  var loaded = false;
  var noticeLoaded = false;
  var view = todayMonth();
  var selDate = '';
  var me = { name: '', color: COLORS[0], note: '' };
  var pickColor = COLORS[0];
  var pending = null;
  var chain = Promise.resolve();
  var range = { start: '10:00', end: '13:00' };
  var drag = null;      /* 타임테이블 직접 드래그 상태 */

  /* 첫 방문자도 바로 볼 수 있게 페이지에 함께 넣어 둔 마지막 확정 스냅샷.
     서버(parking_get) 응답이 오면 그 값으로 100% 덮어쓴다. */
  var SEED = {"entries":[{"m":"emwo5qtm7pqn","name":"세이린뷰티","color":"#E11D48","d":"2026-11-20","t":"10:30~12:30","note":""},{"m":"emwo5qwkzrzo","name":"세이린뷰티","color":"#E11D48","d":"2026-11-20","t":"21:00~23:00","note":""},{"m":"emwo5qzog3zd","name":"세이린뷰티","color":"#E11D48","d":"2026-11-22","t":"14:00~16:00","note":""},{"m":"emwo5r2mjz23","name":"세이린뷰티","color":"#E11D48","d":"2026-11-24","t":"21:00~23:00","note":""},{"m":"emwo6rbey11l","name":"HB뷰티","color":"#2563EB","d":"2026-11-12","t":"21:00~23:00","note":""},{"m":"emwo6re8qgtz","name":"여리음네일","color":"#7C3AED","d":"2026-11-13","t":"17:00~19:00","note":""},{"m":"emwo6rguyff6","name":"벨라브로우","color":"#059669","d":"2026-11-16","t":"10:30~12:30","note":""},{"m":"emwo6rj4e3lf","name":"벨라브로우","color":"#059669","d":"2026-11-17","t":"10:30~12:30","note":""},{"m":"emwo6rmvv53y","name":"벨라브로우","color":"#059669","d":"2026-11-17","t":"13:00~15:00","note":""},{"m":"emwo6rsjvsoj","name":"세이린뷰티","color":"#E11D48","d":"2026-11-18","t":"11:00~13:00","note":""},{"m":"emwo6rv7k1ns","name":"HB뷰티","color":"#2563EB","d":"2026-11-19","t":"10:00~12:00","note":""}],"logs":[{"at":"2026-11-20 03:30","by":"문도현","action":"주차 등록","date":"2026-11-20","detail":"문도현 10:00~13:00 · 11/20"},{"at":"2026-11-20 03:40","by":"도현","action":"주차 등록","date":"2026-11-20","detail":"도현 20:00~21:00 · 11/20"},{"at":"2026-11-20 03:41","by":"도현","action":"주차 취소","date":"2026-11-20","detail":"도현 20:00~21:00 · 11/20"},{"at":"2026-11-20 04:04","by":"문도현","action":"주차 취소","date":"2026-11-20","detail":"문도현 10:00~13:00 · 11/20"},{"at":"2026-11-20 04:20","by":"문도현","action":"주차 등록","date":"2026-11-20","detail":"문도현 10:00~13:00 · 11/20"},{"at":"2026-11-20 04:20","by":"문도현","action":"주차 취소","date":"2026-11-20","detail":"문도현 10:00~13:00 · 11/20"},{"at":"2026-11-20 08:04","by":"문도현","action":"주차 등록","date":"2026-11-20","detail":"세이린뷰티 10:30~12:30 · 11/20"},{"at":"2026-11-20 08:04","by":"문도현","action":"주차 등록","date":"2026-11-20","detail":"세이린뷰티 21:00~23:00 · 11/20"},{"at":"2026-11-20 08:04","by":"문도현","action":"주차 등록","date":"2026-11-22","detail":"세이린뷰티 14:00~16:00 · 11/22"},{"at":"2026-11-20 08:04","by":"문도현","action":"주차 등록","date":"2026-11-24","detail":"세이린뷰티 21:00~23:00 · 11/24"},{"at":"2026-11-20 08:33","by":"문도현","action":"주차 등록","date":"2026-11-12","detail":"HB뷰티 21:00~23:00 · 11/12"},{"at":"2026-11-20 08:33","by":"문도현","action":"주차 등록","date":"2026-11-13","detail":"여리음네일 17:00~19:00 · 11/13"},{"at":"2026-11-20 08:33","by":"문도현","action":"주차 등록","date":"2026-11-16","detail":"벨라브로우 10:30~12:30 · 11/16"},{"at":"2026-11-20 08:33","by":"문도현","action":"주차 등록","date":"2026-11-17","detail":"벨라브로우 10:30~12:30 · 11/17"},{"at":"2026-11-20 08:33","by":"문도현","action":"주차 등록","date":"2026-11-17","detail":"벨라브로우 13:00~15:00 · 11/17"},{"at":"2026-11-20 08:33","by":"문도현","action":"주차 등록","date":"2026-11-18","detail":"세이린뷰티 11:00~13:00 · 11/18"},{"at":"2026-11-20 08:33","by":"문도현","action":"주차 등록","date":"2026-11-19","detail":"HB뷰티 10:00~12:00 · 11/19"}]};

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function ymd(y, m, d){ return y + '-' + pad(m + 1) + '-' + pad(d); }
  function todayStr(){ var t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }
  function todayMonth(){ var t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; }
  function hm(t){ var s = String(t || ''); return s.length >= 5 ? s.slice(0, 5) : s; }
  function shortH(t){ var s = hm(t); return s ? String(+s.slice(0, 2)) : ''; }
  function hexA(hex, a){
    var h = String(hex || '').replace('#','');
    if (h.length !== 6) { h = 'e88295'; }
    var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function openSheet(id){ $(id).hidden = false; }
  function closeSheet(id){ $(id).hidden = true; }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  /* ---------- 저장/불러오기 ---------- */
  function apiOnce(params, timeoutMs){
    var q = [];
    for (var k in params) {
      if (params[k] === undefined || params[k] === null || params[k] === '') { continue; }
      q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
    var url = EXEC + '?' + q.join('&') + '&_=' + Date.now();
    var opt = { cache: 'no-store', redirect: 'follow' };
    var tm = null, ctrl = null;
    if (timeoutMs && window.AbortController) {
      ctrl = new AbortController();
      opt.signal = ctrl.signal;
    }
    var clear = function(){ if (tm) { clearTimeout(tm); tm = null; } };
    var req = fetch(url, opt);
    if (timeoutMs) {
      /* AbortController가 없는 브라우저에서도 반드시 끊기도록 경합시킨다 */
      var limit = new Promise(function(_, reject){
        tm = setTimeout(function(){
          if (ctrl) { try { ctrl.abort(); } catch(e){} }
          reject(new Error('timeout'));
        }, timeoutMs);
      });
      req = Promise.race([req, limit]);
    }
    return req
      .then(function(r){ return r.json(); })
      .then(function(d){
        clear();
        if (!d || !d.ok) {
          var e = new Error((d && d.error) || 'fail');
          e.conflict = d && d.with;
          throw e;
        }
        return d;
      })
      .catch(function(e){ clear(); throw e; });
  }

  /* 쓰기 등 일반 요청: 기존과 같이 1회만 */
  function api(params){
    return apiOnce(params, 0);
  }

  /* 읽기 요청: 5초 타임아웃 + 0.8·1.5초 간격으로 최대 3회 자동 재시도 */
  function apiRead(params){
    var i = 0;
    function go(){
      return apiOnce(params, READ_TIMEOUT).catch(function(err){
        if (i >= RETRY_DELAYS.length) { throw err; }
        var wait = RETRY_DELAYS[i++];
        return new Promise(function(res){ setTimeout(res, wait); }).then(go);
      });
    }
    return go();
  }

  /* ---------- 로컬 캐시 ---------- */
  function readCache(){
    try {
      var raw = localStorage.getItem(PK_CACHE) || '';
      if (!raw) { return null; }
      var o = JSON.parse(raw);
      if (!o || !o.entries || !o.entries.length) { return null; }
      return o;
    } catch(e){ return null; }
  }

  function saveCache(d){
    if (!d) { return; }
    try {
      localStorage.setItem(PK_CACHE, JSON.stringify({
        v: 1, at: Date.now(),
        entries: d.entries || [],
        logs: (d.logs || []).slice(-50)
      }));
    } catch(e){}
  }

  function applyState(d){
    state.entries = (d.entries || []).map(function(e){
      var sp = String(e.t || '').split('~');
      return {
        id: e.m || e.id || '', name: e.name || '', color: e.color || '',
        d: e.d || '', start: hm(sp[0] || ''), end: hm(sp[1] || ''), note: e.note || ''
      };
    });
    state.logs = d.logs || [];
  }

  function load(){
    return apiRead({ mode: 'parking_get' }).then(function(d){
      applyState(d);
      loaded = true;
      saveCache(d);
      render();
    }).catch(function(){
      if (state.entries.length > 0) {
        /* 캐시로 이미 달력이 그려져 있으면 화면을 덮지 않고 조용히 알린다 */
        toast('연결이 잠시 안 됩니다. 잠시 뒤 다시 시도해 주세요.');
      } else if (!loaded) {
        $('calGrid').innerHTML = '<div style="grid-column:1/-1;padding:26px 0;text-align:center;font-size:12.5px;color:#9a95a2;">연결이 잠시 안 됩니다. 아래로 새로고침하거나 잠시 뒤 다시 열어 주세요.</div>';
      }
    });
  }

  /* ---------- 내 정보 ---------- */
  function loadMe(){
    var raw = '';
    try { raw = localStorage.getItem(STORE) || ''; } catch(e){}
    if (raw) {
      try {
        var o = JSON.parse(raw);
        if (o && o.name) {
          me = { name: String(o.name).slice(0, 12), color: o.color || COLORS[0], note: String(o.note || '').slice(0, 40) };
        }
      } catch(e){}
    }
    if (!me.name) {
      var old = '';
      try { old = localStorage.getItem('pk_me') || ''; } catch(e){}
      if (old) { me.name = old.slice(0, 12); }
    }
    pickColor = me.color || COLORS[0];
  }

  function saveMe(){
    var name = ($('mName').value || '').trim().slice(0, 12);
    if (!name) { toast('이름을 입력해 주세요.'); return; }
    me = { name: name, color: pickColor, note: ($('mNote').value || '').trim().slice(0, 40) };
    try {
      localStorage.setItem(STORE, JSON.stringify(me));
      localStorage.setItem('pk_me', me.name);
    } catch(e){}
    closeSheet('meSheet');
    renderMe();
    if (!$('dateSheet').hidden) { renderDateSheet(); }
    var cb = pending; pending = null;
    if (cb) { cb(); }
  }

  function openMe(){
    $('mName').value = me.name || '';
    $('mNote').value = me.note || '';
    pickColor = me.color || COLORS[0];
    renderColors();
    openSheet('meSheet');
    setTimeout(function(){ try { $('mName').focus(); } catch(e){} }, 140);
  }

  function renderColors(){
    var html = '';
    for (var i = 0; i < COLORS.length; i++) {
      var c = COLORS[i];
      html += '<button class="sw' + (c === pickColor ? ' on' : '') + '" type="button" data-c="' + c + '" style="background:' + c + '" aria-label="색상 ' + (i + 1) + '"></button>';
    }
    $('mColors').innerHTML = html;
  }

  function renderMe(){
    $('meName').textContent = me.name || '내 이름';
    $('meDot').style.background = me.color || COLORS[0];
  }

  /* ---------- 렌더 ---------- */
  function render(){
    renderCal();
    renderLog();
    renderMe();
    if (!$('dateSheet').hidden) { renderDateSheet(); }
  }

  function entriesOf(date){
    return state.entries.filter(function(e){ return e.d === date; }).sort(function(a,b){
      return String(a.start) < String(b.start) ? -1 : (String(a.start) > String(b.start) ? 1 : 0);
    });
  }

  function renderCal(){
    var y = view.y, m = view.m;
    $('ymLabel').textContent = y + '년 ' + (m + 1) + '월';
    var first = new Date(y, m, 1);
    var start = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var prevDays = new Date(y, m, 0).getDate();

    var byDate = {};
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      (byDate[e.d] = byDate[e.d] || []).push(e);
    }

    var today = todayStr();
    var cells = 0;
    var html = '';
    for (var p = start - 1; p >= 0; p--) {
      var pd = prevDays - p;
      html += cellHtml(ymd(m === 0 ? y - 1 : y, m === 0 ? 11 : m - 1, pd), pd, 'out', false, null);
      cells++;
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var date = ymd(y, m, d);
      var wd = (start + d - 1) % 7;
      var cls = wd === 0 ? 'sun' : (wd === 6 ? 'sat' : '');
      html += cellHtml(date, d, cls, date === today, byDate[date]);
      cells++;
    }
    var rest = (7 - (cells % 7)) % 7;
    for (var q = 1; q <= rest; q++) {
      html += cellHtml(ymd(m === 11 ? y + 1 : y, m === 11 ? 0 : m + 1, q), q, 'out', false, null);
    }
    $('calGrid').innerHTML = html;
  }

  function cellHtml(date, num, cls, isToday, list){
    var c = 'cell ' + (cls || '') + (isToday ? ' today' : '') + (date === selDate ? ' sel' : '');
    var badges = '';
    if (list && list.length) {
      var shown = list.slice(0, 2);
      for (var i = 0; i < shown.length; i++) {
        var e = shown[i];
        var color = e.color || '#e88295';
        var label = String(e.name || '').slice(0, 2);
        var time = '';
        if (e.start && e.end) { time = shortH(e.start) + '-' + shortH(e.end); }
        badges += '<i style="background:' + hexA(color, .16) + ';color:' + color + '">'
                + '<b>' + esc(label) + '</b>'
                + (time ? '<em>' + esc(time) + '</em>' : '')
                + '</i>';
      }
      if (list.length > 2) { badges += '<span class="more">+' + (list.length - 2) + '</span>'; }
    }
    return '<button class="' + c + '" type="button" data-date="' + date + '">'
         + '<span class="num">' + num + '</span>'
         + '<span class="badges">' + badges + '</span>'
         + '</button>';
  }

  function renderLog(){
    var list = state.logs.slice().reverse().slice(0, 50);
    $('logCount').textContent = state.logs.length ? '(' + state.logs.length + ')' : '';
    if (!list.length) {
      $('logList').innerHTML = '<div class="log-empty">아직 기록이 없습니다.</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var l = list[i];
      var at = String(l.at || '');
      var when = at.length >= 16 ? at.slice(5, 10).replace('-', '/') + ' ' + at.slice(11, 16) : at;
      html += '<div class="log-item"><span class="at">' + esc(when) + '</span>'
            + '<span class="body"><span class="who">' + esc(l.by || '') + '</span> '
            + '<span class="act">' + esc(l.action || '') + '</span>'
            + (l.detail ? ' <span class="det">' + esc(l.detail) + '</span>' : '')
            + '</span></div>';
    }
    $('logList').innerHTML = html;
  }

  /* ---------- 날짜 시트 ---------- */
  function buildTimeOptions(){
    var a = '', b = '';
    for (var h = 0; h <= 23; h++) {
      for (var mi = 0; mi < 60; mi += 30) {
        var v = pad(h) + ':' + pad(mi);
        a += '<option value="' + v + '">' + v + '</option>';
      }
    }
    for (var h2 = 0; h2 <= 24; h2++) {
      for (var m2 = 0; m2 < 60; m2 += 30) {
        if (h2 === 24 && m2 > 0) { continue; }
        var v2 = pad(h2) + ':' + pad(m2);
        b += '<option value="' + v2 + '">' + v2 + '</option>';
      }
    }
    $('startSel').innerHTML = a;
    $('endSel').innerHTML = b;
  }

  /* 그날 예약과 겹치지 않는 빈 2시간대를 찾는다 (fromMin부터 30분 단위, 없으면 null) */
  function freeSlot(list, fromMin){
    var busy = [], i, a, b;
    for (i = 0; i < list.length; i++) {
      a = toMin(list[i].start); b = toMin(list[i].end);
      if (b > a) { busy.push([a, b]); }
    }
    busy.sort(function(x, y){ return x[0] - y[0]; });
    var from = (fromMin == null) ? 10 * 60 : fromMin;   /* 기본은 낮 10시부터 */
    for (var s0 = from; s0 + 120 <= 1440; s0 += 30) {
      var clear = true;
      for (i = 0; i < busy.length; i++) {
        if (s0 < busy[i][1] && busy[i][0] < s0 + 120) { clear = false; break; }
      }
      if (clear) { return [toHM(s0), toHM(s0 + 120)]; }
    }
    return null;
  }

  function openDate(date){
    selDate = date;
    var parts = date.split('-');
    var dt = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    $('dateTitle').textContent = (+parts[1]) + '월 ' + (+parts[2]) + '일 (' + DOW[dt.getDay()] + ')';
    /* 기본 시작~종료가 그날 예약과 겹치면 빈 2시간대로 잡아 준다 */
    if (conflictFor(range.start, range.end)) {
      var fr = freeSlot(entriesOf(date));
      if (fr) { range.start = fr[0]; range.end = fr[1]; }
    }
    $('startSel').value = range.start;
    $('endSel').value = range.end;
    renderDateSheet();
    renderCal();
    openSheet('dateSheet');
    /* 24시간 전체를 보여 주므로 열 때 09:00 부근이 보이게 스크롤을 맞춘다 */
    setTimeout(function(){ syncWheels(false); scrollTtTo(540); }, 30);
    setTimeout(function(){ syncWheels(false); }, 220);
  }

  function scrollTtTo(min){
    var wrap = $('dateSheet');
    var sc = wrap ? wrap.querySelector('.sheet') : null;
    var tt = $('timetable');
    if (!sc || !tt) { return; }
    var y = tt.offsetTop + (min / 60) * TT_HOUR - 96;
    var max = sc.scrollHeight - sc.clientHeight;
    sc.scrollTop = Math.max(0, Math.min(y, max > 0 ? max : 0));
  }

  function conflictFor(start, end){
    var list = entriesOf(selDate);
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.start || !e.end) { continue; }
      if (start < e.end && e.start < end) { return e; }
    }
    return null;
  }

  function renderDateSheet(){
    var list = entriesOf(selDate);
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      html += '<div class="slot">'
            + '<span class="dot" style="background:' + (e.color || '#e88295') + '"></span>'
            + '<span class="nm">' + esc(e.name) + '</span>'
            + '<span class="tm">' + esc(e.start) + '~' + esc(e.end) + '</span>'
            + (e.note ? '<span class="memo">' + esc(e.note) + '</span>' : '<span class="memo"></span>')
            + (e.name === me.name
                ? '<button class="del" type="button" data-del="' + esc(e.id) + '" data-name="' + esc(e.name) + '" aria-label="' + esc(e.name) + ' 주차 취소">✕</button>'
                : '<span class="del-none" aria-hidden="true"></span>')
            + '</div>';
    }
    $('dateList').innerHTML = html || '<div class="empty">아직 등록된 주차가 없어요.</div>';
    $('listCount').textContent = list.length ? list.length + '건' : '';

    renderPick();
  }

  /* ---------- 세로 타임테이블 (콜라보살롱 스타일) ---------- */
  var TT_HOUR = 21;                  /* 1시간 높이(px) — 24시간 전체가 504px */

  function f2(n){ return Math.round(n * 100) / 100; }
  function toMin(v){
    var s = String(v || '');
    if (!/^\d{1,2}:\d{2}$/.test(s)) { return -1; }
    var p = s.split(':');
    return (+p[0]) * 60 + (+p[1]);
  }
  function toHM(min){
    if (min >= 1440) { return '24:00'; }
    if (min < 0) { min = 0; }
    return pad(Math.floor(min / 60)) + ':' + pad(min % 60);
  }

  /* 시계는 00:00~24:00을 하루 24시간 전체로 한 번에 보여 준다 */
  function viewWin(){ return [0, 1440]; }

  function ttBlock(name, from, to, color, s0, e0, h0, mine){
    var c = color || '#e88295';
    var top = ((s0 - h0) / 60) * TT_HOUR;
    var hgt = Math.max(17, ((e0 - s0) / 60) * TT_HOUR - 1.5);
    var style = 'top:' + f2(top) + 'px;height:' + f2(hgt) + 'px;background:' + hexA(c, mine ? .10 : .16) + ';';
    if (mine) {
      style += 'border:1px dashed ' + c + ';border-left:4px solid ' + c + ';';
    } else {
      style += 'border-left-color:' + c + ';';
    }
    return '<div class="tt-b' + (mine ? ' me' : '') + '" style="' + style + '">'
         + (mine ? '<span class="hd t"><i></i></span><span class="hd b"><i></i></span>' : '')
         + '<b>' + esc(name) + '</b><span>' + esc(from) + '~' + esc(to) + '</span></div>';
  }

  function renderDial(){
    var el = $('timetable');
    if (!el) { return; }

    var list = entriesOf(selDate);
    var s = toMin($('startSel').value);
    var e = toMin($('endSel').value);
    var myColor = me.color || COLORS[0];
    var ok = (s >= 0 && e > s);
    var conf = ok ? conflictFor(toHM(s), toHM(e)) : null;
    var w = viewWin(), h0 = w[0], h1 = w[1];
    var i, t, en, a, b, bs, be, ms, mf;

    el.style.height = (((h1 - h0) / 60) * TT_HOUR) + 'px';

    /* 시간 눈금 */
    var grid = '';
    for (t = h0; t <= h1; t += 60) {
      grid += '<div class="tt-h" style="top:' + f2(((t - h0) / 60) * TT_HOUR) + 'px">'
            + '<span>' + toHM(t) + '</span></div>';
    }

    /* 등록된 주차 블록 */
    var blocks = '';
    for (i = 0; i < list.length; i++) {
      en = list[i];
      a = toMin(en.start); b = toMin(en.end);
      if (!(b > a)) { continue; }
      bs = Math.max(a, h0); be = Math.min(b, h1);
      if (be <= bs) { continue; }
      blocks += ttBlock(en.name, en.start, en.end, en.color, bs, be, h0, false);
    }

    /* 내가 고른 시간 미리보기 (겹치면 빨갛게 그대로 보여 핸들로 고칠 수 있게 한다) */
    if (ok) {
      ms = Math.max(s, h0); mf = Math.min(e, h1);
      if (mf > ms) {
        blocks += ttBlock(me.name || '내 시간', toHM(s), toHM(e), conf ? '#c24a60' : myColor, ms, mf, h0, true);
      }
    }

    el.innerHTML = grid + '<div class="tt-blocks">' + blocks + '</div>';

    var sum = $('pickSum');
    if (sum) { sum.textContent = (s >= 0 && e >= 0) ? (toHM(s) + ' ~ ' + toHM(e)) : '-'; }
  }

  function renderPick(){
    renderDial();
    var start = $('startSel').value, end = $('endSel').value;
    var warn = $('rangeWarn');
    var btn = $('regBtn');
    var line = $('pickLine');
    btn.textContent = me.name ? (me.name + ' 님으로 등록') : '이름 정하고 등록';
    var msg = '';
    if (!start || !end || end <= start) {
      msg = '종료 시간이 시작 시간보다 빨라요.';
    } else {
      var c = conflictFor(start, end);
      if (c) {
        msg = (me.name && c.name === me.name)
          ? '이미 내 주차(' + c.start + '~' + c.end + ')가 있어 겹칩니다.'
          : '이미 ' + c.start + '~' + c.end + '(' + c.name + ') 예약이 있어 겹칩니다.';
      }
    }
    if (msg) {
      warn.textContent = msg;
      warn.hidden = false;
      btn.disabled = true;
    } else {
      warn.hidden = true;
      btn.disabled = false;
    }
    if (line) { line.classList.toggle('bad', !!msg); }
    /* 아래 휠 피커도 같은 시작~종류로 맞춘다 (드래그 중에는 즉시 따라오게) */
    syncWheels(!drag);
  }

  function rememberRange(){
    range.start = $('startSel').value;
    range.end = $('endSel').value;
  }

  /* ---------- 타임테이블 직접 선택: 드래그·탭·핸들 ---------- */
  /* 시계 위 좌표(y)를 30분 단위 시각으로 바꿈 */
  function ttMinAt(clientY){
    var r = $('timetable').getBoundingClientRect();
    var h = r.height || 1;
    var y = clientY - r.top;
    if (y < 0) { y = 0; }
    if (y > h) { y = h; }
    var v = (y / h) * 1440;
    return Math.max(0, Math.min(1440, Math.round(v / 30) * 30));
  }

  /* 내 미리보기 블록의 위·아래 가장자리를 잡았는지 */
  function mineEdge(clientX, clientY){
    var el = document.querySelector('#timetable .tt-b.me');
    if (!el) { return ''; }
    var r = el.getBoundingClientRect();
    if (clientX < r.left - 8 || clientX > r.right + 8) { return ''; }
    if (clientY < r.top - 12 || clientY > r.bottom + 12) { return ''; }
    var rel = clientY - r.top;
    var edge = Math.min(16, Math.max(7, r.height / 2));
    if (rel <= edge) { return 'start'; }
    if (r.height - rel <= edge) { return 'end'; }
    return 'body';
  }

  /* 시작~종료를 30분 단위로 맞춰 셀렉트·미리보기·경고를 바로 반영 */
  function setRange(s0, e0){
    var s = Math.max(0, Math.min(1410, Math.round(s0 / 30) * 30));
    var e = Math.min(1440, Math.max(s + 30, Math.round(e0 / 30) * 30));
    range.start = toHM(s);
    range.end = toHM(e);
    $('startSel').value = range.start;
    $('endSel').value = range.end;
    renderPick();
  }

  /* 빈 칸을 톡 누르면 그 시각부터 2시간 (뒤에 예약이 걸리면 그 앞까지) */
  function tapPick(min){
    var s0 = Math.max(0, Math.min(1410, min));
    var list = entriesOf(selDate);
    var i, a, b, start = s0, end;
    for (i = 0; i < list.length; i++) {
      a = toMin(list[i].start); b = toMin(list[i].end);
      if (b > a && a <= s0 && s0 < b && b > start) { start = b; }
    }
    if (start > 1410) { start = 1410; }
    end = Math.min(1440, start + 120);
    for (i = 0; i < list.length; i++) {
      a = toMin(list[i].start); b = toMin(list[i].end);
      if (b > a && a >= start && a < end) { end = a; }
    }
    if (end - start < 30) { end = Math.min(1440, start + 30); }
    setRange(start, end);
  }

  function ttDown(e){
    if (drag) { return; }
    if (e.button != null && e.button !== 0) { return; }
    var edge = mineEdge(e.clientX, e.clientY);
    if (edge === 'body') { return; }
    var s = toMin($('startSel').value), t = toMin($('endSel').value);
    drag = {
      mode: edge || 'new',
      anchor: ttMinAt(e.clientY),
      y0: e.clientY,
      moved: false,
      from: s, to: t,
      fixed: (edge === 'start') ? t : s,
      id: e.pointerId
    };
    try { $('timetable').setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  }

  function ttMove(e){
    if (!drag) { return; }
    e.preventDefault();
    if (Math.abs(e.clientY - drag.y0) > 5) { drag.moved = true; }
    var s = drag.from, t = drag.to;
    var cur = ttMinAt(e.clientY);
    if (drag.mode === 'start') {
      s = Math.min(cur, drag.fixed - 30);
      t = drag.fixed;
    } else if (drag.mode === 'end') {
      s = drag.fixed;
      t = Math.max(cur, drag.fixed + 30);
    } else {
      /* 위로 드래그해도 시작·종료가 자동 정렬된다 */
      s = Math.min(drag.anchor, cur);
      t = Math.max(drag.anchor, cur);
      if (t - s < 30) {
        if (cur >= drag.anchor) { t = drag.anchor + 30; } else { s = drag.anchor - 30; }
      }
    }
    setRange(s, t);
  }

  function ttUp(e){
    if (!drag) { return; }
    var d = drag;
    drag = null;
    try { $('timetable').releasePointerCapture(e.pointerId); } catch(err){}
    if (!d.moved) {
      if (d.mode === 'new') { tapPick(d.anchor); }
      else { setRange(d.from, d.to); }
    }
    rememberRange();
    renderDateSheet();
  }

  function ttCancel(){
    if (!drag) { return; }
    var d = drag;
    drag = null;
    setRange(d.from, d.to);
    renderDateSheet();
  }

  /* ---------- 휠 피커 (갤럭시 시계 알람 스타일 드럼롤) ---------- */
  var WP_ITEM = 44;      /* 한 칸(44px)씩 세 칸이 보인다 */
  var wheels = null;
  var wheelBusy = 0;     /* 사용자가 직접 휠을 돌리는 중 */
  var progUntil = 0;     /* 프로그램으로 돌리는 중(그 사이 사용자 값 반영은 건넌다) */

  function buildWheel(col, arr){
    var html = '<div class="wp-pad"></div>';
    for (var i = 0; i < arr.length; i++) {
      html += '<div class="it" data-i="' + i + '">' + arr[i] + '</div>';
    }
    html += '<div class="wp-pad"></div>';
    col.innerHTML = html;
  }

  function markWheel(col, idx){
    var its = col.children;
    for (var i = 0; i < its.length; i++) {
      var el = its[i];
      if (!el.getAttribute || el.getAttribute('data-i') === null) { continue; }
      var d = Math.abs((+el.getAttribute('data-i')) - idx);
      if (d === 0) { el.classList.add('on'); } else { el.classList.remove('on'); }
      el.style.opacity = d === 0 ? '1' : (d === 1 ? '.55' : '.3');
      el.style.transform = d === 0 ? 'scale(1)' : 'scale(' + (d === 1 ? '.9' : '.84') + ')';
    }
  }

  function setWheel(col, idx, smooth, prog){
    if (!col) { return; }
    var last = col.children.length - 3;   /* 앞·뒤 여백 제외 */
    if (idx < 0) { idx = 0; }
    if (idx > last) { idx = last; }
    var top = idx * WP_ITEM;
    if (Math.abs(col.scrollTop - top) < 1) { markWheel(col, idx); return; }
    if (prog) { progUntil = Date.now() + 520; }
    if (smooth && col.scrollTo) { col.scrollTo({ top: top, behavior: 'smooth' }); }
    else { col.scrollTop = top; }
    markWheel(col, idx);
    /* 폭이 생기기 전· 화면에 막 드러난 직후에는 한 프레임 늦게 한 번 더 맞춘다 */
    if (Math.abs(col.scrollTop - top) > 2 && window.requestAnimationFrame) {
      requestAnimationFrame(function(){
        if (Math.abs(col.scrollTop - top) > 1) { col.scrollTop = top; }
      });
    }
  }

  /* 휠에서 고른 값을 셀렉트(상태 원본)에 반영하고 타임테이블·경고를 바로 갱신 */
  function commitWheel(side, unit, idx){
    var sSel = $('startSel'), eSel = $('endSel');
    var sel = (side === 'start') ? sSel : eSel;
    var cur = String(sel.value || '');
    if (!/^\d{2}:\d{2}$/.test(cur)) { return; }
    var h = +cur.slice(0, 2), m = cur.slice(3, 5);
    if (side === 'start') {
      if (unit === 'h') { h = Math.max(0, Math.min(23, idx)); }
      else { m = idx ? '30' : '00'; }
    } else {
      if (unit === 'h') {
        h = Math.max(0, Math.min(24, idx));
        if (h === 24) { m = '00'; }
      } else {
        m = idx ? '30' : '00';
        if (h === 24) { m = '00'; }
      }
    }
    sel.value = pad(h) + ':' + m;
    rememberRange();
    renderPick();
    syncWheels(false);
  }

  function bindWheel(col, side, unit){
    var tm = null;
    col.addEventListener('scroll', function(){
      var idx = Math.round(col.scrollTop / WP_ITEM);
      markWheel(col, idx);
      wheelBusy++;
      clearTimeout(tm);
      tm = setTimeout(function(){
        wheelBusy = 0;
        if (Date.now() < progUntil) { return; }
        var i = Math.round(col.scrollTop / WP_ITEM);
        if (Math.abs(col.scrollTop - i * WP_ITEM) > 1) { col.scrollTop = i * WP_ITEM; }
        commitWheel(side, unit, i);
      }, 140);
    }, { passive: true });
    col.addEventListener('click', function(e){
      var it = e.target.closest ? e.target.closest('.it') : null;
      if (!it) { return; }
      var i = +it.getAttribute('data-i');
      setWheel(col, i, true, false);
      commitWheel(side, unit, i);
    });
  }

  function initWheels(){
    if (wheels) { return; }
    var hs = [], he = [];
    for (var i = 0; i < 24; i++) { hs.push(pad(i)); }
    for (var j = 0; j < 25; j++) { he.push(pad(j)); }
    wheels = { SH: $('colSH'), SM: $('colSM'), EH: $('colEH'), EM: $('colEM') };
    if (!wheels.SH) { wheels = null; return; }
    buildWheel(wheels.SH, hs);
    buildWheel(wheels.SM, ['00', '30']);
    buildWheel(wheels.EH, he);
    buildWheel(wheels.EM, ['00', '30']);
    bindWheel(wheels.SH, 'start', 'h');
    bindWheel(wheels.SM, 'start', 'm');
    bindWheel(wheels.EH, 'end', 'h');
    bindWheel(wheels.EM, 'end', 'm');
    syncWheels(false);
  }

  /* 타임테이블·셀렉트의 시작~종료를 휠 위치로 맞춘다 */
  function syncWheels(smooth){
    if (!wheels) { return; }
    if (wheelBusy > 0) { return; }
    var s = $('startSel').value, e = $('endSel').value;
    var sm = toMin(s), em = toMin(e);
    if (sm < 0 || em < 0) { return; }
    setWheel(wheels.SH, Math.floor(sm / 60), smooth, true);
    setWheel(wheels.SM, (sm % 60) ? 1 : 0, smooth, true);
    setWheel(wheels.EH, Math.floor(em / 60), smooth, true);
    setWheel(wheels.EM, (em % 60) ? 1 : 0, smooth, true);
    wheels.EM.classList.toggle('lock', em >= 1440);
  }

  /* 등록 직후: 그날 빈 2시간대로 자동 이동(겹침 경고가 띄지 않도록) */
  function shiftRange(end){
    if (!/^\d{2}:\d{2}$/.test(end)) { return; }
    var fr = freeSlot(entriesOf(selDate), toMin(end));
    if (!fr) { return; }
    range.start = fr[0];
    range.end = fr[1];
    $('startSel').value = range.start;
    $('endSel').value = range.end;
    renderDateSheet();
  }

  function register(){
    if (!me.name) { pending = register; openMe(); return; }
    var start = $('startSel').value, end = $('endSel').value;
    if (end <= start) { toast('종료 시간이 시작보다 빨라요.'); return; }
    var c = conflictFor(start, end);
    if (c) { toast('이미 ' + c.start + '~' + c.end + '(' + c.name + ') 예약이 있어 겹칩니다.'); return; }
    var date = selDate;
    var entry = { id: 'tmp' + Date.now(), name: me.name, color: me.color, d: date, start: start, end: end, note: me.note };
    var snapE = state.entries.slice(), snapL = state.logs.slice();
    state.entries = state.entries.concat([entry]);
    renderDateSheet(); renderCal();
    chain = chain.then(function(){
      return api({
        mode: 'parking_set', date: date, name: me.name, color: me.color,
        start: start, end: end, note: me.note, on: '1', by: me.name
      });
    }).then(function(d){
      applyState(d);
      saveCache(d);
        render();
      toast(start + '~' + end + ' 등록했어요.');
      shiftRange(end);
    }).catch(function(err){
      state.entries = snapE; state.logs = snapL;
      render();
      if (err && err.error === 'overlap' && err.conflict) {
        toast('이미 ' + err.conflict.start + '~' + err.conflict.end + '(' + err.conflict.name + ') 예약이 있어 겹칩니다.');
      } else if (err && err.error === 'overlap') {
        toast('이미 그 시간대에 예약이 있어 등록할 수 없어요.');
      } else {
        toast('등록하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
      }
      load();
    });
  }

  function removeEntry(id, name){
    if (!id) { return; }
    /* 내가 등록한 주차만 취소할 수 있다 */
    if (!me.name || name !== me.name) { toast('내가 등록한 주차만 취소할 수 있어요.'); return; }
    var snapE = state.entries.slice(), snapL = state.logs.slice();
    state.entries = state.entries.filter(function(e){ return e.id !== id; });
    renderDateSheet(); renderCal();
    chain = chain.then(function(){
      return api({ mode: 'parking_set', date: selDate, id: id, name: name, on: '0', by: me.name || '이름 미설정' });
    }).then(function(d){
      applyState(d);
      saveCache(d);
      render();
      toast('주차를 취소했어요.');
    }).catch(function(){
      state.entries = snapE; state.logs = snapL;
      render();
      toast('취소하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
      load();
    });
  }

  /* ---------- 공지·메모 ---------- */
  function fmtAt(at){
    var s = String(at || '');
    return s.length >= 16 ? s.slice(5, 10).replace('-', '/') + ' ' + s.slice(11, 16) : s;
  }

  function cleanNotice(v){
    return String(v || '').replace(/[\u200B\uFEFF\u200C\u200D]/g, '').trim();
  }

  function renderNotice(){
    var n = state.notice || { text: '', by: '', at: '' };
    var text = cleanNotice(n.text);
    var v = $('noticeView');
    if (text) {
      v.textContent = text;
      v.className = 'notice-view';
    } else {
      v.textContent = '공지나 메모를 남겨 보세요';
      v.className = 'notice-view none';
    }
    var meta = '';
    if (text && (n.by || n.at)) {
      meta = String(n.by || '') + (n.at ? ' · ' + fmtAt(n.at) + ' 수정' : '');
    }
    $('noticeMeta').textContent = meta;
  }

  function openNoticeEdit(){
    if (!noticeLoaded) {
      toast('공지를 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.');
      loadNotice();
      return;
    }
    $('noticeText').value = cleanNotice(state.notice && state.notice.text);
    $('noticeBox').classList.add('editing');
    $('noticeForm').hidden = false;
    setTimeout(function(){ try { $('noticeText').focus(); } catch(e){} }, 60);
  }

  function closeNoticeEdit(){
    $('noticeBox').classList.remove('editing');
    $('noticeForm').hidden = true;
  }

  function saveNotice(){
    var text = ($('noticeText').value || '').replace(/\r\n/g, '\n').trim().slice(0, 500);
    if (!text) { toast('내용을 입력해 주세요.'); return; }
    var snap = state.notice;
    var go = function(){
      closeNoticeEdit();
      chain = chain.then(function(){
        return api({ mode: 'parking_notice_set', text: text, by: me.name });
      }).then(function(d){
        state.notice = d.notice || { text: text, by: me.name, at: '' };
        renderNotice();
      }).catch(function(){
        state.notice = snap;
        renderNotice();
        toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
      });
    };
    if (!me.name) { pending = go; openMe(); return; }
    go();
  }

  function loadNotice(){
    return apiRead({ mode: 'parking_notice_get' }).then(function(d){
      state.notice = d.notice || { text: '', by: '', at: '' };
      noticeLoaded = true;
      renderNotice();
    }).catch(function(){
      /* apiRead가 3회까지 재시도했으므로 더 돌지 않는다 (화면에 다시 돌아오면 새로 부른다) */
    });
  }

  /* ---------- 이벤트 ---------- */
  $('meBtn').addEventListener('click', openMe);
  $('mSave').addEventListener('click', saveMe);
  $('mName').addEventListener('keydown', function(e){ if (e.key === 'Enter') { saveMe(); } });

  $('mColors').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.sw') : null;
    if (!b) { return; }
    pickColor = b.getAttribute('data-c');
    renderColors();
  });

  $('noticeEditBtn').addEventListener('click', openNoticeEdit);
  $('noticeView').addEventListener('click', function(){
    if ($('noticeBox').classList.contains('editing')) { return; }
    openNoticeEdit();
  });
  $('noticeSave').addEventListener('click', saveNotice);
  $('noticeCancel').addEventListener('click', closeNoticeEdit);

  $('calGrid').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.cell') : null;
    if (!b) { return; }
    var date = b.getAttribute('data-date');
    if (!date) { return; }
    openDate(date);
  });

  $('prevBtn').addEventListener('click', function(){
    view.m--; if (view.m < 0) { view.m = 11; view.y--; }
    render();
  });
  $('nextBtn').addEventListener('click', function(){
    view.m++; if (view.m > 11) { view.m = 0; view.y++; }
    render();
  });
  $('todayBtn').addEventListener('click', function(){
    view = todayMonth();
    render();
  });

  $('startSel').addEventListener('change', function(){
    rememberRange();
    renderDateSheet();
  });
  $('endSel').addEventListener('change', function(){ rememberRange(); renderDateSheet(); });
  $('regBtn').addEventListener('click', register);

  /* 휠 피커 */
  var wpEl = $('timetable');
  wpEl.addEventListener('pointerdown', ttDown);
  wpEl.addEventListener('pointermove', ttMove);
  wpEl.addEventListener('pointerup', ttUp);
  wpEl.addEventListener('pointercancel', ttCancel);
  wpEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  $('dateList').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.del') : null;
    if (!b) { return; }
    removeEntry(b.getAttribute('data-del'), b.getAttribute('data-name'));
  });

  $('logToggle').addEventListener('click', function(){
    var card = $('logCard');
    var list = $('logList');
    var open = card.classList.toggle('open');
    list.hidden = !open;
  });

  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-close]') : null;
    if (!el) { return; }
    closeSheet(el.getAttribute('data-close'));
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') { return; }
    closeNoticeEdit();
    closeSheet('dateSheet'); closeSheet('meSheet');
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && loaded) { load(); loadNotice(); }
  });

  /* 시작 */
  loadMe();
  /* 서버 응답을 기다리지 않고 캐시가 있으면 바로 달력을 채운다 */
  var cached = readCache();
  applyState(cached || SEED);   /* 캐시가 없으면 함께 넣어 둔 스냅샷으로 즉시 그린다 */
  buildTimeOptions();
  initWheels();
  renderColors();
  render();
  renderNotice();
  load();
  loadNotice();
})();
</script>
