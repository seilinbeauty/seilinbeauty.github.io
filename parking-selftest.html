<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>🚗 주차 캘린더</title>
<link rel="icon" type="image/svg+xml" href="favicon-parking.svg?v=2">
<link rel="icon" type="image/png" sizes="180x180" href="parking-apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" href="parking-apple-touch-icon.png?v=2">
<style>
  :root{
    --pink:#e88295; --pink-deep:#be465e; --pink-light:#fff4f6; --pink-line:#f2d9df;
    --text:#26232a; --muted:#6f6a78; --dim:#9a95a2;
    --bg:#fbf8f9; --card:#ffffff; --line:#f0e6ea;
    --shadow:0 4px 16px rgba(190,70,94,.07);
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    font-size:14px; line-height:1.45;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:15px;}

  /* 상단 */
  .top{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px 12px calc(16px + env(safe-area-inset-left));
    background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top h1{margin:0; font-size:16px; font-weight:800; letter-spacing:-.02em;}
  .top h1 .emoji{font-size:16px;}
  .me{
    display:flex; align-items:center; gap:6px; flex:0 0 auto;
    max-width:150px; padding:7px 11px; border-radius:999px;
    background:var(--pink-light); border:1px solid var(--pink-line);
    font-size:12px; font-weight:700; color:var(--pink-deep);
    white-space:nowrap; overflow:hidden;
  }
  .me .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:var(--pink);}
  .me .nm{overflow:hidden; text-overflow:ellipsis;}
  main{
    max-width:560px; margin:0 auto; padding:14px 12px 40px;
    display:flex; flex-direction:column; gap:12px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px;
  }
  /* 공지·메모 */
  .notice{margin:0;}
  .notice-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .notice-head b{font-size:11.5px; font-weight:800; color:var(--muted);}
  .notice-edit{
    padding:5px 10px; border-radius:999px; font-size:11px; font-weight:800;
    color:var(--pink-deep); background:var(--pink-light); border:1px solid var(--pink-line);
  }
  .notice-view{
    font-size:12.5px; color:var(--text); white-space:pre-wrap; word-break:break-word;
    line-height:1.5; cursor:pointer; border-radius:8px;
  }
  .notice-view.none{color:var(--dim);}
  .notice-meta{margin-top:5px; font-size:10.5px; color:var(--dim); font-weight:700;}
  .notice-form{margin-top:8px;}
  .notice-form textarea{
    display:block; width:100%; padding:10px 11px; border-radius:11px; border:1px solid var(--line);
    background:#fdfbfc; color:var(--text); outline:none; resize:vertical; min-height:76px;
    font-family:inherit; font-size:13px; line-height:1.5;
  }
  .notice-form textarea:focus{border-color:var(--pink); background:#fff;}
  .notice-form .sheet-actions{margin-top:8px;}
  .notice-form .btn{padding:10px; font-size:13px;}
  .notice.editing .notice-view,
  .notice.editing .notice-meta,
  .notice.editing .notice-edit{display:none;}

  /* 달력 */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cal-head .nav{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:700; color:var(--pink-deep); background:var(--pink-light);
  }
  .cal-title{display:flex; align-items:center; gap:8px;}
  .cal-title b{font-size:15px; font-weight:800; letter-spacing:-.02em;}
  .today-btn{
    padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700;
    color:var(--muted); border:1px solid var(--line); background:#fff;
  }
  .dow{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px;}
  .dow span{text-align:center; font-size:11px; font-weight:700; color:var(--dim); padding:4px 0;}
  .dow span:first-child{color:#d2697b;}
  .dow span:last-child{color:#5b8fc7;}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cell{
    position:relative; display:flex; flex-direction:column; align-items:center;
    min-height:64px; padding:4px 1px 3px; border-radius:10px;
    background:#fff; border:1px solid transparent; text-align:center;
    overflow:hidden;
  }
  .cell:active{background:var(--pink-light);}
  .cell .num{font-size:12px; font-weight:700; color:var(--text); line-height:1.2; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
  .cell.sun .num{color:#d2697b;}
  .cell.sat .num{color:#5b8fc7;}
  .cell.out .num{color:#c9c4ce;}
  .cell.today{background:var(--pink-light); border-color:var(--pink-line);}
  .cell.today .num{background:var(--pink); color:#fff;}
  .cell.sel{border-color:var(--pink); box-shadow:inset 0 0 0 1px var(--pink);}
  .badges{display:flex; flex-direction:column; gap:2px; width:100%; align-items:center; margin-top:1px;}
  .badges i{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    max-width:100%; padding:1px 1px; border-radius:4px;
    font-style:normal; font-weight:800; line-height:1.15; overflow:hidden;
  }
  .badges i b{font-size:8px; font-weight:800; letter-spacing:-.3px; white-space:nowrap;}
  .badges i em{font-size:7px; font-style:normal; font-weight:700; letter-spacing:-.3px; opacity:.9; white-space:nowrap;}
  .badges .more{font-size:8px; font-weight:800; color:var(--dim);}

  /* 로그 */
  .log{padding:0; overflow:hidden;}
  .log-toggle{
    width:100%; display:flex; align-items:center; gap:7px;
    padding:14px; font-size:13px; font-weight:800; text-align:left;
  }
  .log-toggle .cnt{font-size:11px; font-weight:700; color:var(--dim);}
  .log-toggle .arrow{margin-left:auto; color:var(--dim); font-size:12px; transition:transform .18s;}
  .log.open .log-toggle .arrow{transform:rotate(180deg);}
  .log-list{max-height:320px; overflow-y:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--line);}
  .log-item{display:flex; gap:8px; padding:9px 14px; border-bottom:1px solid #faf6f8; font-size:12px;}
  .log-item:last-child{border-bottom:0;}
  .log-item .at{color:var(--dim); font-weight:700; flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .log-item .body{flex:1 1 auto; min-width:0;}
  .log-item .who{font-weight:800; color:var(--pink-deep);}
  .log-item .act{font-weight:800;}
  .log-item .det{color:var(--muted); margin-left:2px;}
  .log-empty{padding:16px 14px; font-size:12px; color:var(--dim); text-align:center;}

  /* 시트(바텀시트) */
  .sheet-wrap{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center;}
  .sheet-wrap[hidden]{display:none;}
  .sheet-backdrop{position:absolute; inset:0; background:rgba(38,35,42,.34);}
  .sheet{
    position:relative; width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#fff; border-radius:20px 20px 0 0;
    padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.12);
    animation:up .2s ease-out;
  }
  @keyframes up{from{transform:translateY(14px); opacity:.6} to{transform:none; opacity:1}}
  .grip{width:36px; height:4px; border-radius:2px; background:#ece6e9; margin:2px auto 10px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .sheet-head b{font-size:15px; font-weight:800;}
  .sheet-head .x{width:30px; height:30px; border-radius:50%; background:#f7f3f5; color:var(--muted); font-size:14px;}

  /* 날짜 시트 */
  .list-head{display:flex; align-items:center; justify-content:space-between; margin:2px 0 7px;}
  .list-head b{font-size:11.5px; font-weight:800; color:var(--muted);}
  .list-head span{font-size:11px; font-weight:700; color:var(--dim);}
  .toggle-list{display:flex; flex-direction:column; gap:7px;}
  .slot{
    display:flex; align-items:center; gap:9px; width:100%;
    padding:10px 11px; border-radius:12px; border:1px solid var(--line); background:#fff;
  }
  .slot .dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto;}
  .slot .nm{font-size:13.5px; font-weight:800; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .slot .tm{font-size:12px; font-weight:800; color:var(--pink-deep); flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .slot .memo{font-size:11px; color:var(--dim); font-weight:600; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;}
  .slot .del{
    flex:0 0 26px; width:26px; height:26px; border-radius:50%;
    background:#f7f3f5; color:var(--dim); font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .slot .del:active{background:#fdf1f3; color:#c24a60;}
  .slot .del-none{flex:0 0 26px; width:26px;}
  .empty{padding:14px 4px 4px; font-size:12.5px; color:var(--dim); text-align:center;}

  .range-head{display:flex; align-items:center; justify-content:space-between; margin:16px 0 7px;}
  .range-head b{font-size:11.5px; font-weight:800; color:var(--muted);}
  .range-head > span{font-size:11px; font-weight:700; color:var(--dim);}

  /* 24시간 시계 (보기 전용 표시) — 진짜 아날로그 시계판 */
  .dial-wrap{display:flex; justify-content:center; margin:3px 0 5px;}
  .dial{width:282px; max-width:100%; pointer-events:none; user-select:none; -webkit-user-select:none;}
  .dial svg{display:block; width:100%; height:auto;}
  .dial .face{fill:#fff; stroke:var(--pink-line); stroke-width:2;}
  .dial .bez{fill:none; stroke:#f8eef2; stroke-width:1.6;}
  .dial .chap{fill:none; stroke:#f2e7ee; stroke-width:.9;}
  .dial .segs path{stroke-linejoin:round;}
  .dial .tk{stroke:#b3a0ab; stroke-width:1.6; stroke-linecap:round;}
  .dial .tk.half{stroke:#e8dce3; stroke-width:.9;}
  .dial .num{fill:#4a4552; font-size:10.6px; font-weight:800; text-anchor:middle; dominant-baseline:central; font-family:inherit; letter-spacing:-.3px;}
  .dial .hub-o{fill:#fff; stroke:#d9c6d0; stroke-width:1.3;}
  .dial .hub-i{fill:#b9a4b0;}
  .dial .nm-lb{font-size:9.2px; font-weight:800; font-family:inherit; text-anchor:middle; dominant-baseline:central; letter-spacing:-.2px;}
  /* 오전·오후 전환 탭 */
  .dawn-row{display:flex; justify-content:center; margin:1px 0 6px;}
  .dawn-btn{
    display:inline-flex; align-items:center; gap:4px;
    padding:6px 13px; border-radius:999px; font-size:11.5px; font-weight:800;
    color:var(--dim); background:#fff; border:1px solid var(--line);
    letter-spacing:-.2px; white-space:nowrap;
  }
  .dawn-btn.on{background:var(--pink-light); border-color:var(--pink-line); color:var(--pink-deep);}
  .dawn-btn .dot{
    width:5px; height:5px; border-radius:50%; background:var(--pink);
    opacity:0; transition:opacity .15s;
  }
  .dawn-btn.has .dot{opacity:1;}
  .pick-line{display:flex; align-items:baseline; justify-content:center; gap:7px; margin:5px 0 7px; flex-wrap:wrap;}
  .pick-line b{font-size:15px; font-weight:800; color:var(--pink-deep); letter-spacing:-.2px; font-variant-numeric:tabular-nums;}
  .pick-line span{font-size:10.5px; font-weight:700; color:var(--dim);}
  .pick-line.bad b{color:#c24a60;}
  .range-row{display:flex; align-items:center; gap:6px;}
  .range-row .mini{
    flex:1 1 0; min-width:0; display:flex; align-items:center; gap:5px;
    padding:8px 10px; border-radius:11px; border:1px solid var(--line); background:#fdfbfc;
  }
  .range-row .mini:focus-within{border-color:var(--pink); background:#fff;}
  .range-row .mini span{flex:0 0 auto; font-size:10.5px; font-weight:800; color:var(--dim);}
  .range-row .mini select{
    flex:1 1 auto; min-width:0; padding:0; border:0; background:transparent;
    color:var(--text); font-size:13px; font-weight:800; text-align:center; outline:none;
    font-variant-numeric:tabular-nums; -webkit-appearance:none; appearance:none;
  }
  .range-row .tilde{flex:0 0 auto; color:var(--dim); font-weight:800;}
  .warn{
    margin:9px 0 0; padding:8px 10px; border-radius:10px;
    background:#fdf1f3; color:#c24a60; font-size:11.5px; font-weight:700; line-height:1.4;
  }
  .warn[hidden]{display:none;}
  .sheet-actions{display:flex; gap:8px; margin-top:10px;}
  .btn{flex:1 1 auto; padding:12px; border-radius:12px; font-size:14px; font-weight:800; text-align:center;}
  .btn.primary{background:var(--pink); color:#fff;}
  .btn.primary[disabled]{background:#f0dfe4; color:#b08e97;}
  .btn.ghost{background:#f8f4f6; color:var(--muted); flex:0 0 96px;}
  .sheet-note{margin:10px 0 0; font-size:11px; color:var(--dim); text-align:center;}

  /* 내 정보 */
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:11.5px; font-weight:800; color:var(--muted); margin-bottom:5px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line);
    background:#fdfbfc; outline:none;
  }
  .field input:focus{border-color:var(--pink); background:#fff;}
  .swatches{display:flex; gap:9px; flex-wrap:wrap;}
  .sw{width:30px; height:30px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);}
  .sw.on{box-shadow:0 0 0 2px var(--pink-deep);}

  /* 토스트 */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,12px);
    background:rgba(38,35,42,.92); color:#fff; font-size:12.5px; font-weight:700;
    padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:90; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  @media (min-width:640px){
    main{max-width:620px; padding-top:20px;}
    body{font-size:14.5px;}
    .cell{min-height:78px;}
    .badges i b{font-size:9px;}
    .badges i em{font-size:8px;}
    .sheet-wrap{align-items:center;}
    .sheet{border-radius:18px; max-width:440px; padding-bottom:16px;}
    .dial{width:320px;}
    .grip{display:none;}
  }
</style>
</head>
<body>

<header class="top">
  <h1><span class="emoji">🚗</span> 주차 캘린더</h1>
  <button class="me" id="meBtn" type="button">
    <span class="dot" id="meDot"></span><span class="nm" id="meName">내 이름</span>
  </button>
</header>

<main>
  <section class="card">
    <div class="notice" id="noticeBox">
      <div class="notice-head">
        <b>📌 공지·메모</b>
        <button class="notice-edit" id="noticeEditBtn" type="button">수정</button>
      </div>
      <div class="notice-view none" id="noticeView">공지나 메모를 남겨 보세요</div>
      <div class="notice-meta" id="noticeMeta"></div>
      <div class="notice-form" id="noticeForm" hidden>
        <textarea id="noticeText" rows="3" maxlength="500" placeholder="예: 이번 주는 3번 자리 비워 주세요"></textarea>
        <div class="sheet-actions">
          <button class="btn ghost" id="noticeCancel" type="button">취소</button>
          <button class="btn primary" id="noticeSave" type="button">저장</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="cal-head">
      <button class="nav" id="prevBtn" type="button" aria-label="이전 달">‹</button>
      <div class="cal-title">
        <b id="ymLabel">-</b>
        <button class="today-btn" id="todayBtn" type="button">오늘</button>
      </div>
      <button class="nav" id="nextBtn" type="button" aria-label="다음 달">›</button>
    </div>
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="calGrid"></div>
  </section>

  <section class="card log" id="logCard">
    <button class="log-toggle" id="logToggle" type="button">
      📝 등록 로그 <span class="cnt" id="logCount"></span>
      <span class="arrow">▾</span>
    </button>
    <div class="log-list" id="logList" hidden></div>
  </section>
</main>

<!-- 날짜 상세 -->
<div class="sheet-wrap" id="dateSheet" hidden>
  <div class="sheet-backdrop" data-close="dateSheet"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <b id="dateTitle">-</b>
      <button class="x" type="button" data-close="dateSheet">✕</button>
    </div>
    <div class="list-head"><b>등록 현황</b><span id="listCount"></span></div>
    <div class="toggle-list" id="dateList"></div>
    <div class="range-head"><b>시간대 등록</b><span>주차 1대</span></div>
    <div class="dawn-row">
      <button class="dawn-btn" id="dawnBtn" type="button" aria-pressed="false">🌙 새벽<i class="dot"></i></button>
    </div>
    <div class="dial-wrap">
      <div class="dial" id="clockDay"></div>
    </div>
    <div class="pick-line" id="pickLine">
      <b id="pickSum">-</b>
    </div>
    <div class="range-row">
      <label class="mini"><span>시작</span><select id="startSel" aria-label="시작 시간"></select></label>
      <span class="tilde">~</span>
      <label class="mini"><span>종료</span><select id="endSel" aria-label="종료 시간"></select></label>
    </div>
    <p class="warn" id="rangeWarn" hidden></p>
    <div class="sheet-actions">
      <button class="btn primary" id="regBtn" type="button">내 이름으로 등록</button>
    </div>
    <p class="sheet-note">겹치는 시간대는 등록할 수 없습니다</p>
  </div>
</div>

<!-- 내 정보 -->
<div class="sheet-wrap" id="meSheet" hidden>
  <div class="sheet-backdrop" data-close="meSheet"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <b>내 정보</b>
      <button class="x" type="button" data-close="meSheet">✕</button>
    </div>
    <div class="field">
      <label for="mName">이름</label>
      <input id="mName" type="text" maxlength="12" placeholder="예: 도현" autocomplete="off">
    </div>
    <div class="field">
      <label>색상</label>
      <div class="swatches" id="mColors"></div>
    </div>
    <div class="field">
      <label for="mNote">메모 (선택)</label>
      <input id="mNote" type="text" maxlength="40" placeholder="예: 오전만" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <button class="btn primary" id="mSave" type="button">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var EXEC = 'https://127.0.0.1:9/exec';
  var COLORS = ['#e88295','#ef9c5a','#6bbf8a','#5b9bd5','#9a7ad5','#8b95a3'];
  var DOW = ['일','월','화','수','목','금','토'];
  var STORE = 'pk_me_v2';
  var PK_CACHE = 'pk_cache_seedtest_1';        /* 달력 즉시 표시용 로컬 캐시 */
  var READ_TIMEOUT = 5000;             /* 읽기 요청 1회 타임아웃 5초 */
  var RETRY_DELAYS = [800, 1500, 1500]; /* 실패 시 자동 재시도 간격(최대 3회) */

  var state = { entries: [], logs: [], notice: { text: '', by: '', at: '' } };
  var loaded = false;
  var noticeLoaded = false;
  var view = todayMonth();
  var selDate = '';
  var me = { name: '', color: COLORS[0], note: '' };

  /* ---------- 저장/불러오기 ---------- */
  function apiOnce(params, timeoutMs){
    var q = [];
    for (var k in params) {
      if (params[k] === undefined || params[k] === null || params[k] === '') { continue; }
      q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
    var url = EXEC + '?' + q.join('&') + '&_=' + Date.now();
    var opt = { cache: 'no-store', redirect: 'follow' };
    var tm = null, ctrl = null;
    if (timeoutMs && window.AbortController) {
      ctrl = new AbortController();
      opt.signal = ctrl.signal;
    }
    var clear = function(){ if (tm) { clearTimeout(tm); tm = null; } };
    var req = fetch(url, opt);
    if (timeoutMs) {
      /* AbortController가 없는 브라우저에서도 반드시 끊기도록 경합시킨다 */
      var limit = new Promise(function(_, reject){
        tm = setTimeout(function(){
          if (ctrl) { try { ctrl.abort(); } catch(e){} }
          reject(new Error('timeout'));
        }, timeoutMs);
      });
      req = Promise.race([req, limit]);
    }
    return req
      .then(function(r){ return r.json(); })
      .then(function(d){
        clear();
        if (!d || !d.ok) {
          var e = new Error((d && d.error) || 'fail');
          e.conflict = d && d.with;
          throw e;
        }
        return d;
      })
      .catch(function(e){ clear(); throw e; });
  }

  function apiRead(params){
    var i = 0;
    function go(){
      return apiOnce(params, READ_TIMEOUT).catch(function(err){
        if (i >= RETRY_DELAYS.length) { throw err; }
        var wait = RETRY_DELAYS[i++];
        return new Promise(function(res){ setTimeout(res, wait); }).then(go);
      });
    }
    return go();
  }

  function renderCal(){
    var y = view.y, m = view.m;
    $('ymLabel').textContent = y + '년 ' + (m + 1) + '월';
    var first = new Date(y, m, 1);
    var start = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var prevDays = new Date(y, m, 0).getDate();

    var byDate = {};
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      (byDate[e.d] = byDate[e.d] || []).push(e);
    }

    var today = todayStr();
    var cells = 0;
    var html = '';
    for (var p = start - 1; p >= 0; p--) {
      var pd = prevDays - p;
      html += cellHtml(ymd(m === 0 ? y - 1 : y, m === 0 ? 11 : m - 1, pd), pd, 'out', false, null);
      cells++;
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var date = ymd(y, m, d);
      var wd = (start + d - 1) % 7;
      var cls = wd === 0 ? 'sun' : (wd === 6 ? 'sat' : '');
      html += cellHtml(date, d, cls, date === today, byDate[date]);
      cells++;
    }
    var rest = (7 - (cells % 7)) % 7;
    for (var q = 1; q <= rest; q++) {
      html += cellHtml(ymd(m === 11 ? y + 1 : y, m === 11 ? 0 : m + 1, q), q, 'out', false, null);
    }
    $('calGrid').innerHTML = html;

        badges += '<i style="background:' + hexA(color, .16) + ';color:' + color + '">'
                + '<b>' + esc(label) + '</b>'

    }
    return '<button class="' + c + '" type="button" data-date="' + date + '">'
         + '<span class="num">' + num + '</span>'
         + '<span class="badges">' + badges + '</span>'

  /* 그날 예약과 겹치지 않는 빈 2시간대를 찾는다 (fromMin부터 30분 단위, 없으면 null) */
  function freeSlot(list, fromMin){
    var busy = [], i, a, b;
    for (i = 0; i < list.length; i++) {
      a = toMin(list[i].start); b = toMin(list[i].end);
      if (b > a) { busy.push([a, b]); }
    }
    busy.sort(function(x, y){ return x[0] - y[0]; });
    var from = (fromMin == null) ? 10 * 60 : fromMin;   /* 기본은 낮 10시부터 */
    for (var s0 = from; s0 + 120 <= 1440; s0 += 30) {
      var clear = true;
      for (i = 0; i < busy.length; i++) {
        if (s0 < busy[i][1] && busy[i][0] < s0 + 120) { clear = false; break; }
      }
      if (clear) { return [toHM(s0), toHM(s0 + 120)]; }
    }
    return null;
  }

  function openDate(date){

    /* 기본 시작~종료가 그날 예약과 겹치면 빈 2시간대로 잡아 준다 */
    if (conflictFor(range.start, range.end)) {
      var fr = freeSlot(entriesOf(date));
      if (fr) { range.start = fr[0]; range.end = fr[1]; }

    var list = entriesOf(selDate);
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.start || !e.end) { continue; }
      if (start < e.end && e.start < end) { return e; }
    }

  /* ---------- 12시간 시계 (보기 전용) ---------- */
  var CX = 100, CY = 100;
  var R_FACE = 97.5;                 /* 시계판(베젤) */
  var R_TK_OUT = 91, R_TK_HOUR = 84.2, R_TK_HALF = 87.6;
  var R_NUM = 76;                  /* 숫자는 눈금 바로 안쪽 */
  var R_CHAP = 68.5;                 /* 숫자 안쪽 둘레선 */
  var R_PIE = 66.5;                  /* 부채꼴(피자 조각) 바깥 반지름 */

  function f2(n){ return Math.round(n * 100) / 100; }
  function polar(r, deg){
    var rad = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
  }
  /* 중심점에서 뻗어 나가는 부채꼴(파이 조각) */
  function piePath(r, a0, a1){
    var span = a1 - a0;
    if (span <= 0.01) { return ''; }
    if (span >= 359.9) {
      return 'M' + (CX - r) + ',' + CY + 'A' + r + ',' + r + ' 0 1 1 ' + (CX + r) + ',' + CY
           + 'A' + r + ',' + r + ' 0 1 1 ' + (CX - r) + ',' + CY + 'Z';
    }
    var large = span > 180 ? 1 : 0;
    var p1 = polar(r, a0), p2 = polar(r, a1);
    return 'M' + CX + ',' + CY
      + 'L' + f2(p1[0]) + ',' + f2(p1[1])
      + 'A' + r + ',' + r + ' 0 ' + large + ' 1 ' + f2(p2[0]) + ',' + f2(p2[1]) + 'Z';
  }

  function toMin(v){
    var s = String(v || '');
    if (!/^\d{1,2}:\d{2}$/.test(s)) { return -1; }
    var p = s.split(':');
    return (+p[0]) * 60 + (+p[1]);
  }
  function toHM(min){
    if (min >= 1440) { return '24:00'; }
    if (min < 0) { min = 0; }
    return pad(Math.floor(min / 60)) + ':' + pad(min % 60);
  }
  /* 지금 보는 구간: 기본은 09:00~24:00, 새벽 보기는 00:00~09:00 */
  function viewWin(){ return dawn ? [0, DAY_START] : [DAY_START, 1440]; }
  /* 시작 시간이 새벽(00:00~08:30)이면 새벽 보기, 낮 시간대면 기본 보기로 맞춘다 */
  function syncDawn(){
    var s0 = toMin($('startSel').value);
    dawn = (s0 >= 0 && s0 < DAY_START);
  }
  /* 하루 24시간을 12시간 시계판 위로 접는다. 보기 구간 밖은 잘라 내고, 정오·자정을 넘으면 각도 토막으로 나눈다 */
  function dialSegs(a, b){
    var w = viewWin();
    var s = Math.max(a, w[0]), e = Math.min(b, w[1]);
    var out = [];
    if (!(e > s)) { return out; }
    var t = s;
    while (t < e) {
      var base = Math.floor(t / 720) * 720;
      var end = Math.min(e, base + 720);
      out.push([((t - base) / 720) * 360, ((end - base) / 720) * 360]);
      t = end;
    }
    return out;
  }
  /* 토막 중 가장 긴 것 (이름표는 한 번만 붙인다) */
  function biggestSeg(parts){
    var big = null, i, span;
    for (i = 0; i < parts.length; i++) {
      span = parts[i][1] - parts[i][0];
      if (!big || span > big[2]) { big = [parts[i][0], parts[i][1], span]; }
    }
    return big;
  }
  function textW(txt, fs){
    var w = 0, k, ch;
    for (k = 0; k < txt.length; k++) {
      ch = txt.charAt(k);
      w += /[가-힣]/.test(ch) ? fs : (ch === ' ' ? fs * 0.42 : fs * 0.58);
    }
    return w;
  }
  function overlaps(a, b){
    return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
  }

  /* 시계 판(베젤·눈금·숫자·중심축) 1회 생성 — 진짜 12시간 시계 */
  function buildDial(){
    var el = $('clockDay');
    if (!el) { return; }
    var ticks = '';
    for (var i = 0; i < 24; i++) {
      var d = i * 15;
      var isHour = (i % 2 === 0);
      var a = polar(R_TK_OUT, d), b = polar(isHour ? R_TK_HOUR : R_TK_HALF, d);
      ticks += '<line class="tk' + (isHour ? '' : ' half') + '" x1="' + f2(a[0]) + '" y1="' + f2(a[1])
             + '" x2="' + f2(b[0]) + '" y2="' + f2(b[1]) + '"/>';
    }
    var nums = '';
    for (var h = 0; h < 12; h++) {
      var p = polar(R_NUM, h * 30);
      nums += '<text class="num" x="' + f2(p[0]) + '" y="' + f2(p[1]) + '">' + (h === 0 ? 12 : h) + '</text>';
    }
    el.innerHTML = '<svg viewBox="0 0 200 200" role="img" aria-label="12시간 주차 시간대 시계판">'
      + '<circle class="face" cx="' + CX + '" cy="' + CY + '" r="' + R_FACE + '"/>'
      + '<circle class="bez" cx="' + CX + '" cy="' + CY + '" r="93.8"/>'
      + '<g class="segs"></g>'
      + '<circle class="chap" cx="' + CX + '" cy="' + CY + '" r="' + R_CHAP + '"/>'
      + '<g class="ticks">' + ticks + '</g>'
      + nums
      + '<g class="labels"></g>'
      + '<circle class="hub-o" cx="' + CX + '" cy="' + CY + '" r="4.2"/>'
      + '<circle class="hub-i" cx="' + CX + '" cy="' + CY + '" r="1.9"/>'
      + '</svg>';
  }

  /* 이름표: 색칠된 부채꼴 안, 그 각도 위치에 가로로 붙여 쓴다 */
  function labelBox(deg, R, w, h){
    var p = polar(R, deg);
    p[0] = Math.max(w / 2 + 6, Math.min(194 - w / 2, p[0]));
    p[1] = Math.max(h / 2 + 6, Math.min(194 - h / 2, p[1]));
    return { x: p[0], y: p[1], w: w, h: h };
  }

  function pieLabel(degMid, degSpan, name, color, placed, fs0){
    var base = String(name || '');
    if (!base) { return ''; }
    var halfRad = Math.min(88, Math.abs(degSpan) / 2) * Math.PI / 180;
    var boxH = 13.4, padX = 4.8;
    var radii = [54, 48, 42, 36, 30];   /* 바깥쪽부터 골라 넣는다 */
    for (var ri = 0; ri < radii.length; ri++) {
      var R = radii[ri];
      var chord = 2 * R * Math.sin(halfRad);
      var room = Math.min(46, Math.max(chord * 1.4 + 6, 30));
      var fs = fs0 || 9.4;
      var per = textW(base, 1) || 1;
      if (fs * per + padX * 2 > room) {
        fs = Math.max(6.6, (room - padX * 2) / per);
      }
      var txt = base;
      while (txt.length > 1 && textW(txt, fs) + padX * 2 > room + .5) { txt = txt.slice(0, txt.length - 1); }
      var w = textW(txt, fs) + padX * 2;
      /* 이름표 네 모서리가 시계판(둘레선) 안에 드는지 */
      if (Math.sqrt(w * w / 4 + (R + boxH / 2) * (R + boxH / 2)) > R_CHAP - 1.2) { continue; }
      var offs = [0, 9, -9, 17, -17, 25, -25, 33, -33];
      for (var k = 0; k < offs.length; k++) {
        var box = labelBox(degMid + offs[k], R, w, boxH);
        var hit = false;
        for (var q = 0; q < placed.length; q++) { if (overlaps(box, placed[q])) { hit = true; break; } }
        if (hit) { continue; }
        placed.push(box);
        return '<rect x="' + f2(box.x - w / 2) + '" y="' + f2(box.y - boxH / 2) + '" width="' + f2(w)
             + '" height="' + boxH + '" rx="' + f2(boxH / 2) + '" fill="' + color + '"/>'
             + '<text class="nm-lb" x="' + f2(box.x) + '" y="' + f2(box.y) + '" fill="#fff"'
             + (fs < 9.3 ? ' style="font-size:' + f2(fs) + 'px"' : '') + '>'
             + esc(txt) + '</text>';
      }
    }
    return '';
  }

  function renderDial(){
    var el = $('clockDay');
    if (!el) { return; }
    var segs = el.querySelector('.segs');
    var labels = el.querySelector('.labels');
    if (!segs || !labels) { return; }

    var list = entriesOf(selDate);
    var s = toMin($('startSel').value);
    var e = toMin($('endSel').value);
    var myColor = me.color || COLORS[0];
    var ok = (s >= 0 && e > s);
    var conf = ok ? conflictFor(toHM(s), toHM(e)) : null;
    var arcs = '', i, j, en, a, b, c, parts, hasDawn = false;

    /* 새벽 예약이 있으면 🌙 새벽 버튼에 점을 찍는다 */
    for (i = 0; i < list.length; i++) {
      if (toMin(list[i].start) < DAY_START && toMin(list[i].end) > 0) { hasDawn = true; break; }
    }
    var db = $('dawnBtn');
    if (db) {
      db.classList.toggle('on', dawn);
      db.classList.toggle('has', hasDawn);
      db.setAttribute('aria-pressed', dawn ? 'true' : 'false');
    }

    /* 등록된 주차 구간 (등록자 색상) — 기본은 09~24시, 새벽 보기는 00~09시만 한 시계판에 그린다.
       같은 시계 위치에 겹치는 구간은 반투명+테두리로 둘 다 보이게 한다 */
    for (i = 0; i < list.length; i++) {
      en = list[i];
      a = toMin(en.start); b = toMin(en.end);
      if (!(b > a)) { continue; }
      c = en.color || '#e88295';
      parts = dialSegs(a, b);
      for (j = 0; j < parts.length; j++) {
        arcs += '<path d="' + piePath(R_PIE, parts[j][0], parts[j][1]) + '" fill="' + hexA(c, .25)
              + '" stroke="' + c + '" stroke-width="1.3"/>';
      }
    }

    /* 내가 지금 맞추고 있는 구간 (내 색상) — 등록된 예약과 겹치면 그리지 않는다 */
    var mine = null;
    if (ok && !conf) {
      mine = dialSegs(Math.max(0, s), Math.min(1440, e));
      for (j = 0; j < mine.length; j++) {
        arcs += '<path d="' + piePath(R_PIE, mine[j][0], mine[j][1])
              + '" fill="' + hexA(myColor, .3) + '" stroke="' + myColor + '" stroke-width="2.2"/>';
      }
    }
    segs.innerHTML = arcs;

    /* 이름표: 색칠된 부채꼴 안에 이름. 위치가 겹치면 각도·반지름을 비켜 배치한다 */
    var placed = [], lh = '', big;
    for (i = 0; i < list.length; i++) {
      en = list[i];
      a = toMin(en.start); b = toMin(en.end);
      if (!(b > a)) { continue; }
      big = biggestSeg(dialSegs(a, b));
      if (!big) { continue; }
      lh += pieLabel((big[0] + big[1]) / 2, big[1] - big[0],
                     String(en.name || ''), en.color || '#e88295', placed, 9.4);
    }
    if (mine && mine.length) {
      big = biggestSeg(mine);
      if (big) {
        lh += pieLabel((big[0] + big[1]) / 2, big[1] - big[0], me.name || '내 시간', myColor, placed, 9.4);
      }
    }
    labels.innerHTML = lh;

    var sum = $('pickSum');
    if (sum) { sum.textContent = (s >= 0 && e >= 0) ? (toHM(s) + ' ~ ' + toHM(e)) : '-'; }
  }

  function renderPick(){
    renderDial();
    var start = $('startSel').value, end = $('endSel').value;
    var warn = $('rangeWarn');
    var btn = $('regBtn');
    var line = $('pickLine');
    btn.textContent = me.name ? (me.name + ' 님으로 등록') : '이름 정하고 등록';
    var msg = '';
    if (!start || !end || end <= start) {
      msg = '종료 시간이 시작 시간보다 빨라요.';
    } else {
      var c = conflictFor(start, end);
      if (c) {
        msg = (me.name && c.name === me.name)
          ? '이미 내 주차(' + c.start + '~' + c.end + ')가 있어 겹칩니다.'
          : '이미 ' + c.start + '~' + c.end + '(' + c.name + ') 예약이 있어 겹칩니다.';
      }
    }
    if (msg) {
      warn.textContent = msg;
      warn.hidden = false;
      btn.disabled = true;
    } else {
      warn.hidden = true;
      btn.disabled = false;
    }
    if (line) { line.classList.toggle('bad', !!msg); }
  }

  function rememberRange(){
    range.start = $('startSel').value;
    range.end = $('endSel').value;
  }

  /* 등록 직후: 그날 빈 2시간대로 자동 이동(겹침 경고가 띄지 않도록) */
  function shiftRange(end){
    if (!/^\d{2}:\d{2}$/.test(end)) { return; }
    var fr = freeSlot(entriesOf(selDate), toMin(end));
    if (!fr) { return; }
    range.start = fr[0];
    range.end = fr[1];
    $('startSel').value = range.start;
    $('endSel').value = range.end;
    syncDawn();
    renderDateSheet();
  }

  function register(){
    if (!me.name) { pending = register; openMe(); return; }
    var start = $('startSel').value, end = $('endSel').value;
    if (end <= start) { toast('종료 시간이 시작보다 빨라요.'); return; }
    var c = conflictFor(start, end);
    if (c) { toast('이미 ' + c.start + '~' + c.end + '(' + c.name + ') 예약이 있어 겹칩니다.'); return; }
    var date = selDate;
    var entry = { id: 'tmp' + Date.now(), name: me.name, color: me.color, d: date, start: start, end: end, note: me.note };
    var snapE = state.entries.slice(), snapL = state.logs.slice();
    state.entries = state.entries.concat([entry]);
    renderDateSheet(); renderCal();
    chain = chain.then(function(){
      return api({
        mode: 'parking_set', date: date, name: me.name, color: me.color,
        start: start, end: end, note: me.note, on: '1', by: me.name
      });
    }).then(function(d){
      applyState(d);
      saveCache(d);
        render();
      toast(start + '~' + end + ' 등록했어요.');
      shiftRange(end);
    }).catch(function(err){
      state.entries = snapE; state.logs = snapL;
      render();
      if (err && err.error === 'overlap' && err.conflict) {
        toast('이미 ' + err.conflict.start + '~' + err.conflict.end + '(' + err.conflict.name + ') 예약이 있어 겹칩니다.');
      } else if (err && err.error === 'overlap') {
        toast('이미 그 시간대에 예약이 있어 등록할 수 없어요.');
      } else {
        toast('등록하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
      }
      load();
    });
  }

  function removeEntry(id, name){
    if (!id) { return; }
    /* 내가 등록한 주차만 취소할 수 있다 */
    if (!me.name || name !== me.name) { toast('내가 등록한 주차만 취소할 수 있어요.'); return; }
    var snapE = state.entries.slice(), snapL = state.logs.slice();
    state.entries = state.entries.filter(function(e){ return e.id !== id; });
    renderDateSheet(); renderCal();
    chain = chain.then(function(){
      return api({ mode: 'parking_set', date: selDate, id: id, name: name, on: '0', by: me.name || '이름 미설정' });
    }).then(function(d){
      applyState(d);
      saveCache(d);
      render();
      toast('주차를 취소했어요.');
    }).catch(function(){
      state.entries = snapE; state.logs = snapL;
      render();
      toast('취소하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
      load();
    });
  }

  /* ---------- 공지·메모 ---------- */
  function fmtAt(at){
    var s = String(at || '');
    return s.length >= 16 ? s.slice(5, 10).replace('-', '/') + ' ' + s.slice(11, 16) : s;
  }

  function cleanNotice(v){
    return String(v || '').replace(/[\u200B\uFEFF\u200C\u200D]/g, '').trim();
  }

  function renderNotice(){
    var n = state.notice || { text: '', by: '', at: '' };
    var text = cleanNotice(n.text);
    var v = $('noticeView');
    if (text) {
      v.textContent = text;
      v.className = 'notice-view';
    } else {
      v.textContent = '공지나 메모를 남겨 보세요';
      v.className = 'notice-view none';
    }
    var meta = '';
    if (text && (n.by || n.at)) {
      meta = String(n.by || '') + (n.at ? ' · ' + fmtAt(n.at) + ' 수정' : '');
    }
    $('noticeMeta').textContent = meta;
  }

  function openNoticeEdit(){
    if (!noticeLoaded) {
      toast('공지를 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요.');
      loadNotice();
      return;
    }
    $('noticeText').value = cleanNotice(state.notice && state.notice.text);
    $('noticeBox').classList.add('editing');
    $('noticeForm').hidden = false;
    setTimeout(function(){ try { $('noticeText').focus(); } catch(e){} }, 60);
  }

  function closeNoticeEdit(){
    $('noticeBox').classList.remove('editing');
    $('noticeForm').hidden = true;
  }

  function saveNotice(){
    var text = ($('noticeText').value || '').replace(/\r\n/g, '\n').trim().slice(0, 500);
    if (!text) { toast('내용을 입력해 주세요.'); return; }
    var snap = state.notice;
    var go = function(){
      closeNoticeEdit();
      chain = chain.then(function(){
        return api({ mode: 'parking_notice_set', text: text, by: me.name });
      }).then(function(d){
        state.notice = d.notice || { text: text, by: me.name, at: '' };
        renderNotice();
      }).catch(function(){
        state.notice = snap;
        renderNotice();
        toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
      });
    };
    if (!me.name) { pending = go; openMe(); return; }
    go();
  }

  function loadNotice(){
    return apiRead({ mode: 'parking_notice_get' }).then(function(d){
      state.notice = d.notice || { text: '', by: '', at: '' };
      noticeLoaded = true;
      renderNotice();
    }).catch(function(){
      /* apiRead가 3회까지 재시도했으므로 더 돌지 않는다 (화면에 다시 돌아오면 새로 부른다) */
    });
  }

  /* ---------- 이벤트 ---------- */
  $('meBtn').addEventListener('click', openMe);
  $('mSave').addEventListener('click', saveMe);
  $('mName').addEventListener('keydown', function(e){ if (e.key === 'Enter') { saveMe(); } });

  $('mColors').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.sw') : null;
    if (!b) { return; }
    pickColor = b.getAttribute('data-c');
    renderColors();
  });

  $('noticeEditBtn').addEventListener('click', openNoticeEdit);
  $('noticeView').addEventListener('click', function(){
    if ($('noticeBox').classList.contains('editing')) { return; }
    openNoticeEdit();
  });
  $('noticeSave').addEventListener('click', saveNotice);
  $('noticeCancel').addEventListener('click', closeNoticeEdit);

  $('calGrid').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.cell') : null;
    if (!b) { return; }
    var date = b.getAttribute('data-date');
    if (!date) { return; }
    openDate(date);
  });

  $('prevBtn').addEventListener('click', function(){
    view.m--; if (view.m < 0) { view.m = 11; view.y--; }
    render();
  });
  $('nextBtn').addEventListener('click', function(){
    view.m++; if (view.m > 11) { view.m = 0; view.y++; }
    render();
  });
  $('todayBtn').addEventListener('click', function(){
    view = todayMonth();
    render();
  });

  $('startSel').addEventListener('change', function(){
    rememberRange();
    /* 시작 시간이 새벽이면 새벽 보기로, 낮이면 기본 보기로 자동 전환 */
    syncDawn();
    renderDateSheet();
  });
  $('endSel').addEventListener('change', function(){ rememberRange(); renderDateSheet(); });
  $('dawnBtn').addEventListener('click', function(){
    dawn = !dawn;
    renderDateSheet();
  });
  $('regBtn').addEventListener('click', register);

  $('dateList').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.del') : null;
    if (!b) { return; }
    removeEntry(b.getAttribute('data-del'), b.getAttribute('data-name'));
  });

  $('logToggle').addEventListener('click', function(){
    var card = $('logCard');
    var list = $('logList');
    var open = card.classList.toggle('open');
    list.hidden = !open;
  });

  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-close]') : null;
    if (!el) { return; }
    closeSheet(el.getAttribute('data-close'));
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') { return; }
    closeNoticeEdit();
    closeSheet('dateSheet'); closeSheet('meSheet');
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && loaded) { load(); loadNotice(); }
  });

  /* 시작 */
  loadMe();
  /* 서버 응답을 기다리지 않고 캐시가 있으면 바로 달력을 채운다 */
  var cached = readCache();
  applyState(cached || SEED);   /* 캐시가 없으면 함께 넣어 둔 스냅샷으로 즉시 그린다 */
  buildDial();
  buildTimeOptions();
  renderColors();
  render();
  renderNotice();
  load();
  loadNotice();
})();
</script>
