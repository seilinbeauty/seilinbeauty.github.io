<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 수강 관리 · 세이린뷰티</title>
<meta name="description" content="다이아 커뮤니티 원장님 본인 뷰티수강 등록 및 수정 페이지입니다.">
<meta name="theme-color" content="#fdf7f9">
<link rel="icon" href="dia-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="dia-apple-touch-icon.png">
<style>
/* 내 수강 관리 — 모바일 우선, 세이린 파스텔 핑크 (2026-11-24 커비) */
:root{--pk:#e1789a;--pk2:#d55576;--ln:#f0dbe2;--tx:#3c2b31;--sub:#a9808d;}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{background:#fdf7f9;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%;}
.mc-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;
  background:rgba(255,255,255,.97);border-bottom:1px solid var(--ln);backdrop-filter:blur(8px);}
.mc-back{flex:0 0 34px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:#b35172;font-size:22px;line-height:1;text-decoration:none;}
.mc-back:active{background:#fdeef3;}
.mc-hd{min-width:0;flex:1;}
.mc-t{font-size:14.5px;font-weight:900;letter-spacing:-.3px;}
.mc-s{font-size:10.5px;font-weight:700;color:var(--sub);margin-top:1px;}
.mc-go{padding:7px 12px;border-radius:999px;background:#fdeef3;border:1px solid #f0cdda;color:#b35172;font-size:11.5px;font-weight:800;text-decoration:none;white-space:nowrap;}
.mc-wrap{max-width:560px;margin:0 auto;padding:14px 12px 38px;}
.mc-banner{padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #f0d7e0;font-size:12px;line-height:1.55;color:#5a434b;margin-bottom:12px;}
.mc-banner strong{color:#c2456a;}
.mc-banner.is-new{background:#fff8fa;border-style:dashed;}
.mc-card{background:#fff;border:1px solid #f2e2e8;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(180,140,155,.06);}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:560px){.mc-grid{grid-template-columns:1fr;}}
.mc-field{display:flex;flex-direction:column;gap:4px;}
.mc-field.full{grid-column:1 / -1;}
.mc-lbl{font-size:11.5px;font-weight:800;color:#6e4e59;}
.mc-lbl small{font-weight:600;color:#a9808d;}
.mc-in,.mc-sel,.mc-ta{width:100%;border:1px solid #ecdce2;border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--tx);background:#fff;outline:none;}
.mc-in:focus,.mc-sel:focus,.mc-ta:focus{border-color:#e1789a;}
.mc-ta{min-height:76px;resize:vertical;line-height:1.5;}
.mc-bio{background:#fff9fb;border:1px dashed #edd3dc;border-radius:11px;padding:10px;margin-bottom:12px;}
.mc-bio-row{display:flex;gap:6px;align-items:center;margin-top:6px;}
.mc-bio-btn{flex:0 0 auto;padding:8px 12px;border-radius:9px;border:1px solid #e6b4c5;background:#fdeef3;color:#b35172;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
.mc-pin{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff8fa;border:1px solid #f0d7e0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.mc-pin input{width:120px;height:36px;border:1px solid #ecdce2;border-radius:9px;text-align:center;font-size:17px;letter-spacing:5px;font-family:inherit;-webkit-text-security:disc;}
.mc-acts{margin-top:14px;display:flex;gap:8px;align-items:center;}
.mc-save{flex:1;height:44px;border:0;border-radius:11px;background:#d55576;color:#fff;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;}
.mc-save:disabled{opacity:.55;cursor:default;}
.mc-hide{height:44px;padding:0 14px;border:1px solid #ecdce2;border-radius:11px;background:#fff;color:#9a858d;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.mc-msg{margin-top:10px;font-size:12px;font-weight:800;min-height:18px;text-align:center;}
.mc-msg.ok{color:#2f7d4c;}
.mc-msg.err{color:#d55576;}
.mc-empty{margin:40px 8px;padding:24px 16px;border-radius:14px;background:#fff;border:1px solid #f2e2e8;text-align:center;}
.mc-empty-t{font-size:15px;font-weight:900;margin-bottom:6px;}
.mc-empty-s{font-size:12.5px;color:#8c747d;line-height:1.6;margin-bottom:14px;}
.mc-empty-a{display:inline-block;padding:10px 18px;border-radius:999px;background:#e1789a;color:#fff;font-size:13px;font-weight:800;text-decoration:none;}
</style>
</head>
<body>
<header class="mc-top">
  <a class="mc-back" href="dia.html" aria-label="커뮤니티 홈으로">‹</a>
  <div class="mc-hd">
    <div class="mc-t">내 수강 관리</div>
    <div class="mc-s" id="mcWho">불러오는 중…</div>
  </div>
  <a class="mc-go" href="dia-course.html">뷰티수강 보기</a>
</header>

<main class="mc-wrap">
  <div class="mc-empty" id="mcNeedLogin" hidden>
    <div class="mc-empty-t">커뮤니티 홈에서 먼저 로그인해 주세요</div>
    <div class="mc-empty-s">내 이름으로 로그인해야 내 수강을 등록하거나 수정할 수 있습니다.</div>
    <a class="mc-empty-a" href="dia.html">커뮤니티 홈으로 가기</a>
  </div>

  <div id="mcFormWrap" hidden>
    <div class="mc-banner" id="mcBanner">수강 정보를 불러오고 있습니다…</div>

    <div class="mc-card">
      <div class="mc-bio">
        <div class="mc-lbl">✨ 인스타 프로필 붙여넣기 <small>(선택 — 넣으면 아래 칸을 자동으로 채워줘요)</small></div>
        <div class="mc-bio-row">
          <textarea class="mc-ta" id="fBio" style="min-height:48px;" placeholder="인스타그램 프로필 소개글이나 링크를 그대로 붙여넣어 보세요"></textarea>
          <button type="button" class="mc-bio-btn" id="fBioBtn">자동 채우기</button>
        </div>
      </div>

      <div class="mc-grid">
        <div class="mc-field">
          <label class="mc-lbl" for="fName">상호명 <small>(필수)</small></label>
          <input class="mc-in" id="fName" type="text" maxlength="60" placeholder="예: 세이린뷰티">
        </div>
        <div class="mc-field">
          <label class="mc-lbl" for="fInsta">인스타 아이디 <small>(@ 빼고)</small></label>
          <input class="mc-in" id="fInsta" type="text" maxlength="50" placeholder="예: seilin_beauty">
        </div>
        <div class="mc-field">
          <label class="mc-lbl" for="fRegion">지역</label>
          <input class="mc-in" id="fRegion" type="text" maxlength="30" placeholder="예: 서울 강서">
        </div>
        <div class="mc-field">
          <label class="mc-lbl" for="fCat">수강 분야</label>
          <select class="mc-sel" id="fCat">
            <option value="">선택해 주세요</option>
            <option value="속눈썹펌">속눈썹펌</option>
            <option value="속눈썹연장">속눈썹연장</option>
            <option value="속눈썹">속눈썹 (펌·연장)</option>
            <option value="네일">네일</option>
            <option value="반영구">반영구</option>
            <option value="SMP">SMP</option>
            <option value="왁싱">왁싱</option>
            <option value="피부">피부</option>
            <option value="토탈뷰티">토탈뷰티</option>
          </select>
        </div>
        <div class="mc-field full">
          <label class="mc-lbl" for="fIgUrl">인스타그램 주소</label>
          <input class="mc-in" id="fIgUrl" type="url" maxlength="180" placeholder="https://www.instagram.com/아이디/">
        </div>
        <div class="mc-field">
          <label class="mc-lbl" for="fNaver">네이버 지도 링크 <small>(선택)</small></label>
          <input class="mc-in" id="fNaver" type="url" maxlength="250" placeholder="https://naver.me/...">
        </div>
        <div class="mc-field">
          <label class="mc-lbl" for="fHome">홈페이지·문의 링크 <small>(선택)</small></label>
          <input class="mc-in" id="fHome" type="url" maxlength="250" placeholder="https://...">
        </div>
        <div class="mc-field full">
          <label class="mc-lbl" for="fBenefit">다이아 회원 단독 수강 혜택 <small>(있을 때만 적기)</small></label>
          <input class="mc-in" id="fBenefit" type="text" maxlength="160" placeholder="예: 수강료 10% 할인 또는 추가 1회 코칭">
        </div>
        <div class="mc-field full">
          <label class="mc-lbl" for="fIntro">수강 소개 문구</label>
          <textarea class="mc-ta" id="fIntro" maxlength="350" placeholder="원장님 수강만의 강점이나 커리큘럼을 간단히 적어 주세요."></textarea>
        </div>
      </div>

      <div class="mc-pin" id="mcPinBox" hidden>
        <span class="mc-lbl">🔒 저장 확인용 내 암호 4자리</span>
        <input id="fPin" type="tel" inputmode="numeric" maxlength="4" placeholder="····" autocomplete="off">
      </div>

      <div class="mc-acts">
        <button type="button" class="mc-hide" id="btnHide" hidden>내 수강 내리기</button>
        <button type="button" class="mc-save" id="btnSave">저장하고 바로 반영하기</button>
      </div>
      <div class="mc-msg" id="mcMsg"></div>
    </div>
  </div>
</main>

<script src="dia-pin.js?v=2"></script>
<script>
(function(){
  var BASE = 'https://firestore.googleapis.com/v1/projects/seilindia/databases/(default)/';
  var KEY = 'AIzaSyDQ1PusFvVlbgWyh0pU-2MoW7PzJZHNDKY';
  var EXEC = 'https://script.google.com/macros/s/AKfycbxLu7nD0RH1FkCKdmgQkP7AybLKit34KN9ISnuW_pHwYrLW7EaqsWddNWBSGWfJ0S-V5A/exec';
  var LG_KEY = 'dia_login_member';

  var $ = function(id){ return document.getElementById(id); };
  function safeId(x){ return String(x || '').trim().split('/').join('|'); }
  function norm(x){ return String(x || '').trim().replace(/^@/, '').toLowerCase(); }
  function idOnly(v){
    v = String(v || '').trim();
    var m = v.match(/instagram\.com\/([^\/?#]+)/i);
    if(m && m[1]) v = m[1];
    return v.replace(/^@/, '').replace(/[\/?#].*$/, '').trim();
  }
  function urlFix(u){
    u = String(u || '').trim();
    if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }
  function getMember(){
    var raw = '';
    try{ raw = localStorage.getItem(LG_KEY) || localStorage.getItem(LG_KEY + '_bak') || ''; }catch(e){}
    if(!raw) return null;
    try{
      var o = JSON.parse(raw);
      if(!o || !o.n) return null;
      return { nick: String(o.n).trim(), insta: norm(o.i || '') };
    }catch(e){ return null; }
  }
  function str(x){ return { stringValue: String(x || '') }; }
  function docName(coll, id){ return 'projects/seilindia/databases/(default)/documents/' + coll + '/' + String(id); }
  function decode(doc){
    if(!doc || !doc.fields) return null;
    var o = {}, f = doc.fields;
    for(var k in f){
      if(f[k].stringValue !== undefined) o[k] = f[k].stringValue;
    }
    return o;
  }
  function fbReq(path, body, method){
    var opt = { method: method || 'POST', cache: 'no-store' };
    if(body !== undefined){
      opt.headers = { 'Content-Type': 'application/json' };
      opt.body = JSON.stringify(body);
    }
    return fetch(BASE + path + (path.indexOf('?') > -1 ? '&' : '?') + 'key=' + KEY, opt).then(function(r){
      return r.text().then(function(t){
        var d = {}; try{ d = t ? JSON.parse(t) : {}; }catch(e){}
        if(r.ok) return d;
        var err = new Error('fb'); err.status = r.status; err.body = d; throw err;
      });
    });
  }
  function say(txt, ok){
    var el = $('mcMsg');
    if(!el) return;
    el.textContent = txt || '';
    el.className = 'mc-msg ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
  }
  function fillForm(it){
    if(!it) return;
    if(it.name) $('fName').value = it.name;
    if(it.insta) $('fInsta').value = idOnly(it.insta);
    if(it.region) $('fRegion').value = it.region;
    if(it.cat){
      var c = String(it.cat).split(',')[0].trim();
      var sel = $('fCat');
      for(var i = 0; i < sel.options.length; i++){
        if(sel.options[i].value === c){ sel.value = c; break; }
      }
    }
    if(it.insta_url) $('fIgUrl').value = it.insta_url;
    else if($('fInsta').value) $('fIgUrl').value = 'https://www.instagram.com/' + $('fInsta').value + '/';
    if(it.naver_url) $('fNaver').value = it.naver_url;
    if(it.home_url) $('fHome').value = it.home_url;
    if(it.benefit) $('fBenefit').value = it.benefit;
    if(it.intro && it.intro !== '__DELETED__') $('fIntro').value = it.intro;
  }

  function matchItem(it, me){
    var keys = [norm(me.nick), norm(me.insta)].filter(Boolean);
    var cands = [norm(it.insta), norm(it.name), norm(it.shop)].filter(Boolean);
    for(var i = 0; i < keys.length; i++){
      if(cands.indexOf(keys[i]) > -1) return true;
    }
    return false;
  }

  function loadFromStaticCourse(me){
    return fetch('dia-course.html?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var cards = doc.querySelectorAll('.crs-card');
        var keys = [norm(me.nick), norm(me.insta)].filter(Boolean);
        for(var i = 0; i < cards.length; i++){
          var c = cards[i];
          var nick = (c.querySelector('.crs-nick') && c.querySelector('.crs-nick').textContent || '').trim();
          var dNick = c.getAttribute('data-nick') || '';
          var igA = c.querySelector('a[data-insta], .crs-act-ig, .crs-ig');
          var ig = igA ? (igA.getAttribute('data-insta') || idOnly(igA.getAttribute('href'))) : '';
          var cands = [norm(nick), norm(dNick), norm(ig)].filter(Boolean);
          var hit = keys.some(function(k){ return cands.indexOf(k) > -1; });
          if(!hit) continue;
          var region = c.getAttribute('data-region') || '';
          var tagsTxt = (c.querySelector('.crs-tags') && c.querySelector('.crs-tags').textContent || '').trim();
          if(tagsTxt && tagsTxt.indexOf('·') > -1) region = tagsTxt.split('·')[0].trim();
          var cat = (c.getAttribute('data-cats') || '').split(',')[0].trim();
          var naverEl = c.querySelector('.crs-act-map');
          var homeEl = c.querySelector('.crs-act-home');
          var benEl = c.querySelector('.crs-benefit-txt');
          var courseEl = c.querySelector('.crs-course');
          var intro = '';
          if(courseEl){
            var clone = courseEl.cloneNode(true);
            var kd = clone.querySelector('.crs-kind'); if(kd) kd.remove();
            intro = (clone.textContent || '').trim();
          }
          return {
            name: nick || dNick,
            insta: ig,
            region: region,
            cat: cat,
            insta_url: igA ? igA.getAttribute('href') : '',
            naver_url: naverEl ? naverEl.getAttribute('href') : '',
            home_url: homeEl ? homeEl.getAttribute('href') : '',
            benefit: benEl ? benEl.textContent.trim() : '',
            intro: intro
          };
        }
        return null;
      }).catch(function(){ return null; });
  }

  var me = getMember();
  if(!me){
    $('mcWho').textContent = '로그인 필요';
    $('mcNeedLogin').hidden = false;
    return;
  }

  $('mcWho').textContent = me.nick + (me.insta ? ' (@' + me.insta + ')' : '');
  $('mcFormWrap').hidden = false;

  var rememberedPin = (window.DiaPin && window.DiaPin.remembered(me.nick)) || '';
  if(!rememberedPin){ $('mcPinBox').hidden = false; }

  var docId = safeId(norm(me.insta || me.nick));
  var foundAny = false;

  // 1) 파이어스토어 courses -> 2) 구글 시트 course_list -> 3) dia-course.html 정적 카드
  Promise.all([
    fbReq('documents/courses?pageSize=100', undefined, 'GET').then(function(d){
      return (d && d.documents ? d.documents : []).map(decode).filter(Boolean);
    }).catch(function(){ return []; }),
    fbReq('documents/course_requests/' + encodeURIComponent(docId), undefined, 'GET').then(function(d){
      return decode(d);
    }).catch(function(){ return null; }),
    fetch(EXEC + '?mode=course_list&_=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); })
      .then(function(d){ return (d && d.ok && d.items) ? d.items : []; }).catch(function(){ return []; }),
    loadFromStaticCourse(me)
  ]).then(function(res){
    var fbRows = res[0], reqDoc = res[1], sheetRows = res[2], staticItem = res[3];
    var fbHit = fbRows.filter(function(it){ return it.id === docId || matchItem(it, me); })[0] || null;
    var shHit = sheetRows.filter(function(it){ return matchItem(it, me); })[0] || null;
    var base = fbHit || shHit || staticItem || null;
    if(base && base.intro !== '__DELETED__'){
      foundAny = true;
    }

    var showData = (reqDoc && reqDoc.status === 'pending') ? reqDoc : base;
    if(showData) fillForm(showData);
    if(!$('fName').value) $('fName').value = me.nick;
    if(!$('fInsta').value && me.insta) $('fInsta').value = me.insta;
    if($('fInsta').value && !$('fIgUrl').value) $('fIgUrl').value = 'https://www.instagram.com/' + $('fInsta').value + '/';

    var bn = $('mcBanner');
    if(reqDoc && reqDoc.status === 'pending'){
      bn.className = 'mc-banner is-new';
      bn.innerHTML = '<strong>⏳ 현재 검토 중입니다.</strong> 운영자 승인 후 뷰티수강 페이지에 반영됩니다. 내용을 바꿔 다시 보낼 수도 있어요.';
      $('btnHide').hidden = !foundAny;
      $('btnSave').textContent = '검토 요청 다시 보내기';
    } else if(reqDoc && reqDoc.status === 'rejected'){
      bn.className = 'mc-banner is-new';
      bn.innerHTML = '<strong>이전 요청이 반려되었습니다.</strong> 내용을 수정한 뒤 다시 검토 요청을 보내 주세요.';
      $('btnHide').hidden = !foundAny;
      $('btnSave').textContent = foundAny ? '수정 검토 요청 보내기' : '신규 등록 검토 요청 보내기';
    } else if(foundAny){
      bn.className = 'mc-banner';
      bn.innerHTML = '<strong>현재 올라가 있는 내 수강</strong> 정보입니다. 수정 후 요청을 보내면 검토 승인 뒤 반영됩니다.';
      $('btnHide').hidden = false;
      $('btnSave').textContent = '수정 검토 요청 보내기';
    } else {
      bn.className = 'mc-banner is-new';
      bn.innerHTML = '<strong>아직 뷰티수강에 올라가 있지 않습니다.</strong> 내용을 입력해 등록 요청을 보내면 검토 승인 후 올라갑니다.';
      $('btnHide').hidden = true;
      $('btnSave').textContent = '신규 등록 검토 요청 보내기';
    }
  });

  // 자동 채우기
  function parseBio(raw){
    var text = String(raw || '').trim();
    if(!text) return;
    var urls = text.match(/https?:\/\/[^\s<>"')]+|(?:www\.|instagram\.com|map\.naver\.com|naver\.me|litt\.ly|linktr\.ee|pf\.kakao\.com)\/[^\s<>"')]+/gi) || [];
    urls.forEach(function(u){
      var full = urlFix(u), low = full.toLowerCase();
      if(low.indexOf('instagram.com/') >= 0){
        var id = idOnly(full);
        if(id){
          if(!$('fInsta').value.trim()) $('fInsta').value = id;
          if(!$('fIgUrl').value.trim()) $('fIgUrl').value = 'https://www.instagram.com/' + id + '/';
        }
      } else if(low.indexOf('naver.com') >= 0 || low.indexOf('naver.me') >= 0){
        if(!$('fNaver').value.trim()) $('fNaver').value = full;
      } else {
        if(!$('fHome').value.trim()) $('fHome').value = full;
      }
    });
    var atM = text.match(/@([a-zA-Z0-9._]{2,30})/);
    if(atM && !$('fInsta').value.trim()){
      $('fInsta').value = atM[1];
      if(!$('fIgUrl').value.trim()) $('fIgUrl').value = 'https://www.instagram.com/' + atM[1] + '/';
    }
    var lines = text.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(function(s){
      return s && !/^https?:\/\//i.test(s) && !/^@[a-zA-Z0-9._]+$/.test(s);
    });
    if(lines.length && !$('fIntro').value.trim()){
      $('fIntro').value = lines.join(' · ').slice(0, 220);
    }
    say('자동으로 채웠습니다. 빠진 부분만 확인해 주세요.', true);
  }
  $('fBioBtn').addEventListener('click', function(){ parseBio($('fBio').value); });
  $('fBio').addEventListener('paste', function(){ setTimeout(function(){ parseBio($('fBio').value); }, 30); });

  $('fInsta').addEventListener('blur', function(){
    var id = idOnly($('fInsta').value);
    if(id){ $('fInsta').value = id; if(!$('fIgUrl').value.trim()) $('fIgUrl').value = 'https://www.instagram.com/' + id + '/'; }
  });

  function saveCourse(isHide){
    var name = $('fName').value.trim();
    var insta = idOnly($('fInsta').value);
    if(!isHide && !name && !insta){ say('상호명이나 인스타 아이디를 넣어 주세요.', false); return; }

    var pin = rememberedPin || $('fPin').value.trim();
    if(!/^[0-9]{4}$/.test(pin)){
      $('mcPinBox').hidden = false;
      $('fPin').focus();
      say('저장하려면 내 암호 숫자 4자리를 넣어 주세요.', false);
      return;
    }

    $('btnSave').disabled = true;
    $('btnHide').disabled = true;
    say(isHide ? '내리는 중…' : '저장하는 중…', true);

    var sid = safeId(me.nick);
    function sendCourseReq(){
      var chkId = 'crs_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      var fieldsObj = {
        id: str(docId),
        shop: str(me.nick),
        status: str('pending'),
        action: str(isHide ? 'hide' : 'save'),
        name: str(name || me.nick),
        insta: str(insta),
        region: str($('fRegion').value.trim()),
        cat: str($('fCat').value),
        insta_url: str(urlFix($('fIgUrl').value)),
        naver_url: str(urlFix($('fNaver').value)),
        home_url: str(urlFix($('fHome').value)),
        benefit: str($('fBenefit').value.trim()),
        intro: str(isHide ? '__DELETED__' : $('fIntro').value.trim()),
        chk: str(chkId)
      };
      return fbReq('documents:commit', {
        writes: [
          {
            update: {
              name: docName('checks', chkId),
              fields: { op: str('course'), id: str(docId), shop: str(me.nick), pin: str(pin) }
            },
            currentDocument: { exists: false }
          },
          {
            update: { name: docName('course_requests', docId), fields: fieldsObj },
            updateTransforms: [{ fieldPath: 'updatedAt', setToServerValue: 'REQUEST_TIME' }]
          }
        ]
      }).then(function(){
        fbReq('documents/checks/' + encodeURIComponent(chkId), undefined, 'DELETE').catch(function(){});
      });
    }

    function ensurePinDoc(){
      return fbReq('documents:commit', {
        writes: [{
          update: { name: docName('pins', sid), fields: { pin: str(pin) } },
          currentDocument: { exists: false }
        }]
      }).catch(function(e){
        if(e && e.status === 409) return true;
        throw e;
      });
    }

    var verify = window.DiaPin ? window.DiaPin.check(me.nick, pin) : Promise.resolve({ ok: true });
    verify.then(function(res){
      if(!res || !res.ok){
        if(res && res.reason === '틀림') throw { status: 403 };
        throw new Error('auth_err');
      }
      return sendCourseReq().catch(function(e){
        if(e && e.status === 403){
          return ensurePinDoc().then(function(){ return sendCourseReq(); });
        }
        throw e;
      });
    }).then(function(){
      if(window.DiaPin) window.DiaPin.remember(me.nick, pin);
      rememberedPin = pin;
      $('mcPinBox').hidden = true;
      $('btnSave').disabled = false;
      $('btnHide').disabled = false;
      var bn = $('mcBanner');
      bn.className = 'mc-banner is-new';
      bn.innerHTML = '<strong>⏳ 현재 검토 중입니다.</strong> 운영자 승인 후 뷰티수강 페이지에 반영됩니다.';
      $('btnSave').textContent = '검토 요청 다시 보내기';
      say(isHide ? '내리기 요청을 보냈습니다. 검토 승인 후 반영됩니다.' : '검토 요청을 보냈습니다! 승인 후 뷰티수강에 반영됩니다.', true);
    }).catch(function(e){
      $('btnSave').disabled = false;
      $('btnHide').disabled = false;
      if(e && e.status === 403){
        rememberedPin = '';
        if(window.DiaPin) window.DiaPin.forget(me.nick);
        $('mcPinBox').hidden = false;
        say('내 암호 4자리가 맞지 않습니다. 다시 확인해 주세요.', false);
      } else {
        say('저장에 실패했습니다. 잠시 뒤 다시 눌러 주세요.', false);
      }
    });
  }

  $('btnSave').addEventListener('click', function(){ saveCourse(false); });
  $('btnHide').addEventListener('click', function(){
    if(window.confirm('뷰티수강 페이지에서 내 카드를 내릴까요? 언제든 다시 등록할 수 있습니다.')) saveCourse(true);
  });
})();
</script>
</body>
</html>
