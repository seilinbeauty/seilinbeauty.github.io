<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뷰티수강 채팅 · 세이린뷰티</title>
<meta name="description" content="세이린뷰티 다이아 커뮤니티 수강 문의 채팅입니다. 원장님 카드에서 바로 1:1로 문의할 수 있습니다.">
<meta name="theme-color" content="#fdf7f9">
<link rel="icon" href="dia-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="dia-apple-touch-icon.png">
<style>
/* 뷰티수강 채팅 — 모바일 우선(390px), 세이린 파스텔 핑크 (2026-11-24 커비) */
:root{--pk:#e1789a;--pk2:#d55576;--ln:#f0dbe2;--tx:#3c2b31;--sub:#a9808d;}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{background:#fdf7f9;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%;}

/* 상단 머리 */
.ch-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;
  background:rgba(255,255,255,.97);border-bottom:1px solid var(--ln);backdrop-filter:blur(8px);}
.ch-back{flex:0 0 34px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:#b35172;font-size:22px;line-height:1;text-decoration:none;}
.ch-back:active{background:#fdeef3;}
.ch-hd{min-width:0;flex:1;}
.ch-t{font-size:14.5px;font-weight:900;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-s{font-size:10.5px;font-weight:700;color:var(--sub);margin-top:1px;}

/* 목록 */
.ch-main{padding:10px 10px 0;}
.ch-list{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;}
.ch-item{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid #f3e4ea;border-radius:12px;
  background:#fff;text-align:left;font-family:inherit;color:inherit;cursor:pointer;}
.ch-item:active{background:#fdf4f7;}
.ch-av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f8e4eb,#f2d1dc);
  color:#b35172;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.ch-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.ch-who{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-last{font-size:11.5px;font-weight:600;color:#9a858d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.ch-time{font-size:10px;font-weight:700;color:#bfa7b1;}
.ch-n{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pk);color:#fff;
  font-size:10.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;}

/* 대화방 */
#chRoom{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:#fdf7f9;}
.ch-msgs{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 6px;}
.ch-m{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 9px;}
.ch-m.my{align-items:flex-end;}
.ch-b{max-width:78%;padding:9px 12px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid #f3e4ea;
  font-size:13px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
.ch-m.my .ch-b{background:#fbd9e4;border-color:#f6c6d6;border-radius:14px 14px 4px 14px;color:#5a2e3d;}
.ch-tm{margin-top:3px;font-size:9.5px;font-weight:700;color:#bfa7b1;}
.ch-day{text-align:center;margin:8px 0 12px;font-size:10.5px;font-weight:800;color:#b9a9af;}
.ch-tip{margin:20px 4px;padding:16px;border-radius:12px;border:1px dashed #f0cdda;background:#fff;
  text-align:center;font-size:12px;color:#a9808d;line-height:1.6;word-break:keep-all;}
.ch-empty{margin:22px 4px;padding:22px 16px;border-radius:14px;border:1px dashed #f0cdda;background:#fff;text-align:center;}
.ch-empty-t{font-size:13px;font-weight:800;color:#4a353c;}
.ch-empty-s{margin-top:6px;font-size:11.5px;font-weight:600;color:#a9808d;line-height:1.6;word-break:keep-all;}
.ch-empty-b{display:inline-block;margin-top:12px;padding:9px 16px;border-radius:999px;background:var(--pk);
  color:#fff;font-size:12.5px;font-weight:800;text-decoration:none;}
.ch-load{padding:26px 0;text-align:center;font-size:12px;color:#bfa7b1;}

/* 입력줄 */
.ch-form{flex:0 0 auto;display:flex;align-items:flex-end;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:#fff;border-top:1px solid var(--ln);}
.ch-form textarea{flex:1 1 auto;min-width:0;min-height:38px;max-height:96px;padding:9px 12px;border:1px solid #ecdce2;
  border-radius:12px;background:#fdfafb;font-family:inherit;font-size:13px;line-height:1.4;color:var(--tx);
  resize:none;outline:none;}
.ch-form textarea:focus{border-color:#e6a6bb;background:#fff;}
.ch-form button{flex:0 0 auto;height:38px;padding:0 15px;border:0;border-radius:12px;background:var(--pk);
  color:#fff;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;}
.ch-form button:active{background:var(--pk2);}

/* 안내 알림 (새 팝업 대신 화면 아래 짧은 줄) */
.ch-toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);max-width:86%;padding:10px 16px;
  border-radius:999px;background:rgba(60,43,49,.92);color:#fff;font-size:12px;font-weight:700;z-index:50;text-align:center;}

@media (min-width:700px){
  .ch-main{max-width:560px;margin:0 auto;}
  #chRoom{left:50%;right:auto;width:560px;transform:translateX(-50%);border-left:1px solid var(--ln);border-right:1px solid var(--ln);}
  .ch-b{font-size:13.5px;}
}
</style>
</head>
<body>

<header class="ch-top">
  <a class="ch-back" id="chBack" href="dia-course.html" aria-label="뒤로 가기">‹</a>
  <div class="ch-hd">
    <div class="ch-t" id="chTitle">뷰티수강 채팅</div>
    <div class="ch-s" id="chSub">내 채팅</div>
  </div>
</header>

<main class="ch-main">
  <div class="ch-list" id="chList"></div>
  <div id="chRoom" hidden>
    <div class="ch-msgs" id="chMsgs"></div>
    <form class="ch-form" id="chForm" autocomplete="off">
      <textarea id="chInput" rows="1" maxlength="300" placeholder="메시지를 입력하세요" aria-label="메시지"></textarea>
      <button type="submit">보내기</button>
    </form>
  </div>
</main>

<div class="ch-toast" id="chToast" hidden></div>

<script src="dia-chat.js?v=9" defer></script>
</body>
</html>
