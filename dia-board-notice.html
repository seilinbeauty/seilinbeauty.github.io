  <style>
    :root {
      /* Bright, Trendy & Clean Luxury Pink Palette */
      --pink-main: #e88295;
      --pink-deep: #be465e;
      --pink-darker: #9e3348;
      --pink-light: #fff0f3;
      --pink-subtle: #fcf4f6;
      --pink-soft: rgba(232, 130, 149, 0.12);
      --pink-border: rgba(232, 130, 149, 0.22);
      --pink-gradient: #e88295;
      --pink-glow: 0 8px 24px rgba(232, 130, 149, 0.22);

      /* Bright Clean Canvas */
      --bg-page: #fbf8f9;
      --bg-card: #ffffff;
      --bg-card-subtle: #fef8fa;
      --text-main: #242229;
      --text-muted: #6a6674;
      --text-dim: #9894a2;
      --border-color: rgba(232, 130, 149, 0.18);
      --shadow-card: 0 6px 24px rgba(210, 140, 155, 0.08);
      --shadow-hover: 0 12px 32px rgba(210, 140, 155, 0.16);

      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      --font-en: 'Montserrat', sans-serif;

      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 26px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      word-break: keep-all;
      overflow-wrap: break-word;
      padding-bottom: 90px; /* Space for mobile floating bar */
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top Navigation */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 66px;
      background: rgba(251, 248, 249, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-logo {
      font-family: var(--font-sans);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--pink-deep);
      white-space: nowrap;
    }

    .nav-links {
      display: none;
      align-items: center;
      gap: 26px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .nav-links a:hover {
      color: var(--pink-deep);
    }

    .nav-mobile-links {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
      margin-right: 8px;
      flex: 1 1 auto;
      min-width: 0;
      justify-content: flex-end;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-mobile-links::-webkit-scrollbar {
      display: none;
    }

    .nav-mobile-link {
      flex: 0 0 auto;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--pink-deep);
      border: 1px solid var(--pink-border);
      border-radius: 13px;
      padding: 5px 8px;
      white-space: nowrap;
    }

    .nav-mobile-link.nav-dia-m {
      color: #fff;
      background: var(--pink-deep);
      border-color: var(--pink-deep);
    }

    .nav-btn {
      padding: 9px 18px;
      background: var(--pink-gradient);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      border-radius: 20px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(232, 130, 149, 0.32);
    }

    .nav-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(232, 130, 149, 0.45);
    }

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Hero Section - 창업/수강 중심 */
    .hero {
      position: relative;
      padding: 125px 0 65px;
      text-align: center;
      overflow: hidden;
    }

    .hero-glow {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(232, 130, 149, 0.22) 0%, rgba(251, 248, 249, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      background: var(--pink-light);
      border: 1px solid var(--pink-border);
      border-radius: 30px;
      font-size: 12px;
      color: var(--pink-deep);
      font-weight: 800;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
      color: var(--text-main);
      position: relative;
      z-index: 1;
    }

    .pink-text {
      color: var(--pink-main);
    }

    .hero-desc {
      font-size: 15px;
      color: #4a4653;
      font-weight: 600;
      max-width: 620px;
      margin: 0 auto 36px;
      word-break: keep-all;
      position: relative;
      z-index: 1;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
      margin: 0 auto 36px;
      position: relative;
      z-index: 1;
    }

    .btn-hero-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      background: #FEE500;
      color: #191919;
      font-size: 15.5px;
      font-weight: 800;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 18px rgba(254, 229, 0, 0.4);
      transition: all 0.25s ease;
    }

    .btn-hero-primary:active {
      transform: scale(0.98);
    }

    .btn-hero-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      background: #ffffff;
      border: 1.5px solid var(--pink-border);
      color: var(--pink-deep);
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .btn-hero-secondary:hover {
      background: var(--pink-light);
    }

    /* Trust Stats */
    .trust-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      margin-top: 15px;
      position: relative;
      z-index: 1;
    }

    .stat-item {
      text-align: center;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-card);
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-num {
      font-family: var(--font-en);
      font-size: 22px;
      font-weight: 800;
      color: var(--pink-deep);
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
      word-break: keep-all;
    }

    @media (max-width: 480px) {
      .stat-item {
        padding: 14px 6px;
      }
      .stat-num {
        font-size: 17px;
      }
      .stat-label {
        font-size: 10.5px;
      }
    }

    /* Sections */
    .section {
      padding: 70px 0;
    }

    .section-tag {
      font-family: var(--font-en);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--pink-deep);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
      text-align: center;
    }

    .section-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      line-height: 1.35;
      color: var(--text-main);
      text-align: center;
    }

    .section-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      word-break: keep-all;
      text-align: center;
    }

    /* Why Seilin Academy (4 Cards) */
    .why-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    .why-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-card);
      transition: all 0.3s ease;
    }

    .why-card:hover {
      border-color: var(--pink-main);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .why-num {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      color: rgba(232, 130, 149, 0.4);
      margin-bottom: 10px;
    }

    .why-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .why-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      word-break: keep-all;
    }

    /* Courses Curriculum Lineup (핵심 수강 코스) */
    .course-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .course-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 26px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .course-card.featured {
      border: 2px solid var(--pink-main);
      background: linear-gradient(180deg, #fff7f9 0%, #ffffff 100%);
    }

    .course-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 4px 12px;
      background: var(--pink-gradient);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      border-radius: 12px;
    }

    .course-target {
      font-size: 12px;
      color: var(--pink-deep);
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .course-card.featured .course-badge {
      position: static;
      display: inline-block;
      align-self: flex-start;
      margin-bottom: 10px;
    }

    .course-card.featured .course-target {
      padding-right: 0;
    }

    .course-title {
      font-size: 21px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .course-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    .course-points {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
      padding: 14px;
      background: #fdf5f7;
      border-radius: var(--radius-sm);
    }

    .c-point {
      font-size: 12.5px;
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .c-point-dot {
      color: var(--pink-main);
      font-weight: 800;
    }

    .partner-points {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .p-point {
      text-align: center;
    }

    .p-name {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--pink-deep);
      line-height: 1.5;
      word-break: keep-all;
    }

    .p-desc {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-top: 2px;
      word-break: keep-all;
    }

    .course-out {
      margin: -6px 0 16px;
      padding: 10px 12px;
      background: var(--bg-card-subtle);
      border: 1px dashed var(--pink-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.5;
      word-break: keep-all;
    }

    .course-out span {
      display: block;
      font-family: var(--font-en);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--pink-deep);
      margin-bottom: 3px;
    }

    /* 파트너스 카드 텍스트 가운데 정렬 (도현 님 지시 2026-11-16) */
    #partners .course-target,
    #partners .course-title,
    #partners .course-desc,
    #partners .course-out {
      text-align: center;
    }

    #partners .course-target {
      justify-content: center;
    }

    .course-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px 20px;
      background: var(--pink-gradient);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(232, 130, 149, 0.3);
    }

    .course-btn:hover {
      box-shadow: 0 6px 20px rgba(232, 130, 149, 0.45);
    }

    /* Portfolio / Practice Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .gallery-item {
      position: relative;
      border-radius: var(--radius-sm);
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: #f3edf0;
      box-shadow: var(--shadow-card);
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    .gallery-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 10px 8px;
      background: linear-gradient(180deg, transparent 0%, rgba(36, 34, 41, 0.88) 100%);
      font-size: 11.5px;
      color: #fff;
      font-weight: 600;
    }

    /* Student Reviews */
    .review-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 26px;
    }

    .review-item {
      position: relative;
      padding-bottom: 6px;
      padding-right: 6px;
    }

    .review-item.pc-only {
      display: none;
    }

    .paper-layer {
      position: absolute;
      inset: 0;
      background: #ffffff;
      border: 1px solid #ecd7de;
      border-radius: var(--radius-md);
      box-shadow: 0 3px 8px rgba(190, 130, 150, 0.10);
    }

    .paper-layer.pl1 {
      transform: translate(4px, 4px) rotate(0.7deg);
    }

    .paper-layer.pl2 {
      transform: translate(8px, 8px) rotate(1.4deg);
      border-color: #f3e4e9;
      box-shadow: 0 3px 8px rgba(190, 130, 150, 0.06);
    }

    .review-card {
      position: relative;
      z-index: 2;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    .review-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .review-tag {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .review-source {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--pink-deep);
      background: var(--pink-light);
      border: 1px solid var(--pink-border);
      border-radius: 999px;
      padding: 3px 9px;
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    .review-note {
      font-size: 11.5px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .review-stars {
      color: var(--pink-deep);
      font-size: 14px;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .review-text {
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.65;
      margin-bottom: 14px;
      word-break: keep-all;
    }

    .review-author {
      font-size: 12px;
      color: var(--pink-deep);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .review-dots-wrap {
      text-align: center;
      margin-top: 22px;
    }

    .review-dots {
      font-size: 22px;
      letter-spacing: 10px;
      color: var(--pink-deep);
      line-height: 1;
    }

    /* Inquire Application Box */
    .inquire-box {
      background: linear-gradient(135deg, #fff2f5 0%, #fef8fa 100%);
      border: 1.5px solid var(--pink-border);
      border-radius: var(--radius-lg);
      padding: 34px 24px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    .inquire-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .inquire-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .inquire-format {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: left;
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 auto 24px;
      max-width: 480px;
    }

    /* Salons Secondary Section */
    .salon-section {
      background: #f7f1f3;
      padding: 60px 0;
      border-top: 1px solid var(--border-color);
    }

    .branch-card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .s-branch-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .s-branch-title {

  }

  else init();
})();
