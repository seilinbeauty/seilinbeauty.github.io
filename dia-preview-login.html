<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>로그인</title>
<link href="https://fonts.googleapis.com/css?family=Nanum+Gothic:400,700,800" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700" rel="stylesheet">
<style>
  :root{--cream:#fbf8f6;--blush:#f5e5e2;--ink:#2f2a2b;--ink-soft:#6f6668;--ink-mute:#a79b9e;--line:#eee6e3;--accent:#c9707f;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);
    font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  .bar{background:var(--blush);height:45px;}
  .bar-in{max-width:1100px;margin:0 auto;padding:0 20px;height:45px;
    display:flex;align-items:center;justify-content:space-between;}
  .bar ul{list-style:none;margin:0;padding:0;display:flex;align-items:center;height:45px;}
  .bar a{font-size:11.2px;letter-spacing:.9px;text-transform:uppercase;display:flex;align-items:center;height:45px;color:#323232;}
  .bar .l li{margin-right:26px;}
  .bar .r li{margin-left:24px;}
  .logo{font-size:15px;font-weight:700;letter-spacing:.5px;}

  .box{max-width:340px;margin:0 auto;padding:78px 20px 100px;}
  .eyebrow{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--ink-mute);text-align:center;}
  h1{margin:12px 0 34px;text-align:center;font-weight:400;font-size:22px;letter-spacing:-.4px;}

  .field{margin-bottom:10px;}
  input{width:100%;height:44px;padding:0 14px;background:#fff;border:1px solid var(--line);
    border-radius:2px;font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;font-size:13px;color:var(--ink);outline:none;}
  input:focus{border-color:#dccbc9;}
  input::placeholder{color:#c3b8ba;}

  .hint{margin:8px 2px 0;font-size:10.5px;letter-spacing:.02em;color:#a79b9e;}
  .btn{width:100%;height:44px;margin-top:14px;background:#2f2a2b;color:#fff;border:0;
    border-radius:2px;font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;cursor:pointer;}
  .btn:hover{background:#4a4244;}

  .links{display:flex;justify-content:center;gap:18px;margin-top:20px;
    font-size:11px;color:var(--ink-soft);letter-spacing:.02em;}
  .links a:hover{color:var(--accent);}
  .links span{color:#ddd3d4;}

  .join{margin-top:38px;padding-top:24px;border-top:1px solid var(--line);text-align:center;}
  .join p{margin:0 0 10px;font-size:11px;color:var(--ink-mute);letter-spacing:.06em;}
  .join a{display:inline-flex;align-items:center;justify-content:center;width:100%;height:42px;
    border:1px solid #dccbc9;border-radius:2px;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:#3a3234;background:#fff;}
  .join a:hover{background:var(--blush);}

  .tag{position:fixed;right:14px;bottom:12px;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:#c3b8ba;}

  #door{position:fixed;inset:0;background:var(--cream);z-index:99;display:flex;
    align-items:center;justify-content:center;padding:20px;}
  #door .card{max-width:280px;width:100%;text-align:center;}
  #door h2{font-size:13px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;margin:0 0 12px;}
  #door p{font-size:11.5px;line-height:1.9;color:var(--ink-soft);margin:0 0 18px;}
  #door input{text-align:center;letter-spacing:.4em;}
  #door button{margin-top:10px;width:100%;height:40px;background:#2f2a2b;color:#fff;border:0;
    border-radius:2px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
  #door .err{margin-top:10px;font-size:11px;color:#c06070;min-height:14px;}
  body:not(.locked) #door{display:none;}


/* 간편 로그인 */
.sns{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);}
.sns-t{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px;text-align:center;}
.sns-b{display:flex;flex-direction:column;gap:8px;}
.sns-b a{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:2px;
  font-size:12px;font-weight:700;border:1px solid transparent;}
.sns-b .naver{background:#03c75a;color:#fff;}
.sns-b .kakao{background:#fee500;color:#3c1e1e;}
.sns-b .google{background:#fff;color:#3c4043;border-color:#dadce0;}
.sns-b svg{width:15px;height:15px;flex-shrink:0;}

/* 간편 로그인 후 인스타그램 아이디 필수 */
#igStep{position:fixed;inset:0;background:rgba(47,42,43,.42);z-index:120;display:none;align-items:center;justify-content:center;padding:20px;}
#igStep.on{display:flex;}
#igStep .card{background:#fff;border-radius:3px;max-width:320px;width:100%;padding:28px 22px 22px;text-align:center;}
#igStep h2{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.2px;}
#igStep p{margin:0 0 16px;font-size:11.5px;line-height:1.9;color:var(--ink-soft);}
#igStep input{text-align:center;}
#igStep .row{display:flex;gap:8px;margin-top:14px;}
#igStep .row button{flex:1;height:42px;border-radius:2px;font-family:inherit;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;}
#igGo{background:#2f2a2b;color:#fff;border:0;}
#igGo:disabled{background:#d6cfd0;cursor:not-allowed;}
#igCancel{background:#fff;color:#6f6668;border:1px solid var(--line);}
#igStep .err{margin-top:8px;font-size:11px;color:#c06070;min-height:14px;}
.field{position:relative;}
.ig-sug{position:absolute;left:calc(100% + 10px);top:0;width:300px;background:#fff;border:1px solid var(--line);
  border-radius:2px;box-shadow:0 12px 30px rgba(47,42,43,.10);max-height:320px;overflow:auto;z-index:40;display:none;}
.ig-sug button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 13px;
  border:0;border-top:1px solid #f4eded;background:#fff;font-family:inherit;text-align:left;cursor:pointer;}
.ig-sug button:first-child{border-top:0;}
.ig-sug button:hover{background:#fdf7f6;}
.ig-sug .nm{font-size:12.5px;font-weight:700;color:#2f2a2b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ig-sug .ig{font-size:11px;color:#8d8385;flex-shrink:0;}
@media (max-width:880px){.ig-sug{left:0;right:0;top:calc(100% + 6px);width:auto;}}
.saveid{display:flex;align-items:center;gap:7px;margin:2px 0 10px;font-size:11.5px;color:#8d8385;cursor:pointer;}
.saveid input{width:14px;height:14px;accent-color:#d55576;margin:0;}
</style>
</head>
<body>


<header class="bar">
  <div class="bar-in">
    <ul class="l">
      <li><a href="dia.html" class="logo">DIA</a></li>
      <li><a href="dia.html">Home</a></li>
    </ul>
    <ul class="r">
      <li><a href="dia-preview-login.html?staff=1">Login</a></li>
      <li><a href="dia-preview-join.html?staff=1&amp;mode=join">Join</a></li>
    </ul>
  </div>
</header>

<div class="box">
  <div class="eyebrow">Login</div>
  <h1>다시 오셨네요</h1>

  <div class="field" id="igWrap"><input type="text" id="igId" placeholder="인스타그램 아이디 또는 샵 이름 (초성 검색)" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"><div class="ig-sug" id="igSug"></div></div>
  <div class="field"><input type="password" id="pin" placeholder="비밀번호 4자리" inputmode="numeric" maxlength="4" autocomplete="current-password" style="letter-spacing:.45em;"></div>
  <label class="saveid"><input type="checkbox" id="saveId"> 인스타그램 아이디 저장 (다음에 자동 입력)</label>
  <p class="hint">가입할 때 쓴 인스타그램 아이디를 적어 주세요. 비밀번호는 숫자 4자리입니다.</p>
  <button class="btn" type="button" id="loginBtn">로그인</button>



  <div class="sns">
    <div class="sns-t">간편 로그인</div>
    <div class="sns-b">
      <a class="naver" href="#" data-sns="naver" style="font-weight:900;">N 네이버로 로그인</a>
      <a class="kakao" href="#" data-sns="kakao"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#3C1E1E" d="M12 3.2C6.48 3.2 2 6.68 2 10.97c0 2.75 1.83 5.16 4.59 6.54l-.74 2.74c-.11.41.33.74.69.51l3.27-2.21c.71.1 1.44.16 2.19.16 5.52 0 10-3.48 10-7.74 0-4.29-4.48-7.77-10-7.77z"/></svg>카카오로 로그인</a>
      <a class="google" href="#" data-sns="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>구글로 로그인</a>
    </div>
  </div>

  <div class="links">
    <a href="#">아이디 찾기</a><span>|</span>
    <a href="#">비밀번호 찾기</a><span>|</span>
    <a href="dia-preview-join.html?staff=1&amp;mode=join">회원가입</a>
  </div>

  <div class="join">
    <p>처음이신가요?</p>
    <a href="dia-preview-join.html?staff=1&amp;mode=join">회원가입하기</a>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var SAVE_KEY = 'dia_saved_ig';
  var ig = document.getElementById('igId');
  var saveBox = document.getElementById('saveId');
  var btn = document.getElementById('loginBtn');
  function get(){ try{ return localStorage.getItem(SAVE_KEY) || ''; }catch(e){ return ''; } }
  // 저장된 아이디가 있으면 불러와서 자동 입력
  var saved = get();
  if (saved){ if (ig) ig.value = saved; if (saveBox) saveBox.checked = true; }

  if (ig) ig.addEventListener('input', function(){
    ig.value = ig.value.replace(/^@+/, '').replace(/\s/g, '');
    // 저장을 켜 둔 상태면 타이핑할 때마다 함께 저장
    if (saveBox && saveBox.checked){ try{ localStorage.setItem(SAVE_KEY, ig.value.trim()); }catch(e){} }
  });

  if (saveBox) saveBox.addEventListener('change', function(){
    try{
      if (saveBox.checked) localStorage.setItem(SAVE_KEY, (ig ? ig.value : '').trim());
      else localStorage.removeItem(SAVE_KEY);
    }catch(e){}
  });

  if (btn) btn.addEventListener('click', function(){
    if (saveBox && saveBox.checked){ try{ localStorage.setItem(SAVE_KEY, (ig ? ig.value : '').trim()); }catch(e){} }
  });

  // ── 명부 초성·아이디 자동검색 (오른쪽 쭈르륵) ──
  var sug = document.getElementById('igSug');
  var wrap = document.getElementById('igWrap');
  var list = (window.DIA_MEMBERS || []).slice();

  function indexMember(m){
    var parts = [m.n || '', m.i || '', m.o || ''];
    // 슬래시로 나뉜 지역/아이디/업종도 각각 검색되게 분리
    String(m.n || '').split('/').forEach(function(seg){ if (seg.trim()) parts.push(seg.trim()); });
    m._keys = window.DIA_SEARCH ? DIA_SEARCH.buildKeys(parts) : [];
    return m;
  }
  list.forEach(indexMember);

  // 파이어베이스 추가/제외 회원도 반영
  if (window.DiaFB && DiaFB.getMeta) {
    DiaFB.getMeta('members').then(function(meta){
      if (!meta || typeof meta !== 'object') return;
      var byN = {};
      list.forEach(function(m){ byN[m.n] = m; });
      (meta.added || []).forEach(function(a){
        if (a && a.n && !byN[a.n]) {
          var row = indexMember({ n: a.n, i: a.i || '', r: a.r || '', o: a.o || '회원', c: a.c || '' });
          list.push(row);
          byN[a.n] = row;
        }
      });
      (meta.removed || []).forEach(function(name){
        list = list.filter(function(m){ return m.n !== name; });
      });
      if (ig && ig.value.trim() && document.activeElement === ig) renderSug();
    }).catch(function(){});
  }

  function hideSug(){ if (sug){ sug.style.display = 'none'; sug.innerHTML = ''; } }
  function renderSug(){
    if (!sug || !ig) return;
    var raw = ig.value.trim();
    if (!raw){ hideSug(); return; }
    var hits = [];
    for (var idx = 0; idx < list.length; idx++){
      var m = list[idx];
      var sc = 0;
      if (window.DIA_SEARCH) {
        sc = DIA_SEARCH.matchKeys(m._keys || [], raw);
      } else {
        var q = raw.toLowerCase();
        if ((m.n + ' ' + m.i + ' ' + m.o).toLowerCase().indexOf(q) >= 0) sc = 1;
      }
      if (sc > 0) hits.push({ m: m, sc: sc });
    }
    if (!hits.length){ hideSug(); return; }
    hits.sort(function(a, b){
      function bonus(m){
        var sc = 0;
        var q = raw.toLowerCase().replace(/^@+/, '');
        var n = (m.n || '').toLowerCase();
        var ig = (m.i || '').toLowerCase();
        if (n.indexOf(q) === 0 || ig.indexOf(q) === 0) sc += 100;
        if (window.DIA_SEARCH && DIA_SEARCH.isJamoOnly(DIA_SEARCH.norm(q))) {
          var nCho = DIA_SEARCH.toCho(DIA_SEARCH.norm(m.n || ''));
          if (nCho.indexOf(DIA_SEARCH.norm(q)) === 0) sc += 120;
        }
        return sc;
      }
      return (b.sc + bonus(b.m)) - (a.sc + bonus(a.m));
    });
    sug.innerHTML = '';
    hits.slice(0, 12).forEach(function(item){
      var m = item.m;
      var b = document.createElement('button');
      b.type = 'button';
      var val = (m.i || m.n || '').replace(/^@+/, '');
      b.innerHTML = '<span class="nm"></span><span class="ig"></span>';
      b.querySelector('.nm').textContent = m.n;
      b.querySelector('.ig').textContent = m.i ? '@' + m.i : (m.r || '');
      b.addEventListener('click', function(){
        ig.value = val;
        if (saveBox && saveBox.checked){ try{ localStorage.setItem(SAVE_KEY, val); }catch(e){} }
        hideSug();
      });
      sug.appendChild(b);
    });
    sug.style.display = 'block';
  }

  if (ig) {
    ig.addEventListener('input', renderSug);
    ig.addEventListener('focus', function(){ if (ig.value.trim()) renderSug(); });
    ig.addEventListener('keydown', function(e){ if (e.key === 'Escape') hideSug(); });
  }
  document.addEventListener('click', function(e){
    if (wrap && !wrap.contains(e.target)) hideSug();
  });
});
</script>
<script src="dia-search.js?v=3"></script>
<script src="dia-members.js?v=1"></script>
<script src="dia-fb.js?v=15"></script>
<script src="preview-cursor.js?v=2"></script>
<script src="preview-live.js?v=1"></script>
</body>
</html>
