<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>샵매물 — 다이아 커뮤니티</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css?family=Nanum+Gothic:400,700,800" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700" rel="stylesheet">
<link rel="stylesheet" href="dia-skin-header.css?v=5">
<style>
  :root{
    --bg:#ffffff; --paper:#ffffff; --soft:#f7f5f6; --blush:#f5e5e2; --blush-deep:#eccfc9;
    --ink:#1e1a1b; --ink-soft:#665e60; --ink-mute:#9c9194; --line:#eee8ea; --accent:#d55576;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  .headline{padding:32px 0 18px;background:#fff;border-bottom:1px solid var(--line);}
  .headline-in{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;}
  .headline h1{margin:6px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.03em;}
  .headline p{margin:0;font-size:13px;color:var(--ink-soft);}
  .headline .count{font-size:12px;color:var(--ink-mute);font-weight:600;}

  /* 트렌디한 상단 검색 + 가로 필터 바 */
  .flt-sticky{position:sticky;top:45px;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 0 12px;}
  .flt-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:220px;position:relative;display:flex;align-items:center;}
  .search-box svg{position:absolute;left:14px;width:16px;height:16px;color:var(--ink-mute);pointer-events:none;}
  .fsearch{width:100%;height:42px;padding:0 16px 0 40px;border:1.5px solid var(--line);border-radius:999px;
    font-size:13.5px;outline:none;font-family:inherit;background:#fafafa;color:var(--ink);transition:border-color .15s,background .15s;}
  .fsearch:focus{border-color:var(--accent);background:#fff;}

  .type-seg{display:inline-flex;background:#f4f1f2;padding:3px;border-radius:999px;gap:2px;flex-shrink:0;}
  .type-seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;transition:all .15s;}
  .type-seg button[data-on="1"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .flt-bar{display:flex;align-items:center;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  .flt-bar::-webkit-scrollbar{display:none;}
  .f-pill{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 14px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:700;
    white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0;}
  .f-pill:hover{border-color:#d8c8cd;}
  .f-pill.has-val{background:#fdf2f5;border-color:#e9b8c6;color:#b83f62;}
  .f-pill.is-open{border-color:var(--ink);color:var(--ink);}
  .f-pill svg{width:12px;height:12px;opacity:.6;transition:transform .15s;}
  .f-pill.is-open svg{transform:rotate(180deg);}
  .f-reset{height:36px;padding:0 12px;border:0;background:none;color:var(--ink-mute);font-size:12px;font-weight:700;
    cursor:pointer;white-space:nowrap;flex-shrink:0;display:none;}
  .f-reset.show{display:inline-flex;align-items:center;gap:4px;}
  .f-reset:hover{color:var(--accent);}

  /* 펼쳐지는 필터 패널 (칩 + 슬라이더) */
  .flt-panel{display:none;margin-top:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;
    padding:18px 20px;box-shadow:0 12px 32px rgba(30,20,24,.08);}
  .flt-panel.is-open{display:block;animation:fpFade .16s ease;}
  @keyframes fpFade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .fp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .fp-title{font-size:13.5px;font-weight:800;color:var(--ink);}
  .fp-close{border:0;background:#f4f1f2;width:28px;height:28px;border-radius:999px;font-size:15px;color:var(--ink-soft);cursor:pointer;line-height:1;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .12s;}
  .chip:hover{border-color:#d8c8cd;}
  .chip[data-on="1"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}

  /* 슬라이더 UI */
  .rng-box{padding:4px 2px 6px;}
  .rng-val{font-size:17px;font-weight:800;color:var(--accent);margin-bottom:10px;letter-spacing:-.02em;}
  .rng-val span{font-size:12px;font-weight:600;color:var(--ink-mute);margin-left:6px;}
  .rng-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;
    background:#ece5e7;outline:none;cursor:pointer;margin:6px 0 10px;}
  .rng-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
    background:#fff;border:2.5px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;}
  .rng-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);
    box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;}
  .rng-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-mute);margin-bottom:12px;}

  /* 결과 바 + 정렬 + 등록 버튼 */
  .bar2{display:flex;align-items:center;gap:10px;margin:18px 0 14px;flex-wrap:wrap;}
  .bar2 .n{font-size:13px;font-weight:700;color:var(--ink);}
  .sort{display:inline-flex;gap:4px;margin-left:auto;}
  .sort button{border:0;background:none;font-size:12px;color:var(--ink-mute);cursor:pointer;padding:6px 8px;border-radius:8px;font-weight:600;}
  .sort button[data-on="1"]{color:var(--ink);background:#f4f1f2;font-weight:800;}
  .bar2 .add{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 18px;
    background:var(--ink);color:#fff;border:0;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .bar2 .add:hover{background:#3c3537;}

  /* 알로하 쇼핑몰 스타일 매물 카드 그리드 */
  .list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 14px;padding-bottom:70px;}
  .item{background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:transform .16s ease;}
  .item:hover .thumb img{transform:scale(1.04);}
  .thumb{position:relative;width:100%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#f5f3f4;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s ease;}
  .thumb .badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;}
  .thumb .b-tag{font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:800;backdrop-filter:blur(4px);letter-spacing:-.01em;}
  .thumb .b-tag.give{background:rgba(30,26,27,.82);color:#fff;}
  .thumb .b-tag.want{background:rgba(61,102,143,.88);color:#fff;}
  .thumb .b-tag.kind{background:rgba(255,255,255,.92);color:var(--ink);}
  .thumb .pic-cnt{position:absolute;right:8px;bottom:8px;font-size:10.5px;font-weight:700;color:#fff;
    background:rgba(0,0,0,.55);padding:3px 7px;border-radius:999px;backdrop-filter:blur(4px);}
  .item-info{padding:10px 2px 2px;display:flex;flex-direction:column;gap:4px;}
  .item-meta{font-size:11.5px;color:var(--ink-mute);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .item h3{margin:0;font-size:13.5px;font-weight:700;line-height:1.42;letter-spacing:-.02em;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .item-price{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:2px;}
  .item-key{font-size:11.5px;color:var(--accent);font-weight:700;}
  .item-sub{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 쇼핑몰 상품 상세 모달 */
  .dmodal{position:fixed;inset:0;background:rgba(20,16,18,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:350;backdrop-filter:blur(3px);}
  .dmodal[data-open="1"]{display:flex;}
  .dmodal .dbox{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:#fff;border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);position:relative;display:flex;flex-direction:column;}
  .dmodal .dclose{position:absolute;top:12px;right:12px;z-index:5;width:34px;height:34px;border-radius:50%;border:0;
    background:rgba(255,255,255,.9);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .dgal{position:relative;width:100%;aspect-ratio:4/3;background:#f5f3f4;overflow:hidden;flex-shrink:0;}
  .dgal img{width:100%;height:100%;object-fit:cover;display:block;}
  .dgal .gbtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;
    background:rgba(255,255,255,.88);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .dgal .gbtn.prev{left:10px;} .dgal .gbtn.next{right:10px;}
  .dgal .gdots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;
    background:rgba(0,0,0,.45);padding:4px 8px;border-radius:999px;}
  .dgal .gdots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);}
  .dgal .gdots span.on{background:#fff;}
  .dbody{padding:20px 22px 24px;}
  .dtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .tag{font-size:11px;padding:4px 9px;border-radius:999px;font-weight:700;}
  .tag.give{background:#fdf0f3;color:#c23b60;}
  .tag.want{background:#eef4fa;color:#3d668f;}
  .tag.kind{background:#f5f3f4;color:#62595b;}
  .tag.job{background:#f7f2fa;color:#6d4f82;}
  .dbody h2{margin:0 0 6px;font-size:18px;font-weight:800;line-height:1.4;letter-spacing:-.02em;}
  .dbody .dmeta{font-size:12px;color:var(--ink-mute);margin-bottom:14px;}
  .money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;background:#faf8f9;border-radius:12px;margin-bottom:14px;}
  .money div{font-size:11px;color:var(--ink-mute);}
  .money b{display:block;font-size:15px;color:var(--ink);font-weight:800;letter-spacing:-.02em;margin-top:3px;}
  .dtext{font-size:13px;line-height:1.7;color:var(--ink-soft);white-space:pre-line;max-height:220px;overflow-y:auto;padding-right:4px;margin-bottom:16px;}
  .dact{display:flex;gap:8px;}
  .dact a{flex:1;height:44px;border-radius:12px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .dact a:hover{background:#3c3537;}

  .empty{border:1.5px dashed var(--blush-deep);background:#fff;border-radius:16px;padding:48px 20px;text-align:center;
    font-size:13px;color:var(--ink-soft);line-height:1.9;margin-bottom:70px;}

  /* 게이트 */
  #dev-soon{border:1px solid var(--line);border-radius:16px;background:#fff;padding:64px 24px;text-align:center;margin:24px 0 70px;}
  #dev-soon .ico{font-size:34px;margin-bottom:14px;}
  #dev-soon .t{font-size:19px;font-weight:700;margin-bottom:10px;letter-spacing:-.02em;}
  #dev-soon .d{font-size:12.5px;color:var(--ink-soft);line-height:1.9;margin-bottom:20px;}
  #dev-soon a{display:inline-block;padding:10px 18px;border:1px solid var(--blush-deep);border-radius:999px;
    font-size:12px;font-weight:700;margin:0 3px;}

  /* 로그인 요청 모달 */
  .gate{position:fixed;inset:0;background:rgba(47,42,43,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:300;}
  .gate[data-open="1"]{display:flex;}
  .gate .box{width:100%;max-width:330px;background:#fff;border-radius:16px;padding:30px 24px 24px;text-align:center;}
  .gate .box .ic{font-size:24px;margin-bottom:10px;}
  .gate .box h4{margin:0 0 8px;font-size:15px;font-weight:800;}
  .gate .box p{margin:0 0 20px;font-size:12px;line-height:1.8;color:var(--ink-soft);}
  .gate .box .btns{display:grid;gap:8px;}
  .gate .box a,.gate .box button{height:42px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;}
  .gate .box a.primary{background:var(--ink);color:#fff;border:0;}
  .gate .box a.ghost{background:#fff;color:var(--ink);border:1px solid var(--blush-deep);}
  .gate .box button.close{background:none;border:0;color:var(--ink-mute);font-size:12px;height:30px;}

  @media (max-width:980px){
    .list{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width:760px){
    .headline{padding:22px 0 14px;}
    .headline h1{font-size:22px;}
    .flt-sticky{top:45px;padding:10px 0;}
    .search-box{min-width:100%;}
    .type-seg{width:100%;justify-content:stretch;}
    .type-seg button{flex:1;padding:8px 0;}
    .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px;}
    .item h3{font-size:13px;}
    .item-price{font-size:13px;}
  }
</style>
</head>
<body data-dev="1">

<header class="dia-header">
  <div class="pv-left">
    <a href="dia.html" class="brand"><span class="brand-logo">DIA COMMUNITY</span></a>
  </div>
  <div class="pv-util">
    <a href="dia-preview-login.html" id="shopAuthBtn">로그인</a>
    <a href="dia-preview-join.html" id="shopJoinBtn">회원가입</a>
  </div>
</header>

<div class="headline">
  <div class="wrap headline-in">
    <div>
      <div class="eyebrow">Shop Market</div>
      <h1>샵매물</h1>
      <p>샵인샵 · 샵매매 · 임대 자리 — 원하는 조건을 쏙 골라 보세요.</p>
    </div>
    <div class="count" id="shop-count"></div>
  </div>
</div>

<main class="wrap">

  <section id="dev-soon" style="display:none;">
    <div class="ico">🛠️</div>
    <div class="t">더 좋은 서비스를 위해 개발 중입니다</div>
    <div class="d">전국 샵매물 정보를 한곳에서 보실 수 있도록 준비하고 있습니다.</div>
    <a href="dia.html">다이아 커뮤니티</a>
    <a href="dia-course.html">뷰티수강</a>
  </section>

  <section id="dev-real" style="display:none;">

    <div class="flt-sticky">
      <div class="flt-top">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="fsearch" id="f-q" type="text" placeholder="지역·업종·매물 이름으로 찾기">
        </div>
        <div class="type-seg" id="f-type-seg">
          <button type="button" data-v="" data-on="1">전체</button>
          <button type="button" data-v="give">내놔요</button>
          <button type="button" data-v="want">구해요</button>
        </div>
      </div>

      <div class="flt-bar" id="flt-bar">
        <button type="button" class="f-pill" data-fp="area"><span>지역</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="f-pill" data-fp="kind"><span>거래종류</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="f-pill" data-fp="job"><span>업종</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="f-pill" data-fp="dep"><span>보증금</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="f-pill" data-fp="rent"><span>월세</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="f-pill" data-fp="key"><span>권리금</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="f-reset" id="f-reset">↺ 초기화</button>
      </div>

      <div class="flt-panel" id="flt-panel"></div>
    </div>

    <div class="bar2">
      <div class="n" id="shop-n"></div>
      <div class="sort" id="f-sort">
        <button type="button" data-v="new" data-on="1">최신순</button>
        <button type="button" data-v="dep">보증금순</button>
        <button type="button" data-v="rent">월세순</button>
      </div>
      <button type="button" class="add" id="shop-add">+ 매물 등록</button>
    </div>

    <div class="list" id="shop-items"></div>
    <div class="empty" id="shop-empty" style="display:none;">
      조건에 맞는 매물이 없습니다.<br>지역이나 가격 조건을 넓혀 보세요.
    </div>
  </section>
</main>

<div class="gate" id="gate">
  <div class="box">
    <div class="ic">🔐</div>
    <h4>로그인이 필요합니다</h4>
    <p>매물을 등록하려면 인스타그램 아이디로 로그인해 주세요.<br>아직 아이디가 없으면 회원가입부터 하시면 됩니다.</p>
    <div class="btns">
      <a class="primary" href="dia-preview-login.html">로그인</a>
      <a class="ghost" href="dia-preview-join.html">회원가입</a>
      <button type="button" class="close" data-close="1">닫기</button>
    </div>
  </div>
</div>

<div class="dmodal" id="dmodal">
  <div class="dbox" id="dbox"></div>
</div>

<script src="dia-shop-data.js?v=1"></script>
<script src="dia-staff.js?v=5" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var AREAS = ['전체','서울','경기·인천','부산·울산','대구·경북','대전·충청','광주·전라','강원','제주','온라인'];
  var KINDS = [['','전체'],['샵매매','샵매매'],['샵인샵','샵인샵'],['임대','자리 임대']];
  var JOBS  = ['전체','속눈썹펌','속눈썹연장','네일','반영구','왁싱','피부','토탈뷰티','두피·탈모'];

  var LS = 'dia_shop_items_v1';
  var state = { area:'전체', kind:'', type:'', job:'전체', depMax:null, rentMax:null, keyMax:null, q:'', sort:'new' };
  var openPanel = '';

  function load(){ try { var a = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
  function save(a){ try { localStorage.setItem(LS, JSON.stringify(a)); } catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function man(v){ v = Number(v)||0; return v >= 10000 ? (v/10000).toFixed(v%10000?1:0).replace(/\.0$/,'') + '억' : v.toLocaleString('ko-KR') + '만'; }

  function updatePills(){
    var setPill = function(fp, base, val){
      var b = document.querySelector('.f-pill[data-fp="'+fp+'"]');
      if (!b) return;
      b.querySelector('span').textContent = val ? (base + ' · ' + val) : base;
      b.classList.toggle('has-val', !!val);
      b.classList.toggle('is-open', openPanel === fp);
    };
    setPill('area', '지역', state.area !== '전체' ? state.area : '');
    setPill('kind', '거래종류', state.kind || '');
    setPill('job', '업종', state.job !== '전체' ? state.job : '');
    setPill('dep', '보증금', state.depMax !== null ? ('~' + man(state.depMax)) : '');
    setPill('rent', '월세', state.rentMax !== null ? ('~' + man(state.rentMax)) : '');
    setPill('key', '권리금', state.keyMax !== null ? (state.keyMax === 0 ? '없음' : ('~' + man(state.keyMax))) : '');

    var dirty = state.area !== '전체' || state.kind || state.type || state.job !== '전체' ||
      state.depMax !== null || state.rentMax !== null || state.keyMax !== null || state.q;
    document.getElementById('f-reset').classList.toggle('show', !!dirty);

    document.querySelectorAll('#f-type-seg button').forEach(function(b){
      b.setAttribute('data-on', b.getAttribute('data-v') === state.type ? 1 : 0);
    });
    document.querySelectorAll('#f-sort button').forEach(function(b){
      b.setAttribute('data-on', b.getAttribute('data-v') === state.sort ? 1 : 0);
    });
  }

  function renderPanel(){
    var panel = document.getElementById('flt-panel');
    if (!openPanel) { panel.classList.remove('is-open'); panel.innerHTML = ''; updatePills(); return; }
    panel.classList.add('is-open');
    var html = '';
    if (openPanel === 'area' || openPanel === 'kind' || openPanel === 'job') {
      var title = openPanel === 'area' ? '지역 선택' : (openPanel === 'kind' ? '거래 종류' : '업종 선택');
      var list = openPanel === 'area' ? AREAS : (openPanel === 'kind' ? KINDS : JOBS);
      var cur = openPanel === 'area' ? state.area : (openPanel === 'kind' ? state.kind : state.job);
      html = '<div class="fp-head"><span class="fp-title">'+title+'</span><button type="button" class="fp-close" id="fp-x">×</button></div>' +
        '<div class="chips">' + list.map(function(o){
          var v = Array.isArray(o)?o[0]:o, t = Array.isArray(o)?o[1]:o;
          return '<button type="button" class="chip" data-v="'+esc(v)+'" data-on="'+(String(v)===String(cur)?1:0)+'">'+esc(t)+'</button>';
        }).join('') + '</div>';
      panel.innerHTML = html;
      panel.querySelectorAll('.chip').forEach(function(b){
        b.onclick = function(){
          var v = b.getAttribute('data-v');
          if (openPanel === 'area') state.area = v;
          else if (openPanel === 'kind') state.kind = v;
          else state.job = v;
          openPanel = '';
          renderPanel(); render();
        };
      });
    } else {
      var cfg = openPanel === 'dep'
        ? { title:'보증금 상한', max:5000, step:100, cur:state.depMax, presets:[['','전체'],[500,'500만 이하'],[1000,'1,000만 이하'],[2000,'2,000만 이하'],[3000,'3,000만 이하']] }
        : openPanel === 'rent'
        ? { title:'월세 상한', max:300, step:5, cur:state.rentMax, presets:[['','전체'],[30,'30만 이하'],[50,'50만 이하'],[100,'100만 이하'],[150,'150만 이하']] }
        : { title:'권리금 상한', max:3000, step:100, cur:state.keyMax, presets:[['','전체'],[0,'없음'],[500,'500만 이하'],[1000,'1,000만 이하'],[2000,'2,000만 이하']] };
      var sliderVal = cfg.cur === null ? cfg.max : cfg.cur;
      var valText = cfg.cur === null ? '전체 금액' : (cfg.cur === 0 ? '없음 (0원)' : (man(cfg.cur) + ' 이하'));
      html = '<div class="fp-head"><span class="fp-title">'+cfg.title+'</span><button type="button" class="fp-close" id="fp-x">×</button></div>' +
        '<div class="rng-box">' +
          '<div class="rng-val" id="rng-label">'+valText+'<span>드래그해서 금액 조절</span></div>' +
          '<input type="range" class="rng-slider" id="rng-in" min="0" max="'+cfg.max+'" step="'+cfg.step+'" value="'+sliderVal+'">' +
          '<div class="rng-ticks"><span>0</span><span>'+man(cfg.max/2)+'</span><span>'+man(cfg.max)+'+</span></div>' +
        '</div>' +
        '<div class="chips">' + cfg.presets.map(function(p){
          var isOn = (p[0] === '' && cfg.cur === null) || (p[0] !== '' && cfg.cur === Number(p[0]));
          return '<button type="button" class="chip" data-pv="'+esc(p[0])+'" data-on="'+(isOn?1:0)+'">'+esc(p[1])+'</button>';
        }).join('') + '</div>';
      panel.innerHTML = html;
      var rin = document.getElementById('rng-in');
      var rlb = document.getElementById('rng-label');
      rin.oninput = function(){
        var v = Number(rin.value);
        var next = (v >= cfg.max) ? null : v;
        if (openPanel === 'dep') state.depMax = next;
        else if (openPanel === 'rent') state.rentMax = next;
        else state.keyMax = next;
        rlb.innerHTML = (next === null ? '전체 금액' : (next === 0 ? '없음 (0원)' : (man(next) + ' 이하'))) + '<span>드래그해서 금액 조절</span>';
        panel.querySelectorAll('.chip').forEach(function(c){
          var pv = c.getAttribute('data-pv');
          c.setAttribute('data-on', ((pv === '' && next === null) || (pv !== '' && next === Number(pv))) ? 1 : 0);
        });
        updatePills(); render();
      };
      panel.querySelectorAll('.chip').forEach(function(b){
        b.onclick = function(){
          var pv = b.getAttribute('data-pv');
          var next = pv === '' ? null : Number(pv);
          if (openPanel === 'dep') state.depMax = next;
          else if (openPanel === 'rent') state.rentMax = next;
          else state.keyMax = next;
          openPanel = '';
          renderPanel(); render();
        };
      });
    }
    var fx = document.getElementById('fp-x');
    if (fx) fx.onclick = function(){ openPanel = ''; renderPanel(); };
    updatePills();
  }

  document.querySelectorAll('.f-pill[data-fp]').forEach(function(b){
    b.addEventListener('click', function(){
      var fp = b.getAttribute('data-fp');
      openPanel = (openPanel === fp) ? '' : fp;
      renderPanel();
    });
  });

  document.querySelectorAll('#f-type-seg button').forEach(function(b){
    b.addEventListener('click', function(){ state.type = b.getAttribute('data-v'); updatePills(); render(); });
  });
  document.querySelectorAll('#f-sort button').forEach(function(b){
    b.addEventListener('click', function(){ state.sort = b.getAttribute('data-v'); updatePills(); render(); });
  });
  document.getElementById('f-q').addEventListener('input', function(e){ state.q = e.target.value.trim(); updatePills(); render(); });
  document.getElementById('f-reset').addEventListener('click', function(){
    state.area = '전체'; state.kind = ''; state.type = ''; state.job = '전체';
    state.depMax = null; state.rentMax = null; state.keyMax = null; state.q = '';
    document.getElementById('f-q').value = '';
    openPanel = '';
    renderPanel(); render();
  });

  function loggedIn(){
    try{
      if (window.DIA_STAFF) return true;
      if (localStorage.getItem('dia_member') === '1') return true;
      if (localStorage.getItem('dia_login_member') || localStorage.getItem('dia_login_member_bak')) return true;
    }catch(e){}
    return false;
  }
  var gate = document.getElementById('gate');
  gate.addEventListener('click', function(e){
    if (e.target === gate || e.target.getAttribute('data-close')) gate.setAttribute('data-open','0');
  });
  document.getElementById('shop-add').addEventListener('click', function(){
    if (!loggedIn()) { gate.setAttribute('data-open','1'); return; }
    var title = prompt('매물 이름 (예: 홍대 속눈썹펌 샵인샵 자리)');
    if (!title) return;
    var kind = prompt('종류 (샵매매 · 샵인샵 · 임대)', '샵인샵') || '샵인샵';
    var type = prompt('내놔요 / 구해요', '내놔요') || '내놔요';
    var area = prompt('지역 (서울 · 경기·인천 · 부산·울산 · 대구·경북 · 대전·충청 · 광주·전라 · 강원 · 제주 · 온라인)', '서울') || '서울';
    var job = prompt('업종 (속눈썹펌 · 네일 · 반영구 · 왁싱 · 피부 · 토탈뷰티 · 두피·탈모)', '속눈썹펌') || '속눈썹펌';
    var dep = Number(prompt('보증금 (만원, 숫자만)', '1000') || 0);
    var rent = Number(prompt('월세 (만원, 숫자만)', '80') || 0);
    var key = Number(prompt('권리금 (만원, 없으면 0)', '0') || 0);
    var a = load();
    a.unshift({ id:'s'+Date.now(), title:title, kind:kind, type:(type.indexOf('구해')>=0?'want':'give'),
      area:area, job:job, dep:dep, rent:rent, key:key, at:new Date().toISOString().slice(0,10) });
    save(a); render();
  });

  function allItems(){
    var base = Array.isArray(window.DIA_SHOP_LISTINGS) ? window.DIA_SHOP_LISTINGS : [];
    var mine = load().filter(function(x){ return x && !/^ex[1-6]$/.test(String(x.id||'')); });
    return mine.concat(base);
  }

  function render(){
    var all = allItems();
    var a = all.filter(function(it){
      if (state.area !== '전체' && it.area !== state.area) return false;
      if (state.kind && it.kind !== state.kind) return false;
      if (state.type && it.type !== state.type) return false;
      if (state.job !== '전체' && it.job !== state.job) return false;
      if (state.depMax !== null && (Number(it.dep)||0) > state.depMax) return false;
      if (state.rentMax !== null && (Number(it.rent)||0) > state.rentMax) return false;
      if (state.keyMax !== null && (Number(it.key)||0) > state.keyMax) return false;
      if (state.q) {
        var s = (it.title+' '+it.area+' '+it.job+' '+it.kind+' '+(it.summary||'')).toLowerCase();
        if (s.indexOf(state.q.toLowerCase()) < 0) return false;
      }
      return true;
    });
    if (state.sort === 'dep') a.sort(function(x,y){ return (x.dep||0)-(y.dep||0); });
    else if (state.sort === 'rent') a.sort(function(x,y){ return (x.rent||0)-(y.rent||0); });
    else a.sort(function(x,y){ return String(y.at||'').localeCompare(String(x.at||'')); });

    document.getElementById('shop-count').textContent = '뷰앤잡 실매물 ' + all.length + '건';
    document.getElementById('shop-n').textContent = '매물 ' + a.length + '건';

    var box = document.getElementById('shop-items'), empty = document.getElementById('shop-empty');
    if (!a.length) { box.innerHTML=''; empty.style.display=''; return; }
    empty.style.display = 'none';
    box.innerHTML = a.map(function(it){
      var imgs = Array.isArray(it.imgs) && it.imgs.length ? it.imgs : [];
      var cover = imgs[0] || '';
      var priceStr = (it.depTxt || man(it.dep)) + ' / 월 ' + (it.rentTxt || man(it.rent));
      var keyStr = it.keyTxt ? ('권리금 ' + it.keyTxt) : (Number(it.key)>0 ? ('권리금 ' + man(it.key)) : '무권리');
      return '<article class="item" data-id="'+esc(it.id)+'">'+
        '<div class="thumb">'+
          (cover ? '<img src="'+esc(cover)+'" alt="'+esc(it.title)+'" loading="lazy">' : '')+
          '<div class="badges">'+
            '<span class="b-tag '+(it.type==='give'?'give':'want')+'">'+(it.type==='give'?'양도':'구함')+'</span>'+
            '<span class="b-tag kind">'+esc(it.kind||'샵매매')+'</span>'+
          '</div>'+
          (imgs.length > 1 ? '<span class="pic-cnt">📷 '+imgs.length+'</span>' : '')+
        '</div>'+
        '<div class="item-info">'+
          '<div class="item-meta"><span>'+esc(it.area)+' · '+esc(it.job)+'</span><span>'+esc(it.at||'')+'</span></div>'+
          '<h3>'+esc(it.title)+'</h3>'+
          '<div class="item-price">'+esc(priceStr)+'</div>'+
          '<div class="item-key">'+esc(keyStr)+'</div>'+
        '</div>'+
      '</article>';
    }).join('');

    box.querySelectorAll('.item').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-id');
        var found = all.find(function(x){ return x.id === id; });
        if (found) openDetail(found);
      });
    });
  }

  var dmodal = document.getElementById('dmodal');
  var dbox = document.getElementById('dbox');
  dmodal.addEventListener('click', function(e){
    if (e.target === dmodal) dmodal.setAttribute('data-open', '0');
  });

  function openDetail(it){
    var imgs = Array.isArray(it.imgs) && it.imgs.length ? it.imgs : [];
    var idx = 0;
    function draw(){
      var imgHtml = imgs.length ? (
        '<div class="dgal">'+
          '<img src="'+esc(imgs[idx])+'" alt="'+esc(it.title)+'">'+
          (imgs.length > 1 ? '<button type="button" class="gbtn prev" id="dg-prev">‹</button><button type="button" class="gbtn next" id="dg-next">›</button>' : '')+
          (imgs.length > 1 ? '<div class="gdots">'+imgs.map(function(_,i){ return '<span class="'+(i===idx?'on':'')+'"></span>'; }).join('')+'</div>' : '')+
        '</div>'
      ) : '';
      dbox.innerHTML =
        '<button type="button" class="dclose" id="d-close">×</button>'+
        imgHtml+
        '<div class="dbody">'+
          '<div class="dtags">'+
            '<span class="tag '+(it.type==='give'?'give':'want')+'">'+(it.type==='give'?'양도/임대':'구해요')+'</span>'+
            '<span class="tag kind">'+esc(it.kind)+'</span>'+
            '<span class="tag job">'+esc(it.job)+'</span>'+
          '</div>'+
          '<h2>'+esc(it.title)+'</h2>'+
          '<div class="dmeta">'+esc(it.area)+' · '+esc(it.source||'직접 등록')+' · '+esc(it.at||'')+'</div>'+
          '<div class="money">'+
            '<div>보증금<b>'+esc(it.depTxt || man(it.dep))+'</b></div>'+
            '<div>월세<b>'+esc(it.rentTxt || man(it.rent))+'</b></div>'+
            '<div>권리금<b>'+esc(it.keyTxt || (Number(it.key)>0?man(it.key):'없음'))+'</b></div>'+
          '</div>'+
          '<div class="dtext">'+esc(it.body || it.summary || '상세 내용은 원글을 확인해 주세요.')+'</div>'+
          (it.url ? '<div class="dact"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">뷰앤잡 원글 보기 ↗</a></div>' : '')+
        '</div>';
      document.getElementById('d-close').onclick = function(){ dmodal.setAttribute('data-open', '0'); };
      var pv = document.getElementById('dg-prev'), nx = document.getElementById('dg-next');
      if (pv) pv.onclick = function(){ idx = (idx - 1 + imgs.length) % imgs.length; draw(); };
      if (nx) nx.onclick = function(){ idx = (idx + 1) % imgs.length; draw(); };
    }
    draw();
    dmodal.setAttribute('data-open', '1');
  }

  updatePills(); render();
  (function(){
    var ab = document.getElementById('shopAuthBtn');
    var jb = document.getElementById('shopJoinBtn');
    var hasMem = false;
    try { hasMem = !!(localStorage.getItem('dia_login_member') || localStorage.getItem('dia_login_member_bak')); } catch(e){}
    if (ab && hasMem) {
      ab.textContent = '로그아웃';
      ab.href = '#logout';
      if (jb) jb.style.setProperty('display', 'none', 'important');
      ab.addEventListener('click', function(ev){
        ev.preventDefault();
        try {
          ['dia_login_member','dia_login_member_bak','dia_no_track','dia_sns_need_ig','dia_sns_linked_ig','dia_sns_joined_ts','dia_sns_user'].forEach(function(k){ localStorage.removeItem(k); });
        } catch(e){}
        location.reload();
      });
    }
  })();
});
</script>
</body>
</html>
