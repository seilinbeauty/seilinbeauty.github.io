<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>샵매물 — 다이아 커뮤니티</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --pink:#d55576; --pink-deep:#c6506f; --pink-soft:#fdf3f7; --line:#f0e2e7; --txt:#333; --mute:#9a9a9a; }
  *{box-sizing:border-box;}
  body{margin:0;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--txt);}
  header{background:#fff;border-bottom:1px solid var(--line);}
  header .inner{max-width:1080px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  header .brand{font-size:16px;font-weight:900;color:var(--pink);letter-spacing:-.02em;text-decoration:none;}
  header .back{font-size:12.5px;font-weight:700;color:#8a7b81;text-decoration:none;}
  main{max-width:1080px;margin:0 auto;padding:28px 20px 70px;}
  .hero-tag{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--pink);}
  h1{margin:6px 0 4px;font-size:24px;font-weight:900;letter-spacing:-.03em;}
  .sub{margin:0 0 22px;font-size:13px;color:var(--mute);}

  #dev-soon{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(198,69,106,.07);
    padding:64px 24px;text-align:center;}
  #dev-soon .ico{font-size:40px;line-height:1;margin-bottom:16px;}
  #dev-soon .t{font-size:20px;font-weight:900;letter-spacing:-.03em;margin-bottom:10px;}
  #dev-soon .bar{width:60px;height:3px;border-radius:99px;background:linear-gradient(90deg,#ef9ab4,#d55576);margin:0 auto 20px;}
  #dev-soon .d{font-size:13.5px;color:var(--mute);line-height:1.7;margin-bottom:22px;}
  .soon-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .soon-foot a,.soon-foot button{display:inline-block;padding:10px 18px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:#8a7b81;font-size:12.5px;font-weight:800;text-decoration:none;cursor:pointer;font-family:inherit;}
  .soon-foot .on{border:0;background:linear-gradient(90deg,#ef9ab4,#d55576);color:#fff;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
  .toolbar input[type=text]{flex:1;min-width:180px;padding:10px 13px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;font-family:inherit;}
  .toolbar select{padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;font-family:inherit;background:#fff;color:#555;}
  .toolbar button{padding:10px 16px;border:0;border-radius:9px;cursor:pointer;background:linear-gradient(90deg,#ef9ab4,#d55576);color:#fff;font-size:13px;font-weight:800;font-family:inherit;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{border:0;background:#fff;color:#8a7b81;font-size:12.5px;font-weight:800;padding:9px 14px;cursor:pointer;font-family:inherit;}
  .seg button[data-on="1"]{background:var(--pink-soft);color:var(--pink-deep);}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .cats button{border:1px solid var(--line);background:#fff;color:#7a6b71;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:99px;cursor:pointer;font-family:inherit;}
  .cats button[data-on="1"]{border-color:#f0b9c9;background:var(--pink-soft);color:var(--pink-deep);}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .item{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px 17px;box-shadow:0 2px 10px rgba(198,69,106,.05);}
  .item .top{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .badge{font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;}
  .badge.want{background:#eef4ff;color:#2563eb;}
  .badge.give{background:#fdeef2;color:var(--pink-deep);}
  .badge.area{background:#f5f5f5;color:#777;}
  .badge.job{background:#f3fbf5;color:#15803d;}
  .badge.kind{background:#f4f0ff;color:#6d28d9;}
  .item h3{margin:0 0 6px;font-size:14.5px;font-weight:800;line-height:1.45;letter-spacing:-.02em;}
  .item .meta{font-size:12px;color:var(--mute);line-height:1.6;}
  .empty{border:1px dashed #f3c7d6;background:var(--pink-soft);border-radius:14px;padding:34px 20px;text-align:center;font-size:13px;color:#a3566d;line-height:1.7;}
</style>
</head>
<body data-dev="1">
<header>
  <div class="inner">
    <a class="brand" href="dia.html">다이아 커뮤니티</a>
    <a class="back" href="dia.html">← 다이아로 돌아가기</a>
  </div>
</header>

<main>
  <div class="hero-tag">SHOP MARKET</div>
  <h1>🏪 샵매물</h1>
  <p class="sub">샵인샵 · 샵매매 — 전국 지역별 부동산 매물만 모읍니다.</p>

  <section id="dev-soon" style="display:none;">
    <div class="ico">🛠️</div>
    <div class="t">더 좋은 서비스를 위해 개발 중입니다</div>
    <div class="bar"></div>
    <div class="d">곧 새로운 모습으로 찾아뵙겠습니다.<br>전국 샵매물 정보를 한곳에서 보실 수 있도록 준비하고 있습니다.</div>
    <div class="soon-foot">
      <a class="on" href="dia.html">다이아 커뮤니티</a>
      <a href="dia-course.html">뷰티수강</a>
    </div>
  </section>

  <section id="dev-real" style="display:none;">
    <div class="toolbar">
      <div class="seg" id="shop-kind">
        <button type="button" data-v="" data-on="1">전체</button>
        <button type="button" data-v="샵인샵">샵인샵</button>
        <button type="button" data-v="샵매매">샵매매</button>
      </div>
      <div class="seg" id="shop-type">
        <button type="button" data-v="" data-on="1">구해요·내놔요 전체</button>
        <button type="button" data-v="want">구해요</button>
        <button type="button" data-v="give">내놔요</button>
      </div>
      <input id="shop-q" type="text" placeholder="제목·지역·업종 검색">
      <select id="shop-job">
        <option value="">업종 전체</option>
        <option>속눈썹펌</option><option>속눈썹연장</option><option>네일</option>
        <option>반영구</option><option>왁싱</option><option>피부</option><option>토탈뷰티</option><option>두피·탈모</option>
      </select>
      <button type="button" id="shop-add">+ 글 등록</button>
    </div>
    <div class="cats" id="shop-areas"></div>
    <div class="list" id="shop-items"></div>
    <div class="empty" id="shop-empty">아직 등록된 샵매물 글이 없습니다.<br><b>+ 글 등록</b>으로 하나씩 쌓으면 이곳에 지역별로 정리됩니다.</div>
  </section>
</main>

<script src="dia-staff.js?v=2" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var AREAS = ['전체','서울','경기·인천','부산·울산','대구·경북','대전·충청','광주·전라','강원','제주','온라인'];
  var LS = 'dia_shop_items_v1';
  var state = { area: '전체', type: '', kind: '', q: '', job: '' };

  function load(){ try { var a = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
  function save(a){ try { localStorage.setItem(LS, JSON.stringify(a)); } catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function buildAreas(){
    var box = document.getElementById('shop-areas');
    box.innerHTML = AREAS.map(function(a){
      return '<button type="button" data-a="'+a+'" data-on="'+(a===state.area?1:0)+'">'+a+'</button>';
    }).join('');
    box.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){ state.area = b.getAttribute('data-a'); buildAreas(); render(); });
    });
  }
  document.getElementById('shop-kind').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      state.kind = b.getAttribute('data-v');
      document.getElementById('shop-kind').querySelectorAll('button').forEach(function(x){ x.setAttribute('data-on', x===b?1:0); });
      render();
    });
  });
  document.getElementById('shop-type').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      state.type = b.getAttribute('data-v');
      document.getElementById('shop-type').querySelectorAll('button').forEach(function(x){ x.setAttribute('data-on', x===b?1:0); });
      render();
    });
  });
  document.getElementById('shop-q').addEventListener('input', function(e){ state.q = e.target.value.trim(); render(); });
  document.getElementById('shop-job').addEventListener('change', function(e){ state.job = e.target.value; render(); });

  document.getElementById('shop-add').addEventListener('click', function(){
    var title = prompt('제목 (예: 홍대 속눈썹펌 샵인샵 자리 구합니다)');
    if (!title) return;
    var kind = prompt('종류 (샵인샵 · 샵매매)', '샵인샵');
    if (!kind) return;
    var type = prompt('구해요 / 내놔요 중 하나', '구해요');
    if (!type) return;
    var area = prompt('지역 (서울·경기·인천·부산·대구·대전·광주·강원·제주·온라인)', '서울');
    if (!area) return;
    var job = prompt('업종 (속눈썹펌·속눈썹연장·네일·반영구·왁싱·피부·토탈뷰티·두피)', '속눈썹펌');
    if (!job) return;
    var link = prompt('원문 주소 (없으면 비워 두세요)', '') || '';
    var a = load();
    a.unshift({ id: 's'+Date.now(), title: title, kind: kind,
      type: type.indexOf('내놔') >= 0 ? 'give' : 'want',
      area: area, job: job, link: link, at: new Date().toISOString().slice(0,10) });
    save(a); render();
  });

  function render(){
    var a = load().filter(function(it){
      if (state.area !== '전체' && it.area !== state.area) return false;
      if (state.kind && it.kind !== state.kind) return false;
      if (state.type && it.type !== state.type) return false;
      if (state.job && it.job !== state.job) return false;
      if (state.q) {
        var s = (it.title + ' ' + it.area + ' ' + it.job).toLowerCase();
        if (s.indexOf(state.q.toLowerCase()) < 0) return false;
      }
      return true;
    });
    var box = document.getElementById('shop-items');
    var empty = document.getElementById('shop-empty');
    if (!a.length) { box.innerHTML = ''; empty.style.display = ''; return; }
    empty.style.display = 'none';
    box.innerHTML = a.map(function(it){
      return '<div class="item">' +
        '<div class="top">' +
          '<span class="badge '+(it.type==='give'?'give':'want')+'">'+(it.type==='give'?'내놔요':'구해요')+'</span>' +
          '<span class="badge kind">'+esc(it.kind||'샵인샵')+'</span>' +
          '<span class="badge area">'+esc(it.area)+'</span>' +
          '<span class="badge job">'+esc(it.job)+'</span>' +
        '</div>' +
        '<h3>'+esc(it.title)+'</h3>' +
        '<div class="meta">'+esc(it.at||'')+(it.link?' · <a href="'+esc(it.link)+'" target="_blank" rel="noopener" style="color:#c6506f;font-weight:700;text-decoration:none;">원문 보기</a>':'')+'</div>' +
      '</div>';
    }).join('');
  }

  buildAreas();
  render();
});
</script>
</body>
</html>
