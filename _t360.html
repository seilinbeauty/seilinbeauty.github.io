<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>360px 확인용</title>
<style>
  body{margin:0;background:#ddd;font-family:sans-serif;}
  .wrap{width:360px;height:900px;margin:0;background:#fff;}
  iframe{width:360px;height:900px;border:0;display:block;}
</style>
</head>
<body>
<div class="wrap"><iframe id="fr"></iframe></div>
<script>
  var fr = document.getElementById('fr');
  fr.addEventListener('load', function(){
    setTimeout(function(){
      try {
        var d = fr.contentDocument;
        var q = new URLSearchParams(location.search).get('d');
        var today = new Date();
        var key = q || (today.getFullYear() + '-' + ('0'+(today.getMonth()+1)).slice(-2) + '-' + ('0'+today.getDate()).slice(-2));
        var cell = d.querySelector('[data-date="' + key + '"]') || d.querySelector('.cell.sel') || d.querySelector('[data-date]');
        if (cell) cell.click();
      } catch(e){}
    }, 1600);
  });
  fr.src = 'parking.html?notrack=1&cb=' + Date.now();
</script>
</body>
</html>
