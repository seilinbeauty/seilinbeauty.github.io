<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>채팅 점검(임시)</title>
</head>
<body>
<p>임시 점검용 파일입니다. 곧 지웁니다.</p>
<script>
/* 뷰티수강 채팅 점검용 임시 파일 (2026-11-24 커비) — 확인이 끝나면 저장소에서 지운다.
   ?as=owner : 가짜 원장님 로그인 값을 이 기기에 넣고(다른 기기번호로 바꿔) 채팅 화면으로 간다
   ?as=cust  : 원래 기기번호로 되돌리고 가짜 로그인 값을 지운다 */
(function(){
  var q = location.search || '';
  function go(u){ location.replace(u); }
  if(/as=owner/.test(q)){
    try{
      var cur = localStorage.getItem('dia_chat_cust') || '';
      if(cur) localStorage.setItem('dia_chat_cust_keep', cur);
      localStorage.setItem('dia_chat_cust', 'cownercheck000001');
      localStorage.setItem('dia_login_member', JSON.stringify({ n: '테스트원장', i: 'test_owner', at: Date.now() }));
      localStorage.setItem('dia_login_member_bak', '테스트원장');
    }catch(e){}
    go('dia-chat.html');
    return;
  }
  if(/as=cust/.test(q)){
    try{
      var keep = localStorage.getItem('dia_chat_cust_keep') || '';
      if(keep) localStorage.setItem('dia_chat_cust', keep);
      localStorage.removeItem('dia_login_member');
      localStorage.removeItem('dia_login_member_bak');
    }catch(e){}
    go('dia-chat.html');
    return;
  }
})();
</script>
</body>
</html>
