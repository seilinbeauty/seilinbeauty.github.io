<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script data-dia-pc="1">(function(){if(!/(?:\?|&)pc=1(?:&|$)/.test(location.search))return;var vp=document.querySelector("meta[name=viewport]");if(vp)vp.setAttribute("content","width=1280, initial-scale=0.3");document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(!h||/^(?:#|javascript:|mailto:|tel:|http)/i.test(h))return;if(/[?&]pc=1(?:&|$)/.test(h))return;a.setAttribute("href",h+(h.indexOf("?")>=0?"&":"?")+"pc=1");},true);})();</script>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>회원가입</title>
<link href="https://fonts.googleapis.com/css?family=Nanum+Gothic:400,700,800" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700" rel="stylesheet">
<style>
  :root{
    --cream:#fbf8f6; --paper:#fff; --blush:#f5e5e2; --blush-deep:#eccfc9;
    --ink:#2f2a2b; --ink-soft:#6f6668; --ink-mute:#a79b9e; --line:#eee6e3; --accent:#c9707f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#ffffff;color:var(--ink);
    font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.1px;}
  a{color:inherit;text-decoration:none;}

  .ac-topbar{background:var(--blush);height:45px;}
  .ac-inner{max-width:1100px;margin:0 auto;padding:0 20px;height:45px;
    display:flex;align-items:center;justify-content:space-between;}
  .ac-topbar ul{list-style:none;margin:0;padding:0;display:flex;align-items:center;height:45px;}
  .ac-topbar a,.ac-topbar button{color:#3a3234;font-size:11.2px;letter-spacing:.9px;
    text-transform:uppercase;display:flex;align-items:center;height:45px;background:none;border:0;
    padding:0;cursor:pointer;font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;}
  .ac-menu li{margin-right:26px;}
  .ac-util li{margin-left:24px;}
  .ac-util li.ico{margin-left:12px;}

  .join{max-width:400px;margin:0 auto;padding:66px 22px 90px;}
  .join .eyebrow{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--ink-mute);text-align:center;}
  .join h1{margin:14px 0 0;text-align:center;font-weight:400;font-size:27px;letter-spacing:-.8px;line-height:1.4;}
  .join .sub{margin:12px 0 0;text-align:center;font-size:12px;line-height:1.9;color:var(--ink-soft);font-weight:400;}
  .match{display:flex;align-items:center;gap:7px;margin:8px 2px 0;font-size:11px;color:var(--ink-mute);letter-spacing:.01em;}
  .match .dot{width:5px;height:5px;border-radius:50%;background:#cfc4c6;flex:0 0 auto;}
  .match.checking .dot{background:#d9b06a;}
  .match.ok .dot{background:#7ba97f;}
  .match.ok .txt{color:#5c8a61;}
  .match.ng .dot{background:#c9707f;}
  .match.ng .txt{color:#b05364;}
  .rule{height:1px;background:var(--line);margin:34px 0 30px;}

  .field{margin-bottom:16px;}
  .field label .req{font-size:9px;letter-spacing:1px;color:#c9707f;margin-left:4px;text-transform:none;}
  .field label .opt{font-size:9px;letter-spacing:1px;color:#c3b8ba;margin-left:4px;text-transform:none;}
  .field label{display:block;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--ink-mute);margin-bottom:7px;}
  .field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);
    background:var(--paper);border-radius:2px;font-size:13px;font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;
    color:var(--ink);outline:none;transition:border-color .16s;}
  .field input:focus,.field select:focus{border-color:var(--blush-deep);}
  .field input::placeholder{color:#c9bfc2;font-weight:400;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{margin:6px 0 0;font-size:10.5px;color:var(--ink-mute);font-weight:400;letter-spacing:.1px;}

  .agree{margin:26px 0 0;padding:16px 0 0;border-top:1px solid var(--line);}
  .chk{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px;font-size:11.5px;
    color:var(--ink-soft);font-weight:400;line-height:1.7;cursor:pointer;}
  .chk input{margin:2px 0 0;width:14px;height:14px;accent-color:var(--accent);flex:0 0 auto;}
  .chk.all{color:var(--ink);font-weight:500;font-size:12px;padding-bottom:11px;
    border-bottom:1px solid var(--line);margin-bottom:12px;}
  .chk a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}

  .btn-main{width:100%;margin-top:22px;padding:15px;border:0;border-radius:2px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:12px;letter-spacing:2.4px;
    text-transform:uppercase;font-family:inherit;font-weight:400;}
  .btn-main:hover{background:#bb6273;}

  .or{display:flex;align-items:center;gap:14px;margin:26px 0 18px;color:var(--ink-mute);font-size:10px;letter-spacing:1.8px;}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line);}
  .btn-social{width:100%;padding:13px;border-radius:2px;font-size:12px;font-family:inherit;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);letter-spacing:.4px;}
  .btn-social.kakao{background:#fee500;border-color:#fee500;color:#3c1e1e;}
  .btn-social.naver{background:#03c75a;border-color:#03c75a;color:#fff;}
  .btn-social.google{background:#fff;border-color:#dadce0;color:#3c4043;}

  .foot-link{text-align:center;margin-top:30px;font-size:11.5px;color:var(--ink-mute);font-weight:400;}
  .foot-link a{color:var(--accent);margin-left:5px;}

  .pv-tag{position:fixed;right:14px;bottom:14px;font-size:10px;letter-spacing:1.2px;
    text-transform:uppercase;color:#b5a9ac;background:rgba(255,255,255,.9);
    border:1px solid var(--line);padding:6px 10px;border-radius:999px;}

  @media (max-width:520px){
    .join{padding:44px 20px 70px;}
    .join h1{font-size:23px;}
    .ac-menu li:not(.ac-all){display:none;}
    .ac-util li:not(.ico){display:none;}
  }

  #pv-door{position:fixed;inset:0;background:#ffffff;display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:99;}
  #pv-door .card{width:100%;max-width:300px;text-align:center;}
  #pv-door h1{margin:0 0 8px;font-size:15px;font-weight:400;letter-spacing:2.4px;text-transform:uppercase;}
  #pv-door p{margin:0 0 18px;font-size:12px;color:var(--ink-mute);line-height:1.8;font-weight:400;}
  #pv-door input{width:100%;padding:12px 13px;border:1px solid var(--blush-deep);background:#fff;
    border-radius:2px;font-size:14px;outline:none;font-family:inherit;text-align:center;letter-spacing:3px;}
  #pv-door button{width:100%;margin-top:9px;padding:12px;border:0;border-radius:2px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:inherit;}
  #pv-door .err{min-height:16px;margin-top:9px;font-size:11px;color:var(--accent);}
  body.locked #pv-wrap{display:none;}
  body:not(.locked) #pv-door{display:none;}
</style>
</head>
<body>

<div id="pv-door">
  <div class="card">
    <p>비공개 화면입니다.<br>비밀번호를 입력해 주세요.</p>
    <input id="pv-pw" type="password" inputmode="numeric" autocomplete="off" placeholder="····">
    <button type="button" id="pv-go">Open</button>
    <div class="err" id="pv-err"></div>
  </div>
</div>

<div id="pv-wrap">
  <header class="ac-topbar">
    <div class="ac-inner">
      <ul class="ac-menu">
        <li><a href="dia.html">← Home</a></li>
      </ul>
      <ul class="ac-util">
        <li><a href="dia-preview-login.html">로그인</a></li>
      </ul>
    </div>
  </header>

  <div class="join">
    <div class="eyebrow">Join Dia</div>
    <h1>다이아에 오신 걸<br>환영합니다</h1>
    <p class="sub">인스타그램 아이디만 있으면 됩니다.<br>전국 어디서든 품앗이는 이어집니다.<br>가입하면 내 순번과 참여 기록이 한곳에 쌓입니다.</p>
    <div class="rule"></div>

    <div class="field">
      <label>인스타그램 아이디</label>
      <input type="text" id="insta" placeholder="@seilin_beauty.pr" autocomplete="username" autocapitalize="off" spellcheck="false">
      <div class="match" id="igMatch" aria-live="polite">
        <span class="dot"></span><span class="txt">아이디를 적으면 계정을 확인합니다.</span>
      </div>
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="pin" placeholder="숫자 4자리" inputmode="numeric" maxlength="4" autocomplete="new-password" style="letter-spacing:.45em;">
      <p class="hint">로그인할 때 쓰는 숫자 4자리입니다.</p>
    </div>

    <div class="rule" style="margin:26px 0 22px;"></div>
    <p style="margin:0 0 16px;font-size:11px;color:var(--ink-mute);letter-spacing:1.2px;text-transform:uppercase;">선택 입력</p>

    <div class="field">
      <label>이름 또는 샵명 <span class="opt">선택</span></label>
      <input type="text" id="name" placeholder="실명 또는 샵명을 입력해 주세요" autocomplete="name">
    </div>
    <div class="field">
      <label>이메일 <span class="opt">선택</span></label>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>휴대폰 <span class="opt">선택</span></label>
      <input type="tel" id="phone" placeholder="010-0000-0000" autocomplete="tel">
    </div>

    <div class="agree">
      <label class="chk all"><input type="checkbox" id="agreeAll"> 전체 동의</label>
      <label class="chk"><input type="checkbox" class="ag"> <span>만 14세 이상이며 <a href="#">이용약관</a>에 동의합니다.</span></label>
      <label class="chk"><input type="checkbox" class="ag"> <span><a href="#">개인정보 수집·이용</a>에 동의합니다. (인스타그램 아이디·이름·연락처)</span></label>
      <label class="chk"><input type="checkbox" class="ag"> <span>품앗이 안내 알림 수신에 동의합니다. (선택)</span></label>
    </div>

    <p id="joinErr" style="display:none;margin:0 0 10px;font-size:12px;color:#c95050;"></p>
    <button class="btn-main" id="joinSubmit" type="button">가입하기</button>

    <div class="or">OR</div>
    <button class="btn-social kakao" type="button">카카오로 시작하기</button>
    <button class="btn-social naver" type="button">네이버로 시작하기</button>
    <button class="btn-social google" type="button"><svg viewBox="0 0 48 48" width="15" height="15" aria-hidden="true"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>구글로 시작하기</button>

    <div class="foot-link">이미 회원이신가요?<a href="dia-preview-login.html?staff=1">로그인</a></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var KEY = atob('MDQyMw==');
  function open(){ document.body.classList.remove('locked'); }
  try{
    if (/[?&]staff=1/.test(location.search) || sessionStorage.getItem('dia_preview_ok') === '1') open();
  }catch(e){}
  var pw = document.getElementById('pv-pw'), go = document.getElementById('pv-go'), err = document.getElementById('pv-err');
  function tryOpen(){
    if (pw.value.trim() === KEY) {
      try{ sessionStorage.setItem('dia_preview_ok','1'); }catch(e){}
      err.textContent=''; open();
    } else { err.textContent='비밀번호가 맞지 않습니다.'; pw.value=''; pw.focus(); }
  }
  go.addEventListener('click', tryOpen);
  pw.addEventListener('keydown', function(e){ if (e.key==='Enter') tryOpen(); });

  /* PIN_SCRIPT */
  var pin = document.getElementById('pin');
  if (pin) {
    pin.addEventListener('input', function(){ pin.value = pin.value.replace(/[^0-9]/g,'').slice(0,4); });
  }

  /* MATCH_SCRIPT */
  var ig = document.getElementById('insta'), box = document.getElementById('igMatch');
  var t = null;
  function setState(cls, msg){ box.className = 'match ' + (cls||''); box.querySelector('.txt').textContent = msg; }
  function check(){
    var v = (ig.value||'').trim().replace(/^@/,'');
    if (!v) { setState('', '아이디를 적으면 계정을 확인합니다.'); return; }
    if (!/^[A-Za-z0-9._]{2,30}$/.test(v)) { setState('ng', '영문·숫자·점(.)만 쓸 수 있습니다.'); return; }
    setState('checking', '계정 확인 중…');
    setTimeout(function(){
      var fail = /^(test|none|없음)$/i.test(v) || v.length < 3;
      if (fail) setState('ng', '일치하는 인스타그램 계정을 찾지 못했습니다. 다시 확인해 주세요.');
      else setState('ok', '@' + v + ' 확인됨 · 활동 지역은 계정 정보로 채웁니다.');
    }, 700);
  }
  if (ig) {
    ig.addEventListener('blur', check);
    ig.addEventListener('input', function(){
      setState('', '아이디를 적으면 계정을 확인합니다.');
      clearTimeout(t); t = setTimeout(check, 900);
    });
  }

  var joinBtn = document.getElementById('joinSubmit');
  var joinErr = document.getElementById('joinErr');
  function showJoinErr(m){
    if (!joinErr) return;
    joinErr.textContent = m || '';
    joinErr.style.display = m ? 'block' : 'none';
  }
  if (joinBtn) {
    joinBtn.addEventListener('click', function(){
      showJoinErr('');
      var rawIg = (document.getElementById('insta').value || '').trim().replace(/^@+/, '');
      var pinVal = (document.getElementById('pin').value || '').trim();
      var nameVal = ((document.getElementById('name') && document.getElementById('name').value) || '').trim();
      var emailVal = ((document.getElementById('email') && document.getElementById('email').value) || '').trim();
      var phoneVal = ((document.getElementById('phone') && document.getElementById('phone').value) || '').trim();
      var ags = [].slice.call(document.querySelectorAll('.ag'));

      if (!rawIg || !/^[A-Za-z0-9._]{2,30}$/.test(rawIg)) {
        showJoinErr('올바른 인스타그램 아이디를 입력해 주세요.');
        document.getElementById('insta').focus();
        return;
      }
      if (!/^\d{4}$/.test(pinVal)) {
        showJoinErr('비밀번호 숫자 4자리를 입력해 주세요.');
        document.getElementById('pin').focus();
        return;
      }
      if (ags.length >= 2 && (!ags[0].checked || !ags[1].checked)) {
        showJoinErr('필수 약관에 동의해 주세요.');
        return;
      }

      joinBtn.disabled = true;
      joinBtn.textContent = '가입 처리 중...';
      var sk = 'direct_' + rawIg.toLowerCase().replace(/[^a-zA-Z0-9_]/g, '_').slice(0, 50);
      var nick = nameVal || rawIg;
      var FB_BASE = 'https://firestore.googleapis.com/v1/projects/seilindia/databases/(default)/documents/course_views/sns_members_v1';
      var FB_KEY = 'AIzaSyDQ1PusFvVlbgWyh0pU-2MoW7PzJZHNDKY';
      var body = { fields: { views: { mapValue: { fields: {} } } } };
      body.fields.views.mapValue.fields[sk] = {
        mapValue: {
          fields: {
            key: { stringValue: 'direct:' + rawIg.toLowerCase() },
            provider: { stringValue: 'direct' },
            name: { stringValue: nameVal || rawIg },
            email: { stringValue: emailVal },
            phone: { stringValue: phoneVal },
            ig: { stringValue: rawIg },
            nick: { stringValue: nick },
            pin: { stringValue: pinVal },
            linked: { booleanValue: true },
            updatedAt: { stringValue: new Date().toISOString() }
          }
        }
      };
      try {
        localStorage.setItem('dia_login_member', nick);
        localStorage.setItem('dia_login_member_bak', nick);
        localStorage.setItem('dia_sns_linked_ig', rawIg);
        localStorage.setItem('dia_sns_user', JSON.stringify({ provider: 'direct', key: 'direct:' + rawIg.toLowerCase(), name: nick, email: emailVal }));
        localStorage.removeItem('dia_sns_need_ig');
      } catch(e){}

      Promise.race([
        fetch(FB_BASE + '?updateMask.fieldPaths=' + encodeURIComponent('views.' + sk) + '&key=' + FB_KEY, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).catch(function(){}),
        new Promise(function(res){ setTimeout(res, 1800); })
      ]).then(function(){
        location.href = 'dia.html';
      });
    });
  }

  var all = document.getElementById('agreeAll');
  var items = [].slice.call(document.querySelectorAll('.ag'));
  if (all) {
    all.addEventListener('change', function(){ items.forEach(function(i){ i.checked = all.checked; }); });
    items.forEach(function(i){ i.addEventListener('change', function(){
      all.checked = items.every(function(x){ return x.checked; });
    }); });
  }
});
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
<script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js"></script>
<script src="dia-auth.js?v=6"></script>
<script src="preview-cursor.js?v=2"></script>
<script src="preview-live.js?v=1"></script>
</body>
</html>
