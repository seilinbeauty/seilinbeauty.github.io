<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 — 다이아 커뮤니티</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css?family=Nanum+Gothic:400,700,800" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700" rel="stylesheet">
<link rel="stylesheet" href="dia-skin-header.css?v=5">
<style>
  :root{
    --bg:#ffffff; --line:#eee8ea; --ink:#1e1a1b; --ink-soft:#665e60; --ink-mute:#9c9194; --accent:#d55576;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Roboto',"맑은 고딕",'Nanum Gothic',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 70px;}

  .mp-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:16px;}
  .mp-back:hover{color:var(--accent);}

  .mp-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:14px;}
  .mp-prof{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .mp-av{width:62px;height:62px;border-radius:50%;position:relative;overflow:hidden;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#fdeef3,#f8d6e2);color:#c2456a;font-size:24px;font-weight:900;border:2px solid #f2dce4;}
  .mp-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .mp-pinfo{min-width:0;flex:1;}
  .mp-id{font-size:12.5px;font-weight:700;color:var(--accent);}
  .mp-name{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:3px 0 4px;}
  .mp-meta{font-size:12.5px;color:var(--ink-soft);}
  .mp-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .mc-badge{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;}
  .mc-b1{color:#7a4b8f;background:#f5eef8;}
  .mc-b2{color:#8a7b81;background:#f7f5f6;}
  .mc-b3{color:#b35172;background:#fdeef3;}
  .mc-b4{color:#5b7c99;background:#eef4f9;}
  .mc-b-top{color:#a86b18;background:#fef6e4;}
  .mc-b-fire{color:#c2456a;background:#fdeef3;}
  .mc-b-seed{color:#2f7d4c;background:#ebf7ef;}
  .mc-b-pass{color:#5e4b8b;background:#f2eefc;}

  .mp-hd{font-size:14px;font-weight:800;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
  .mp-hd span{font-size:12px;font-weight:600;color:var(--ink-mute);}

  .mc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .mc-k{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;display:block;}
  .mc-k b{display:block;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.02em;}
  .mc-k span{display:block;font-size:11px;color:var(--ink-mute);margin-top:3px;font-weight:600;}
  a.mc-k:hover{border-color:#e6b8c6;background:#fdf7f9;}

  .mc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .mc-day{border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;background:#fff;}
  .mc-day .dn{font-size:11px;font-weight:700;color:var(--ink-mute);margin-bottom:4px;}
  .mc-day .ds{font-size:12.5px;font-weight:800;color:var(--ink-soft);}
  .mc-day.on{background:#fdf2f5;border-color:#ebb8c7;}
  .mc-day.on .dn,.mc-day.on .ds{color:#c2456a;}
  .mc-day.rest{background:#eef4f9;border-color:#cddde9;}
  .mc-day.rest .ds{color:#4a6b88;}

  .mp-extra{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-soft);}
  .mp-extra b{color:var(--ink);}

  .mp-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mp-shop-list{display:flex;flex-direction:column;gap:10px;}
  .mp-shop-item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;}
  .mp-shop-thumb{width:54px;height:68px;border-radius:6px;object-fit:cover;background:#f5f3f4;flex-shrink:0;}
  .mp-shop-info{flex:1;min-width:0;}
  .mp-shop-title{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp-shop-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .mp-shop-del{border:1px solid #e6d2d7;background:#fff;color:#b84866;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .mp-shop-add{font-size:12px;font-weight:800;color:#fff;background:#1e1a1b;padding:5px 11px;border-radius:999px;}
  .mp-lbtn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;
    border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:800;color:var(--ink);}
  .mp-lbtn:hover{border-color:#dcb9c4;background:#fdf7f9;}
  .mp-lbtn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}

  .mp-empty{text-align:center;padding:56px 20px;}
  .mp-empty .ico{font-size:36px;margin-bottom:10px;}
  .mp-empty h2{margin:0 0 8px;font-size:18px;font-weight:800;}
  .mp-empty p{margin:0 0 20px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .mp-empty-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .mp-empty-btns a{padding:11px 22px;border-radius:999px;font-size:13px;font-weight:800;}
  .mp-empty-btns a.p{background:var(--ink);color:#fff;}
  .mp-empty-btns a.g{border:1.5px solid var(--line);color:var(--ink);}

  @media(max-width:600px){
    .mc-kpis{grid-template-columns:repeat(2,1fr);}
    .mp-links{grid-template-columns:1fr;}
  }

.mp-av-wrap { position: relative; display: inline-block; flex-shrink: 0; cursor: pointer; }
.mp-av-cam { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1.5px solid #e7ccd5; display: flex; align-items: center; justify-content: center; font-size: 11px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
.mp-edit-btn { margin-left: auto; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid #ecd5dc; background: #fff; color: #7a4b5a; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
.mp-edit-box { display: none; margin-top: 12px; padding: 12px; border-radius: 12px; background: #fff9fb; border: 1px solid #f2dce4; }
.mp-edit-box.open { display: block; }
.mp-edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.mp-edit-row label { display: block; font-size: 11px; font-weight: 700; color: #8c737d; margin-bottom: 4px; }
.mp-edit-row input, .mp-edit-row select { width: 100%; height: 34px; border: 1px solid #e7cfd7; border-radius: 8px; padding: 0 10px; font-size: 12.5px; font-family: inherit; box-sizing: border-box; background: #fff; }
.mp-edit-acts { display: flex; justify-content: flex-end; gap: 6px; }
.mp-edit-acts button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; border: 1px solid #e6ccd5; background: #fff; color: #5c444d; }
.mp-edit-acts button.save { background: #c9707f; border-color: #c9707f; color: #fff; }

</style>

</head>
<body>

<header class="dia-header">
  <a href="dia.html" class="brand">
    <span class="brand-logo">DIA COMMUNITY</span><span class="brand-sub">속눈썹·반영구·네일아트·피부관리·왁싱·붙임머리</span>

  <nav class="nav-links">

<main class="wrap">

  <div id="mpGuest" class="mp-card mp-empty" style="display:none;">

    </section>

      <div class="mp-hd">내가 올린 수강 <a href="dia-my-course.html" class="mp-shop-add">+ 수강 등록</a></div>

<script src="dia-members.js?v=2"></script>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function norm(s){ return String(s||'').trim().replace(/^@+/,'').toLowerCase(); }

  var rawMem = '';
  try { rawMem = localStorage.getItem('dia_login_member') || localStorage.getItem('dia_login_member_bak') || ''; } catch(e){}
  var linkedIg = '';
  try { linkedIg = localStorage.getItem('dia_sns_linked_ig') || ''; } catch(e){}

  var ab = document.getElementById('mpAuthBtn');
  var jb = document.getElementById('mpJoinBtn');
  if (ab && (rawMem || linkedIg)) {
    ab.textContent = '로그아웃';
    ab.href = '#logout';
    if (jb) jb.style.setProperty('display','none','important');
    ab.addEventListener('click', function(ev){
      ev.preventDefault();
      try {
        ['dia_login_member','dia_login_member_bak','dia_no_track','dia_sns_need_ig','dia_sns_linked_ig','dia_sns_joined_ts','dia_sns_user'].forEach(function(k){ localStorage.removeItem(k); });
      } catch(e){}
      location.href = 'dia.html';
    });
  }

  var list = Array.isArray(window.DIA_MEMBERS) ? window.DIA_MEMBERS : [];
  var m = null;
  if (rawMem) {
    try {
      var parsed = JSON.parse(rawMem);
      if (parsed && typeof parsed === 'object') m = parsed;
    } catch(e){}
    if (!m) {
      var q = norm(rawMem);
      for (var i = 0; i < list.length; i++) {
        var it = list[i];
        if ((it.i && norm(it.i) === q) || norm(it.n) === q) { m = it; break; }
      }
    }
  }
  if (!m && linkedIg) {
    var q2 = norm(linkedIg);
    for (var j = 0; j < list.length; j++) {
      if (list[j].i && norm(list[j].i) === q2) { m = list[j]; break; }
    }
    if (!m) {
      var jts = 0;
      try { jts = Number(localStorage.getItem('dia_sns_joined_ts') || 0); } catch(e){}
      m = {
        n: linkedIg, i: linkedIg, o: '신규회원', r: '지역 미설정', c: '뷰티',
        mc: 0, tot: 0, rk: 0, lw: 0, b: 0, sk: 0, nw: true,
        jd: jts ? new Date(jts).toISOString() : '',
        w: [0,0,0,0,0,0,0]
      };
    }
  }

  if (!m) {
    document.getElementById('mpGuest').style.display = '';
    return;
  }

  document.getElementById('mpBody').style.display = '';

  var curMem = (m && (m.n || m.i)) || linkedIg || '';
  var snsInfo = null;
  try { snsInfo = JSON.parse(localStorage.getItem('dia_sns_auth') || 'null'); } catch (e) {}
  var profKey = 'dia_custom_profile_' + curMem;
  var customProf = {};
  try { customProf = JSON.parse(localStorage.getItem(profKey) || '{}') || {}; } catch (e) {}
  if (customProf.r) m.r = customProf.r;
  if (customProf.c) m.c = customProf.c;

  var idLine = m.i ? ('@' + m.i + (m.o ? ' · ' + m.o : '')) : (m.o || '정회원');
  var avSrc = customProf.photo ? customProf.photo : (m.i ? ('avatars/' + esc(m.i) + '.jpg') : (snsInfo && snsInfo.photo ? snsInfo.photo : ''));
  var snsFallback = (!customProf.photo && snsInfo && snsInfo.photo) ? snsInfo.photo : '';
  var avHtml = avSrc
    ? '💎<img id="mpAvImg" src="' + esc(avSrc) + '" alt="' + esc(m.n) + '" onerror="var fb=this.getAttribute('data-fb');if(fb){this.removeAttribute('data-fb');this.src=fb;}else{this.remove();}"' + (snsFallback && avSrc !== snsFallback ? ' data-fb="' + esc(snsFallback) + '"' : '') + '>'
    : '💎';

  var badges = [];
  if (m.o) {
    var cls = String(m.o).indexOf('방장') >= 0 ? 'mc-b1' : (String(m.o).indexOf('스태프') >= 0 ? 'mc-b3' : 'mc-b2');
    badges.push('<span class="mc-badge ' + cls + '">' + esc(m.o) + '</span>');
  }
  if (m.l) badges.push('<span class="mc-badge mc-b4">휴식 중</span>');
  if (m.rk && m.rk >= 1 && m.rk <= 5 && String(m.o||'').indexOf('방장') < 0) badges.push('<span class="mc-badge mc-b-top">💎 TOP ' + m.rk + '</span>');
  if (m.sk && m.sk >= 2) badges.push('<span class="mc-badge mc-b-fire">🔥 ' + m.sk + '일 연속</span>');
  if (m.b && m.b >= 3) badges.push('<span class="mc-badge mc-b-pass">🎟️ 패스 부자</span>');


  var provMap = { google: '구글 간편 로그인', kakao: '카카오 간편 로그인', naver: '네이버 간편 로그인' };
  var loginMethod = (snsInfo && snsInfo.provider && provMap[snsInfo.provider]) ? provMap[snsInfo.provider] : '일반 로그인';
  badges.push('<span class="mc-badge mc-b2">🔑 ' + esc(loginMethod) + '</span>');

  var vKey = 'dia_visit_cnt_' + curMem;
  var visitCnt = 1;
  try {
    visitCnt = parseInt(localStorage.getItem(vKey) || '0', 10) || 0;
    if (!sessionStorage.getItem('dia_visited_' + curMem)) {
      visitCnt += 1;
      localStorage.setItem(vKey, String(visitCnt));
      sessionStorage.setItem('dia_visited_' + curMem, '1');
    }
    if (visitCnt < 1) visitCnt = 1;
  } catch (e) {}
  var isNw = m.nw && (!m.jd && !m.joinedAt ? true : (Date.now() - Date.parse(m.jd || m.joinedAt)) < 86400000);
  if (isNw) badges.push('<span class="mc-badge mc-b-seed">🌱 새싹</span>');

  document.getElementById('mpProfCard').innerHTML =
    '<div class="mp-prof">' +
      '<label class="mp-av-wrap" title="프로필 사진 변경">' +
        '<div class="mp-av" id="mpAvBox">' + avHtml + '</div>' +
        '<span class="mp-av-cam">📷</span>' +
        '<input type="file" id="mpAvFile" accept="image/*" style="display:none;">' +
      '</label>' +
      '<div style="min-width:0;flex:1;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<div class="mp-nm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(m.n) + '</div>' +
          '<button type="button" class="mp-edit-btn" id="mpEditBtn">✏️ 지역·업종</button>' +
        '</div>' +
        '<div class="mp-id">' + esc(idLine) + '</div>' +
        '<div class="mp-meta" id="mpMetaLine">' + esc(m.r || '지역 미상') + ' · ' + esc(m.c || '업종 미상') + ' · 이번 달 ' + (m.mc || 0) + '회</div>' +
      '</div>' +
    '</div>' +
    '<div class="mp-edit-box" id="mpEditBox">' +
      '<div class="mp-edit-row">' +
        '<div><label for="mpEditR">지역</label><input type="text" id="mpEditR" value="' + esc(m.r || '') + '" placeholder="예: 서울, 경기, 부산"></div>' +
        '<div><label for="mpEditC">업종</label><input type="text" id="mpEditC" value="' + esc(m.c || '') + '" placeholder="예: 속눈썹, 반영구, 네일"></div>' +
      '</div>' +
      '<div class="mp-edit-acts">' +
        '<button type="button" id="mpEditCancel">취소</button>' +
        '<button type="button" class="save" id="mpEditSave">저장</button>' +
      '</div>' +
    '</div>' +
    (badges.length ? '<div class="mp-badges">' + badges.join('') + '</div>' : '');

  (function(){
    var fIn = document.getElementById('mpAvFile');
    if (fIn) {
      fIn.addEventListener('change', function(){
        var file = fIn.files && fIn.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          var img = new Image();
          img.onload = function(){
            var c = document.createElement('canvas');
            c.width = 240; c.height = 240;
            var ctx = c.getContext('2d');
            var s = Math.min(img.width, img.height);
            var sx = (img.width - s) / 2, sy = (img.height - s) / 2;
            ctx.drawImage(img, sx, sy, s, s, 0, 0, 240, 240);
            var dataUrl = c.toDataURL('image/jpeg', 0.82);
            customProf.photo = dataUrl;
            try { localStorage.setItem(profKey, JSON.stringify(customProf)); } catch(e){}
            var box = document.getElementById('mpAvBox');
            if (box) box.innerHTML = '💎<img id="mpAvImg" src="' + dataUrl + '" alt="' + esc(m.n) + '">';
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    var eb = document.getElementById('mpEditBtn');
    var ebox = document.getElementById('mpEditBox');
    var ec = document.getElementById('mpEditCancel');
    var es = document.getElementById('mpEditSave');
    if (eb && ebox) eb.addEventListener('click', function(){ ebox.classList.toggle('open'); });
    if (ec && ebox) ec.addEventListener('click', function(){ ebox.classList.remove('open'); });
    if (es) {
      es.addEventListener('click', function(){
        var nr = (document.getElementById('mpEditR').value || '').trim();
        var nc = (document.getElementById('mpEditC').value || '').trim();
        customProf.r = nr || m.r || '';
        customProf.c = nc || m.c || '';
        try { localStorage.setItem(profKey, JSON.stringify(customProf)); } catch(e){}
        var meta = document.getElementById('mpMetaLine');
        if (meta) meta.textContent = (customProf.r || '지역 미상') + ' · ' + (customProf.c || '업종 미상') + ' · 이번 달 ' + (m.mc || 0) + '회';
        if (ebox) ebox.classList.remove('open');
      });
    }
  })();

  var days = ['월','화','수','목','금','토','일'];
  var w = Array.isArray(m.w) ? m.w : [0,0,0,0,0,0,0];
  var dayHtml = days.map(function(d, idx){
    var v = w[idx];
    var on = v === 1 || v === true || v === 'O' || v === '○' || v === '참여';
    var rest = v === '휴식' || v === 'R';
    return '<div class="mc-day' + (on ? ' on' : (rest ? ' rest' : '')) + '">' +
      '<div class="dn">' + d + '</div>' +
      '<div class="ds">' + (on ? '참여' : (rest ? '휴식' : '-')) + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('mpActCard').innerHTML =
    '<div class="mp-hd">다이아 활동기록<span>이번 주 현황</span></div>' +
    '<div class="mc-kpis">' +
      '<div class="mc-k"><b>' + (m.tot || 0) + '회</b><span>전체 누적</span></div>' +
      '<div class="mc-k"><b>' + (m.rk ? m.rk + '위' : '-') + '</b><span>이번 달 순위</span></div>' +
      '<div class="mc-k"><b>' + (m.lw || 0) + '회</b><span>지난주 참여</span></div>' +
      '<a class="mc-k" href="dia-pass.html"><b>' + (m.b || 0) + '</b><span>완료패스</span></a>' +
    '</div>' +
    '<div class="mc-days">' + dayHtml + '</div>' +
    '<div class="mp-extra">' +
      '<div>방문 횟수 <b id="mpVisitCnt">' + visitCnt + '회</b></div>' +
      '<div>로그인 방식 <b>' + esc(loginMethod) + '</b></div>' +
      '<div>인스타 연동 <b>' + (m.i ? '@' + esc(m.i) : '미연동') + '</b></div>' +
      '<div>이번 달 참여 <b>' + (m.mc || 0) + '회</b></div>' +
      (m.sk ? '<div>연속 참여 <b>' + m.sk + '일</b></div>' : '') +
      (m.no ? '<div>회원 번호 <b>' + esc(m.no) + '번</b></div>' : '') +
    '</div>';

  (function loadMyShops(){
    var FS_SHOP_URL = 'https://firestore.googleapis.com/v1/projects/seilindia/databases/(default)/documents/course_views/shop_listings_v1';
    var listEl = document.getElementById('mpShopList');
    var keys = [rawMem, m.i, m.n, linkedIg].filter(Boolean).map(norm);
    function isMine(it){
      if (!it || !it.authorId) return false;
      var a = norm(it.authorId);
      if (keys.indexOf(a) >= 0) return true;
      try {
        var p = JSON.parse(it.authorId);
        if (p && (keys.indexOf(norm(p.i)) >= 0 || keys.indexOf(norm(p.n)) >= 0)) return true;
      } catch(e){}
      return false;
    }
    function drawMyShops(allArr){
      var mine = allArr.filter(isMine);
      if (!mine.length) {
        listEl.innerHTML = '<div style="font-size:12.5px;color:#9c9194;padding:8px 0;">아직 등록한 샵매물이 없습니다.</div>';
        return;
      }
      listEl.innerHTML = mine.map(function(it){
        var thumb = (it.imgs && it.imgs[0]) ? '<img class="mp-shop-thumb" src="'+esc(it.imgs[0])+'">' : '<div class="mp-shop-thumb"></div>';
        var price = (it.depTxt || '협의') + ' / 월 ' + (it.rentTxt || '협의');
        return '<div class="mp-shop-item">' +
          thumb +
          '<div class="mp-shop-info">' +
            '<a href="dia-shop.html" class="mp-shop-title">['+esc(it.area)+'/'+esc(it.kind)+'] '+esc(it.title)+'</a>' +
            '<div class="mp-shop-meta">'+esc(price)+' · '+esc(it.at||'')+'</div>' +
          '</div>' +
          '<button type="button" class="mp-shop-del" data-id="'+esc(it.id)+'">삭제</button>' +
        '</div>';
      }).join('');
      listEl.querySelectorAll('.mp-shop-del').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (!confirm('이 매물을 삭제할까요?')) return;
          var tid = btn.getAttribute('data-id');
          var nextArr = allArr.filter(function(x){ return x && x.id !== tid; });
          fetch(FS_SHOP_URL, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fields: { items: { stringValue: JSON.stringify(nextArr) } } })
          }).then(function(){ drawMyShops(nextArr); });
        });
      });
    }
    fetch(FS_SHOP_URL + '?t=' + Date.now()).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      var arr = [];
      try{
        var raw = d && d.fields && d.fields.items && d.fields.items.stringValue;
        arr = raw ? JSON.parse(raw) : [];
      }catch(e){}
      drawMyShops(Array.isArray(arr) ? arr : []);
    }).catch(function(){
      listEl.innerHTML = '<div style="font-size:12.5px;color:#9c9194;">등록 매물을 불러오지 못했습니다.</div>';
    });
  })();

  (function loadMyCourses(){
    var listEl = document.getElementById('mpCourseList');
    var nick = String(m.n || m.i || '').trim();
    if (!nick) { listEl.innerHTML = '<div style="font-size:12.5px;color:#9c9194;padding:8px 0;">아직 등록한 수강이 없습니다.</div>'; return; }
    var docId = encodeURIComponent(nick.split('/').join('|'));
    var base = 'https://firestore.googleapis.com/v1/projects/seilindia/databases/(default)/documents/';
    function readDoc(coll){
      return fetch(base + coll + '/' + docId + '?t=' + Date.now()).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
    }
    Promise.all([readDoc('course_approved'), readDoc('course_submissions')]).then(function(res){
      var items = [];
      res.forEach(function(doc, idx){
        if (!doc || !doc.fields) return;
        var f = doc.fields;
        var g = function(k){ return f[k] && f[k].stringValue ? f[k].stringValue : ''; };
        var title = g('course') || g('title') || g('intro') || (g('area') + ' ' + g('job') + ' 수강');
        var st = idx === 0 ? '노출 중' : (g('status') || '검토 중');
        items.push({ title: title, area: g('area'), job: g('job'), benefit: g('benefit'), status: st });
      });
      if (!items.length) {
        listEl.innerHTML = '<div style="font-size:12.5px;color:#9c9194;padding:8px 0;">아직 등록한 수강이 없습니다.</div>';
        return;
      }
      listEl.innerHTML = items.map(function(c){
        return '<div class="mp-shop-item">' +
          '<div class="mp-shop-info">' +
            '<a href="dia-my-course.html" class="mp-shop-title">['+esc(c.status)+'] '+esc(c.title)+'</a>' +
            '<div class="mp-shop-meta">'+esc([c.area, c.job, c.benefit].filter(Boolean).join(' · ') || '내 수강 관리에서 수정할 수 있어요')+'</div>' +
          '</div>' +
          '<a href="dia-my-course.html" class="mp-shop-del" style="color:#1e1a1b;border-color:#e4d8da;">수정</a>' +
        '</div>';
      }).join('');
    }).catch(function(){
      listEl.innerHTML = '<div style="font-size:12.5px;color:#9c9194;padding:8px 0;">아직 등록한 수강이 없습니다.</div>';
    });
  })();
})();
</script>
