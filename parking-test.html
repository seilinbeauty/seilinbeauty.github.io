<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>주차 캘린더 터치·드래그 임시 확인</title>
<style>
  body{margin:0;padding:10px;background:#3a3237;color:#fff;font-family:sans-serif;}
  #wrap{display:flex;gap:14px;align-items:flex-start;}
  iframe{width:390px;height:844px;border:0;border-radius:12px;background:#fff;flex:0 0 auto;}
  #log{margin:0;font-size:11px;line-height:1.5;white-space:pre-wrap;max-width:900px;color:#ffe3ea;}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="fr" src="parking.html?notrack=1"></iframe>
  <pre id="log">준비 중…</pre>
</div>
<script>
(function(){
  var fr = document.getElementById('fr');
  var logEl = document.getElementById('log');
  var lines = [];
  function log(s){ lines.push(s); logEl.textContent = lines.join('\n'); }

  function build(){
    var d = fr.contentDocument, w = fr.contentWindow;
    if (!d || !d.getElementById('timetable')) { setTimeout(build, 300); return; }
    // 실제 손가락이 닿는 곳을 확인할 수 있도록 .tt-blocks 겹침만 잠시 뚫어 둔다
    var st = d.createElement('style');
    st.textContent = '#timetable .tt-blocks{pointer-events:none !important}' +
                     '#timetable .tt-b{pointer-events:auto !important}';
    d.head.appendChild(st);

    var tt = d.getElementById('timetable');
    var H = 21;   /* 1시간 = 21px */

    function probe(id, label, top){
      var b = d.createElement('button');
      b.id = id;
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('aria-label', '탐침 ' + label);
      b.style.cssText = 'position:absolute;left:58%;width:22px;height:22px;margin:-11px 0 0 -11px;' +
        'border:1px dashed #17a34a;background:rgba(23,163,74,.18);color:#0f6b33;' +
        'font-size:8px;font-weight:800;line-height:1;padding:0;z-index:9;border-radius:6px;';
      b.style.top = top + 'px';
      tt.appendChild(b);
      return b;
    }

    function ensure(){
      var blk = d.querySelector('#timetable .tt-b.me');
      if (!d.getElementById('p1500')) { probe('p1500', '15', 15 * H); }
      if (!d.getElementById('p1830')) { probe('p1830', '18:30', 18.5 * H); }
      if (!d.getElementById('p1930')) { probe('p1930', '19:30', 19.5 * H); }
      if (blk) {
        var bottom = blk.offsetTop + blk.offsetHeight;
        var hb = d.getElementById('phandle');
        if (!hb) { hb = probe('phandle', 'H', bottom - 10); }
        hb.style.top = (bottom - 10) + 'px';
      }
      logEl.setAttribute('data-ready', '1');
    }

    var obs = new (w.MutationObserver || MutationObserver)(function(){ setTimeout(ensure, 0); });
    obs.observe(tt, { childList: true });
    ensure();
    w.__ensureProbe = ensure;
    log('준비 완료');
  }
  fr.addEventListener('load', function(){ setTimeout(build, 500); });
})();
</script>
</body>
</html>
